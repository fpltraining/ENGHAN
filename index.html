const GRAM_B2 = [
{n:1,t:'Hiện tại hoàn thành và quá khứ đơn',b:'Quá khứ đơn: việc đã xong, có mốc thời gian rõ (yesterday, in 2019, last week).\nHiện tại hoàn thành: việc còn dính tới hiện tại, không nói rõ lúc nào.\n\nNgười Việt hay sai: nói "I have gone to Da Nang last year". Có "last year" là phải dùng quá khứ đơn.',ex:['I went to Da Nang last year.','I have been to Da Nang three times.','She has just finished the report.','We finished the report at six.']},
{n:2,t:'Hiện tại hoàn thành tiếp diễn',b:'Nhấn vào quá trình kéo dài, thường còn đang tiếp tục, hoặc để lại dấu vết nhìn thấy được.\nHave/has + been + V-ing.\n\nKhác biệt: "I have read the file" = đọc xong. "I have been reading the file" = đọc nãy giờ, có thể chưa xong.',ex:['I have been waiting for two hours.','She has been working here since 2020.','Your eyes are red — have you been crying?','They have been arguing all morning.']},
{n:3,t:'Quá khứ hoàn thành',b:'Việc xảy ra TRƯỚC một việc quá khứ khác. Had + V3.\nDùng khi thứ tự thời gian không theo thứ tự kể.\n\nNgười Việt hay bỏ qua thì này vì tiếng Việt chỉ cần thêm "đã… rồi".',ex:['When I arrived, she had already left.','He had never seen the sea before that day.','They had finished dinner by the time we came.','I realised I had forgotten my keys.']},
{n:4,t:'used to · would · be used to',b:'used to + V: thói quen cũ, nay không còn.\nwould + V: thói quen cũ lặp lại, chỉ dùng cho hành động, không dùng cho trạng thái.\nbe/get used to + V-ing: đã quen với việc gì (khác hẳn hai cái trên).\n\nRất dễ lẫn: "I am used to wake up early" là SAI, phải là "waking".',ex:['I used to smoke, but I quit.','Every summer we would go to the beach.','I am used to waking up at five.','She is getting used to the new job.']},
{n:5,t:'Tương lai: will · going to · hiện tại tiếp diễn',b:'will: quyết định ngay lúc nói, dự đoán không căn cứ.\nbe going to: đã định trước, hoặc dự đoán có dấu hiệu.\nHiện tại tiếp diễn: lịch hẹn đã chốt với người khác.\n\nNgười Việt dùng "will" cho tất cả — nghe không tự nhiên.',ex:["It's cold. I'll close the window.",'I am going to start a course next month.','Look at those clouds — it is going to rain.','I am meeting the client at three tomorrow.']},
{n:6,t:'Future perfect và future continuous',b:'will have + V3: sẽ xong trước một mốc tương lai.\nwill be + V-ing: đang diễn ra tại một mốc tương lai.\n\nHai thì này ít gặp trong nói nhưng rất hay gặp trong email công việc.',ex:['By Friday I will have finished the report.','This time tomorrow I will be flying to Seoul.','She will have worked here for ten years in June.','Do not call at eight — I will be driving.']},
{n:7,t:'Câu điều kiện loại 1',b:'If + hiện tại đơn, will + V. Điều kiện có thật, có thể xảy ra.\nSau "if" KHÔNG dùng will.\n\nNgười Việt hay viết "If it will rain" — sai.',ex:['If it rains, we will stay home.','If you finish early, call me.','She will pass if she studies.','If I have time, I will help you.']},
{n:8,t:'Câu điều kiện loại 2',b:'If + quá khứ đơn, would + V. Giả định trái hiện tại.\nVới "to be" dùng "were" cho mọi ngôi trong văn trang trọng.\n\nĐây là câu để nói về điều không có thật lúc này.',ex:['If I had more time, I would learn piano.','If I were you, I would take the job.','What would you do if you lost your phone?','If she spoke English, she would get the job.']},
{n:9,t:'Câu điều kiện loại 3 và hỗn hợp',b:'Loại 3: If + had + V3, would have + V3. Tiếc nuối về quá khứ.\nHỗn hợp: điều kiện quá khứ nhưng kết quả ở hiện tại.\n\nCâu loại 3 là dấu hiệu rõ nhất của trình độ B2 trở lên.',ex:['If I had studied, I would have passed.','If we had left earlier, we would not have missed it.','If I had taken that job, I would be in Tokyo now.','She would have called if she had known.']},
{n:10,t:'wish và if only',b:'wish + quá khứ đơn: ước hiện tại khác đi.\nwish + had + V3: tiếc quá khứ.\nwish + would: khó chịu vì thói quen của người khác.\n\nif only mạnh hơn wish, dùng khi cảm xúc nặng hơn.',ex:['I wish I spoke Japanese.','I wish I had not said that.','I wish you would stop interrupting.','If only we had more time.']},
{n:11,t:'Bị động ở các thì',b:'be + V3, chia "be" theo thì cần dùng.\nDùng khi ai làm không quan trọng, hoặc không biết, hoặc muốn tránh nói ra.\n\nTiếng Anh viết trang trọng dùng bị động nhiều hơn tiếng Việt rất nhiều.',ex:['The report is written every month.','The road was built in 1998.','The system is being upgraded.','The files have been deleted.']},
{n:12,t:'Bị động với động từ tường thuật',b:'It is said that… / He is said to… — dùng khi đưa tin chưa xác thực.\nRất hay gặp trên báo và trong báo cáo.\n\nHai cách viết cùng một ý, cách thứ hai gọn hơn.',ex:['It is said that the company is closing.','The company is said to be closing.','It was believed that the site was safe.','He is thought to have left the country.']},
{n:13,t:'Mệnh đề quan hệ xác định',b:'who cho người, which cho vật, that cho cả hai.\nKhông có dấu phẩy. Bỏ đi thì câu mất nghĩa.\nKhi đại từ quan hệ làm tân ngữ thì bỏ được.',ex:['The man who called you is my boss.','The file which I sent is missing.','The house that we bought is old.','The book I read last night was excellent.']},
{n:14,t:'Mệnh đề quan hệ không xác định',b:'Có dấu phẩy hai bên. Chỉ thêm thông tin phụ, bỏ đi câu vẫn đủ nghĩa.\nKHÔNG được dùng "that" ở loại này.\n\nNgười Việt hay quên dấu phẩy, làm đổi hẳn nghĩa câu.',ex:['My brother, who lives in Hue, is a doctor.','The report, which took three weeks, is finally done.','Da Lat, where I grew up, is cold at night.','She passed the exam, which surprised everyone.']},
{n:15,t:'Rút gọn mệnh đề quan hệ',b:'Chủ động: bỏ who/which + be, đổi động từ sang V-ing.\nBị động: bỏ who/which + be, giữ V3.\n\nCâu rút gọn làm văn viết gọn hơn hẳn — dấu hiệu của người viết chắc tay.',ex:['The man standing there is my father.','The letter written in 1920 is in the museum.','Students living far away can apply.','Any question raised will be answered.']},
{n:16,t:'Câu tường thuật',b:'Lùi thì một bậc, đổi đại từ và trạng ngữ thời gian.\nnow → then · today → that day · tomorrow → the next day · here → there.\n\nNếu điều được nói vẫn đúng ở hiện tại thì không bắt buộc lùi thì.',ex:['She said she was tired.','He told me he had finished it.','They said they would come the next day.','She said the earth goes around the sun.']},
{n:17,t:'Câu hỏi gián tiếp',b:'Sau từ để hỏi, trật tự trở lại như câu kể — KHÔNG đảo, KHÔNG dùng do/does.\nCâu hỏi có/không thì dùng if hoặc whether.\n\nĐây là lỗi B1 phổ biến nhất: "Can you tell me where is the station?" — sai.',ex:['Can you tell me where the station is?','I wonder what time it starts.','Do you know if she is coming?','He asked whether I had finished.']},
{n:18,t:'Modal suy đoán hiện tại',b:'must be: chắc chắn đúng · can\'t be: chắc chắn không · might/may/could be: có thể.\nDùng khi suy luận, không phải khi biết chắc.\n\nNgười Việt hay dùng "maybe" đứng đầu câu cho mọi thứ — nghe rất sơ cấp.',ex:['She must be at work — her car is gone.','That can\'t be right.','He might be stuck in traffic.','They could be waiting outside.']},
{n:19,t:'Modal suy đoán quá khứ',b:'must have + V3: chắc chắn đã xảy ra.\ncan\'t have + V3: chắc chắn không xảy ra.\nshould have + V3: lẽ ra nên làm mà đã không làm.\n\nCấu trúc "should have" là cách tự trách hoặc góp ý rất thông dụng.',ex:['He must have forgotten.','She can\'t have seen us.','You should have told me earlier.','I shouldn\'t have eaten so much.']},
{n:20,t:'Gerund và infinitive',b:'Một số động từ theo sau bởi V-ing: enjoy, avoid, finish, suggest, mind, keep.\nMột số theo sau bởi to V: want, decide, hope, promise, agree, refuse.\nSau giới từ luôn là V-ing.\n\nKhông có quy tắc chung — phải nhớ theo động từ.',ex:['I enjoy reading before bed.','She decided to leave.','He is good at solving problems.','They avoided answering the question.']},
{n:21,t:'Động từ đổi nghĩa theo gerund hay infinitive',b:'remember/forget/stop/try đổi nghĩa hẳn tuỳ đi với cái nào.\nstop to smoke = dừng lại để hút · stop smoking = bỏ hút.\nremember to lock = nhớ mà khoá · remember locking = nhớ là đã khoá.',ex:['I stopped to buy coffee.','I stopped drinking coffee.','Remember to send the file.','I remember sending the file.']},
{n:22,t:'So sánh nâng cao',b:'the + so sánh hơn, the + so sánh hơn: càng… càng…\ntwice/three times as… as: gấp đôi, gấp ba.\nnot nearly as… as: kém xa.\n\nNhững cấu trúc này làm câu văn linh hoạt hơn hẳn "more than".',ex:['The more you practise, the easier it gets.','This costs twice as much as that one.','It is not nearly as hard as I thought.','She works far harder than anyone else.']},
{n:23,t:'Đảo ngữ cơ bản',b:'Khi trạng ngữ phủ định đứng đầu câu thì phải đảo trợ động từ lên trước chủ ngữ.\nNever, Rarely, Seldom, Not only, No sooner, Little.\n\nDùng trong văn viết trang trọng hoặc khi muốn nhấn mạnh.',ex:['Never have I seen such a mess.','Not only did he refuse, he also complained.','Rarely does she make a mistake.','No sooner had we left than it rained.']},
{n:24,t:'Liên từ và trạng ngữ nối',b:'although / though + mệnh đề · despite / in spite of + danh từ hoặc V-ing.\nhowever đứng đầu câu mới, có dấu phẩy · whereas dùng để so sánh hai vế.\n\nLỗi hay gặp: "Despite it was raining" — sai, phải là "Despite the rain".',ex:['Although it was raining, we went out.','Despite the rain, we went out.','The plan is cheap; however, it is slow.','He likes tea, whereas she prefers coffee.']},
];

/* --- 12 điểm nâng cao C1 (Chặng 3 và 4) --- */
const GRAM_C1 = [
{n:1,t:'Câu chẻ để nhấn mạnh',b:'It + be + phần nhấn + that/who…\nWhat + mệnh đề + be… — đưa trọng tâm ra sau.\n\nĐây là cách nhấn mạnh mà không cần in đậm hay dùng "very".',ex:['It was Linh who found the error.','It is the timing that worries me.','What surprised me was his tone.','What we need is more data.']},
{n:2,t:'Đảo ngữ nâng cao',b:'Only after / Only when / Not until + mệnh đề, rồi đảo ở mệnh đề chính.\nHardly… when · Scarcely… before.\n\nDùng đúng chỗ thì rất mạnh; dùng nhiều quá thì thành sáo rỗng.',ex:['Only when the light failed did they stop.','Not until later did we realise the cost.','Hardly had she spoken when the phone rang.','Under no circumstances should you sign it.']},
{n:3,t:'Danh hoá',b:'Biến động từ và tính từ thành danh từ để câu văn cô đọng và khách quan hơn.\ndecide → decision · analyse → analysis · able → ability.\n\nVăn học thuật và báo cáo tiếng Anh dùng danh hoá rất dày.',ex:['The decision was made quickly.','Our analysis of the data shows a gap.','His refusal surprised everyone.','There has been a sharp reduction in cost.']},
{n:4,t:'Mạo từ trong văn trang trọng',b:'Danh từ đếm được số nhiều mang nghĩa chung thì không có mạo từ.\nDanh từ không đếm được mang nghĩa chung cũng vậy.\nDùng "the" khi đã xác định hoặc là cái duy nhất.\n\nĐây là lỗi còn sót lại lâu nhất ở người Việt, kể cả trình độ cao.',ex:['Managers often underestimate risk.','Water is essential to life.','The manager of this branch is new.','The risk we identified is serious.']},
{n:5,t:'Nói giảm và rào đón',b:'tend to · appear to · suggest that · it may be the case that · relatively.\nTrong tiếng Anh học thuật, khẳng định tuyệt đối bị coi là thiếu cẩn trọng.\n\nNgười Việt viết tiếng Anh hay khẳng định quá mạnh so với chuẩn.',ex:['The data suggest a link.','Costs tend to rise in the third quarter.','This appears to be the main cause.','The results are relatively consistent.']},
{n:6,t:'Cấu trúc song song',b:'Các thành phần cùng vai trò trong một câu phải cùng dạng ngữ pháp.\nSai: "She likes reading, to swim and hikes."\nĐúng: "She likes reading, swimming and hiking."\n\nLỗi này làm câu văn lệch nhịp ngay cả khi ngữ pháp từng phần đều đúng.',ex:['We came, we saw, we left.','The job requires patience, focus and speed.','He is responsible for hiring, training and evaluating staff.','Either you fix it or you replace it.']},
{n:7,t:'Mệnh đề phân từ',b:'Rút gọn mệnh đề trạng ngữ bằng V-ing hoặc V3.\nChủ ngữ hai mệnh đề phải là một, nếu không sẽ thành câu treo.\n\nSai: "Walking home, the rain started." — mưa đâu có đi bộ.',ex:['Walking home, I saw the fire.','Written in 1890, the book still sells.','Having finished the report, she went home.','Not knowing the answer, he stayed quiet.']},
{n:8,t:'Thức giả định',b:'Sau suggest, recommend, insist, demand, essential, important — dùng động từ nguyên mẫu, không chia.\nKhông thêm -s dù chủ ngữ là ngôi thứ ba.\n\nNghe lạ tai nhưng đây là chuẩn trang trọng.',ex:['I suggest that he be informed.','It is essential that she attend.','They demanded that the fee be waived.','We recommend that the file remain closed.']},
{n:9,t:'Trọng âm câu',b:'Tiếng Anh nhấn vào từ mang thông tin mới, nuốt nhẹ từ chức năng.\nĐổi chỗ nhấn là đổi hẳn ý câu.\n\nTiếng Việt phát âm đều từng tiếng — đây là lý do người Việt nói tiếng Anh nghe phẳng.',ex:['I did not say she stole it.','I did not say SHE stole it.','I did not say she STOLE it.','I did not SAY she stole it.']},
{n:10,t:'Giọng trang trọng và thân mật',b:'Trang trọng: động từ gốc Latin, câu dài, bị động, không viết tắt.\nThân mật: phrasal verb, câu ngắn, viết tắt, câu hỏi đuôi.\n\nViết email công việc bằng giọng thân mật là lỗi nghề nghiệp, không phải lỗi ngữ pháp.',ex:['We were unable to locate the file. (trang trọng)',"We couldn't find the file. (thân mật)",'Please find the report attached.','Here is the report — have a look.']},
{n:11,t:'Phrasal verb nghĩa bóng',b:'Cùng một phrasal verb có nghĩa đen và nghĩa bóng rất khác nhau.\nĐây là rào cản lớn khi nghe người bản xứ nói chuyện tự nhiên.\n\nHọc theo tình huống, đừng học theo danh sách.',ex:['The deal fell through. (đổ bể)','She brushed off the criticism. (phủi đi)','They are cutting back on staff. (cắt giảm)','It boils down to money. (rút lại chỉ là)']},
{n:12,t:'Thành ngữ dùng được trong công việc',b:'Thành ngữ làm câu nói tự nhiên, nhưng dùng sai chỗ thì phản tác dụng.\nChỉ dùng khi đã nghe người bản xứ dùng trong đúng tình huống đó.\n\nAn toàn nhất: hiểu khi nghe, dùng ít khi nói.',ex:['Let us touch base next week.','That is a long shot.','We are back to square one.','It is a grey area.']},
];

  const shell = document.createElement('div');

  shell.innerHTML =

    '<div class="title" id="title"></div>' +
    '<button class="ui" id="inkb">BÚT</button>' +
    '<button class="ui" id="smaller">A−</button>' +

  let inkMode = false, penColor = '#1C6DD0', penSize = 4.2, erasing = false;

  /* --- lật trang --- */
  const paint = () => {

    const p = pages[cur], f = p && p.querySelector('.pfoot span');

  const nrm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9' ]/g, '').replace(/\s+/g, ' ').trim();
  const work = S.bookWork || (S.bookWork = {});
  qq('input.gap').forEach(inp => {
    const id = inp.dataset.id;
    if (work[id]) { inp.value = work[id]; mark(inp, id); }
    inp.addEventListener('input', () => { work[id] = inp.value; inp.classList.remove('ok', 'no'); save(); });
    inp.addEventListener('blur', () => { if (inp.value.trim()) mark(inp, id); });
  });
  function mark(inp, id) {
    const want = BOOK.ans[id]; if (want == null) return;
    const ok = want.split('|').some(x => nrm(x) === nrm(inp.value));
    inp.classList.toggle('ok', ok); inp.classList.toggle('no', !ok);
    const ck = root.querySelector('.ck[data-for="' + id + '"]');
    if (ck) { ck.textContent = ok ? '✓' : '✕'; ck.style.color = ok ? '#1F9D55' : '#C0524A'; }
    return ok;
  }

    const g = b.dataset.check; let ok = 0, all = 0;
    qq('input.gap').forEach(inp => { if (inp.dataset.id.split('-')[0] === g) { all++; if (mark(inp, inp.dataset.id)) ok++; } });
    const sc = root.querySelector('#sc-' + g); if (sc) sc.textContent = ok + '/' + all;
    S.bookScore = Object.assign({}, S.bookScore, { [g]: ok + '/' + all }); save();
  });
  qq('[data-reveal]').forEach(b => b.onclick = () => {
    const g = b.dataset.reveal;
    qq('input.gap').forEach(inp => {
      if (inp.dataset.id.split('-')[0] !== g) return;
      const want = BOOK.ans[inp.dataset.id]; if (want == null) return;

        const bx = qy[i * 3] / 1e3 * W, by = qy[i * 3 + 1] / 1e3 * Hh, bp = qy[i * 3 + 2] / 9;
        const mx = i > 1 ? (qy[(i - 2) * 3] / 1e3 * W + ax) / 2 : ax, my = i > 1 ? (qy[(i - 2) * 3 + 1] / 1e3 * Hh + ay) / 2 : ay;

    };

        if (dx * dx + dy * dy < 1.1) continue;

        const n = qy.length / 3;
        const AX = qy[(n - 2) * 3] / 1e3 * W, AY = qy[(n - 2) * 3 + 1] / 1e3 * Hh;
        const MX = n > 2 ? (qy[(n - 3) * 3] / 1e3 * W + AX) / 2 : AX, MY = n > 2 ? (qy[(n - 3) * 3 + 1] / 1e3 * Hh + AY) / 2 : AY;
        ctx.strokeStyle = cur2.c; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineWidth = wOf(cur2.b, (qy[(n - 2) * 3 + 2] / 9 + p[2] / 9) / 2);
        ctx.beginPath(); ctx.moveTo(MX, MY); ctx.quadraticCurveTo(AX, AY, (AX + p[0] / 1e3 * W) / 2, (AY + p[1] / 1e3 * Hh) / 2); ctx.stroke();
      }
    });

    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);

    idb.get(key).then(v => { if (v && v.s) { strokes = v.s; redraw(); } });
    return { fit, undo: () => { if (strokes.length) { undone.push(strokes.pop()); redraw(); persist(); } }, redo: () => { if (undone.length) { strokes.push(undone.pop()); redraw(); persist(); } }, clear: () => { strokes = []; redraw(); persist(); } };
  }

  /* --- thanh bút --- */
  qq('.pentools .sw').forEach(sw => sw.onclick = () => {
    penColor = sw.dataset.c; erasing = false;
    qq('.pentools .sw').forEach(x => x.classList.toggle('on', x === sw));
  });
  const pb = (id, fn) => { const b = q('#' + id); if (b) b.onclick = fn; };
  pb('undo', () => inked[cur] && inked[cur].undo());
  pb('redo', () => inked[cur] && inked[cur].redo());
  pb('erase', () => { erasing = !erasing; q('#erase').style.background = erasing ? 'var(--teal)' : 'transparent'; });
  pb('clearp', () => inked[cur] && inked[cur].clear());
  q('#inkb').onclick = () => {
    inkMode = !inkMode;
    shell.classList.toggle('ink', inkMode);
    q('#inkb').textContent = inkMode ? 'ĐỌC' : 'BÚT';
    if (inkMode) ensureInk(cur), inked[cur] && inked[cur].fit();
  };

  requestAnimationFrame(() => { book.scrollLeft = cur * book.clientWidth; paint(); });
}
const isDark = () => {

      ${g.v.map(v => `<div class="wordline" style="align-items:center">

    <button class="btn sm ghost" data-irrmode="table">Xem bảng</button></div>
  <section class="sheet">
    <div class="eyebrow">${esc(it.g)}</div>
    <p class="big en" style="margin-top:8px">${esc(it.v[0])}</p>
    <p class="vi">${esc(it.v[3])}</p>

    ${r ? `<p class="diff" style="margin-top:12px">${diffHTML(r.d)}</p>
      <div class="row" style="margin-top:10px"><span class="pill ${r.right ? 'ok' : 'bad'}">${r.right ? 'đúng' : 'chưa đúng'}</span>
      <span class="mid">${esc(it.v[0])} · ${esc(it.v[1])} · ${esc(it.v[2])}</span>${sayBtn(it.v[0] + ', ' + it.v[1] + ', ' + it.v[2], '')}</div>`
      : `<div class="row" style="margin-top:10px"><button class="btn pri" id="irrcheck">${svg('check')}Chấm</button></div>`}

}
let AVIRR = null;
function irrStart() {

function payload2(st, n, key) {
  const i = n - 1;
  if (key === 'coll') { const th = COLLOC[i % COLLOC.length]; const k = Math.floor(i / COLLOC.length) % 3; return { t: th.t, v: th.v.slice(k * 5, k * 5 + 5) }; }
  if (key === 'gram2') return GRAM_B2[i % GRAM_B2.length];
  if (key === 'gram3') return GRAM_C1[i % GRAM_C1.length];
  if (key === 'shadow') return SHADOW[i % SHADOW.length];
  if (key === 'retell') return SPEAK_TASKS[i % SPEAK_TASKS.length];
  if (key === 'write3') return WRITE_TASKS[i % WRITE_TASKS.length];
  if (key === 'mytext') return null;
  return null;
}
function hint2(st, n, key) {
  const p = payload2(st, n, key);
  if (key === 'coll') return p.t + ' · ' + p.v.length + ' cụm';
  if (key === 'gram2' || key === 'gram3') return p.t;
  if (key === 'shadow') return p.t;
  if (key === 'retell') return p.t.slice(0, 46) + (p.t.length > 46 ? '…' : '');
  if (key === 'write3') return p.g + ' · ' + p.w + ' từ';
  if (key === 'mytext') { const c = (S.texts || []).length; return c ? c + ' bài trong thư viện' : 'dán bài đọc của bạn vào'; }
  if (key === 'review') { const d = dueCards().length; return d ? d + ' thẻ đến hạn' : 'chưa có thẻ nào đến hạn'; }
  return '';
}

/* đo tốc độ đọc */
let wpmT = null;
function wpmBox(host, words) {
  let started = null;
  const paint = () => {
    host.innerHTML = started
      ? `<button class="btn pri sm" id="wpmstop">Dừng — đã đọc xong</button> <span class="timer" id="wpmclock">0:00</span>`
      : `<button class="btn sm" id="wpmstart">Bấm giờ đọc</button>`;
    const a = host.querySelector('#wpmstart'), b = host.querySelector('#wpmstop');
    if (a) a.onclick = () => { started = Date.now(); paint(); tick(); };
    if (b) b.onclick = () => {
      clearInterval(wpmT);
      const sec = (Date.now() - started) / 1000;
      const wpm = Math.round(words / (sec / 60));
      S.metrics.wpm.push({ wpm, ts: TODAY() }); save(true);
      started = null; paint();
      toast('Tốc độ đọc: ' + wpm + ' từ/phút');
    };
  };
  const tick = () => {
    clearInterval(wpmT);
    wpmT = setInterval(() => {
      const c = host.querySelector('#wpmclock'); if (!c || !started) { clearInterval(wpmT); return; }
      const s = Math.floor((Date.now() - started) / 1000);
      c.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }, 500);
  };
  paint();
}

/* thêm bài mới */
async function addText(title, body) {
  const clean = String(body).replace(/\r/g, '').split(/\n{1,}/).map(x => x.trim()).filter(Boolean);
  const all = clean.join(' ').split(/\s+/).filter(Boolean);
  if (all.length < 20) { toast('Bài quá ngắn — dán ít nhất 20 từ', 'bad'); return null; }
  const uniq = new Set(all.map(w => w.toLowerCase().replace(/[^a-z']/g, '')).filter(Boolean));
  let unknown = 0;
  uniq.forEach(w => { const k = STEM(w) || w; if (!has(k) && S.words[k] === undefined) unknown++; });
  const id = uid();
  await idb.set('text:' + id, { p: clean });
  S.texts = (S.texts || []).concat([{
    id, title: (title || '').trim() || 'Bài không tên', words: all.length,
    ts: TODAY(), newPct: Math.round(unknown / Math.max(1, uniq.size) * 100),
  }]);
  save(true);
  return id;
}

let talkT = null;
function mountTalk(box, sec, id) {
  let mr = null, chunks = [], clip = null, t0 = null;
  const paint = (running, elapsed) => {
    box.innerHTML = `
      <div class="row split"><span class="eyebrow">Nói và tự ghi âm</span>
        <span class="timer" id="tclock">${fmt(elapsed || 0)} / ${fmt(sec)}</span></div>
      <div class="row" style="margin-top:12px">
        <button class="btn ${running ? 'red' : 'pri'}" id="talkbtn">${svg('mic')}${running ? 'Dừng lại' : 'Bắt đầu nói'}</button>
        ${clip ? `<button class="btn ghost sm" id="tplay">${svg('play')}Nghe lại</button>` : ''}
      </div>
      ${!running && elapsed ? `<p class="note" style="margin-top:12px">Bạn nói ${elapsed} giây${elapsed >= sec ? ' — đủ thời lượng.' : ', đề yêu cầu ' + sec + ' giây. Thử lại và cố nói tiếp khi bí thay vì dừng.'}</p>` : ''}
      <p class="lede" style="margin-top:10px">Nghe lại chính mình là bài tập khó chịu nhất và hiệu quả nhất. Đếm xem bạn dừng bao nhiêu lần.</p>`;
    box.querySelector('#talkbtn').onclick = () => running ? stop() : start();
    const pl = box.querySelector('#tplay'); if (pl) pl.onclick = () => new Audio(clip).play();
  };
  const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function start() {
    unlock(); t0 = Date.now(); paint(true, 0);
    clearInterval(talkT);
    talkT = setInterval(() => {

/* ==========================================================================
   Mô hình buổi học
   ========================================================================== */
const N0 = 30, N1 = 90;
const sess = () => S.sess[S.stage] || (S.sess[S.stage] = {});
const total = () => STAGES[S.stage].total;
function curSession() { const m = sess(), t = total(); for (let n = 1; n <= t; n++) if (!(m[n] && m[n].done)) return n; return t; }
const viewSession = () => S.cur || curSession();
const weekOf = (n) => D.weeks[clamp(Math.ceil(n / 7), 1, 13) - 1];
const phaseOf = (w) => D.ph.find(p => w >= p.w[0] && w <= p.w[1]) || D.ph[2];

function blocksFor(n) {
  if (S.stage >= 2) return BLOCKS[S.stage].map(([label, min, key]) => ({ label, min, key }));
  if (!S.stage) return D.ph0.blocks.map(([label, min, key]) => ({ label, min, key }));
  return phaseOf(weekOf(n).n).blocks.map(([label, min, key]) => ({ label, min, key }));
}
/* nội dung của một buổi */
function payload(n, key) {
  if (S.stage >= 2) return payload2(S.stage, n, key);
  if (!S.stage) {
    const i = n - 1;
    if (key === 'sound') return D.sounds[i % 12];
    if (key === 'core') return D.core[i] || D.core[D.core.length - 1];
    if (key === 'gram') return D.gram[i] || D.gram[D.gram.length - 1];
    if (key === 'speak') return D.phr[i] || D.phr[0];
    if (key === 'dict') { const all = A1SENT; return all.slice((i * 5) % Math.max(1, all.length - 5), (i * 5) % Math.max(1, all.length - 5) + 5); }
  } else {
    const w = weekOf(n), k = (n - 1) % 7;
    if (key === 'vocab') return w.words.slice(k * 9, k * 9 + 9);
    if (key === 'book') return w;
    if (key === 'story') return { week: w.n, ch: D.sb.chapters[w.n - 1] };
    if (key === 'speak') return D.sent[w.n] || D.sent[1];
    if (key === 'write') return { week: w.n, gist: D.gist[w.n] };
    if (key === 'dict') return (D.sent[w.n] || D.sent[1]).slice(0, 5).map(s => s.en);
  }
  return null;
}
const A1SENT = D.sa.chapters.reduce((a, c) => a.concat(c.en), []);

function markBlock(n, i, on) {
  const m = sess(); const d = m[n] || (m[n] = { blocks: {}, date: TODAY() });
  d.blocks[i] = on; d.date = TODAY();
  const bl = blocksFor(n);
  d.done = bl.every((_, k) => d.blocks[k]);
  if (d.done && !d.doneAt) d.doneAt = TODAY();
  save();
}

   Vỏ ứng dụng

function DAY0TASK(n) {
  return ['Đọc kỹ phần giải thích âm, nghe từng cặp ba lần, rồi tự đọc lại.',

function blockHint(n, key) {
  if (S.stage >= 2) return hint2(S.stage, n, key);
  const p = payload(n, key);
  if (key === 'sound') return p.pairs.length + ' cặp từ dễ lẫn';

  if (key === 'speak') return (p[0].en || p[0][0]) + '…';
  if (key === 'dict') return 'nghe rồi viết tay bằng bút';

  if (key === 'story') return 'Chương ' + p.week + ' · ' + p.ch.title;
  if (key === 'book') return p.lesson.h;
  if (key === 'write') return 'viết tay rồi tự sửa bằng bút đỏ';
  return '';
}

/* --- ôn tập FSRS --- */
function buildQueue() {
  const t = TODAY();
  let pool = S.cards.filter(c => (c.due || t) <= t);
  if (pool.length < 8) {
    const rest = S.cards.filter(c => (c.due || t) > t).sort((a, b) => (a.due || '').localeCompare(b.due || ''));
    pool = pool.concat(rest.slice(0, 8 - pool.length));
  }
  return pool.sort((a, b) => (a.st || 0) - (b.st || 0) || Math.random() - .5).slice(0, 40).map(c => c.id);
}
function actReview() { return reviewBody(actHead('Ôn tập'), true); }
function viewSrs() { if (!AV) { AV = { key: 'review', standalone: true, queue: buildQueue(), step: 0, res: {} }; } return `<div class="col">${reviewBody('<div class="eyebrow">Ôn tập</div><h2 class="big">Thẻ đến hạn hôm nay</h2>', false)}</div>`; }

  const q = AV.queue || [];

  const c = S.cards.find(x => x.id === q[0]);
  if (!c) { AV.queue = q.slice(1); return reviewBody(head, inSession); }
  const shown = AV.shown, r = AV.res.cur;
  const left = q.length;
  if (c.mode === 'spell') {
    return head + `<section class="sheet">
      <div class="row split"><span class="pill">${left} thẻ còn lại</span><span class="pill ${c.hard ? 'bad' : ''}">${c.hard ? 'từ cứng đầu' : 'độ bền ' + Math.round(c.st) + 'd'}</span></div>
      <p class="vi" style="font-size:19px;margin-top:14px">${esc(c.vi)}</p>
      <div class="row" style="margin-top:10px">${sayBtn(c.en, 'Nghe từ')}${sayBtn(c.en, 'Chậm', true)}</div>

function storyBody(ch, vi, key) {
  const paras = ch.text || ch.en || [];
  const showVi = S.showVi;
  return `<section class="sheet">
    <div class="row split" style="margin-bottom:12px">
      <span class="eyebrow">Chương ${ch.n} · ${esc(ch.title)}${ch.vi ? ' — ' + esc(ch.vi) : ''}</span>

    <div class="readwrap" id="readwrap">
      <div class="reader" id="reader">${paras.map((p, i) => `<p data-p="${i}">${tokenize(p)}</p>${showVi && vi && vi[i] ? `<p class="vi" style="margin:-.6em 0 1.1em">${esc(vi[i])}</p>` : ''}`).join('')}</div>
      ${S.inkOn ? '<div id="inkoverlay"></div>' : ''}

    <p class="lede" style="margin-top:14px">Chạm một từ để tra nghĩa và nghe. <span style="background:var(--amber-w);box-shadow:inset 0 -1.5px 0 var(--amber);border-radius:3px;padding:0 3px">vàng</span> = chưa biết · <span style="background:var(--teal-w);border-radius:3px;padding:0 3px">xanh</span> = đang học · không màu = đã thuộc.</p>
    <div class="row" style="margin-top:12px">

function tokenize(p) {
  return p.replace(/([A-Za-zÀ-ỹ']+)|([^A-Za-zÀ-ỹ']+)/g, (m, w, o) => {
    if (o) return esc(o);
    const k = w.toLowerCase(), st = S.words[STEM(k) || k];
    const known = st === undefined ? (has(STEM(k) || k) ? 2 : 0) : st;
    return `<span class="w" data-w="${esc(w)}" data-k="${known}">${esc(w)}</span>`;
  });
}

      <p class="lede" style="margin-top:12px">Ở nhịp 45–60 phút mỗi ngày, chặng 0 và 1 mất khoảng 4 tháng. Đi hết C1 mất 18–24 tháng. Không có đường tắt ba tháng.</p>

/* ==========================================================================
   Gắn sự kiện sau mỗi lần vẽ lại
   ========================================================================== */
function mount() {
  const pane = $('#pane');

  /* điều hướng buổi */
  $$('[data-sess]', pane).forEach(b => b.onclick = () => { S.cur = +b.dataset.sess; if (S.cur === curSession()) S.cur = null; save(); render(); });
  $$('[data-blk]', pane).forEach(b => b.onclick = () => { unlock(); openActivity(viewSession(), +b.dataset.blk); });
  $$('[data-stage]', pane).forEach(b => b.onclick = () => { S.stage = +b.dataset.stage; S.cur = null; save(); go('today'); });
  $$('[data-close]', pane).forEach(b => b.onclick = () => closeActivity(b.dataset.close === '1'));
  $$('[data-step]', pane).forEach(b => b.onclick = () => {
    if (b.dataset.add) { const [e, v] = b.dataset.add.split('|'); if (addWord(e, v, 'buổi ' + AV.n)) toast('Đã thêm "' + e + '" vào sổ ôn'); }
    AV.step = +b.dataset.step; AV.shown = false; AV.res = {}; render();
  });
  $$('[data-btab]', pane).forEach(b => b.onclick = () => { S.bookTab = b.dataset.btab; save(); render(); });
  $$('[data-ch]', pane).forEach(b => b.onclick = () => { S.readSel = +b.dataset.ch; save(); render(); });
  $$('[data-rbook]', pane).forEach(b => b.onclick = () => { S.readBook = b.dataset.rbook; S.readSel = 0; save(); render(); });
  $$('[data-irrmode]', pane).forEach(b => b.onclick = () => {
    S.irrMode = b.dataset.irrmode; if (S.irrMode === 'drill' && !AVIRR) irrStart(); save(); render();
  });

  /* sách bài tập 29 trang */
  const bh = $('#bookhost', pane); if (bh) mountBook(bh);

  /* động từ bất quy tắc */
  const ic = $('#irrcheck', pane);
  if (ic) ic.onclick = () => {
    const it = AVIRR.queue[AVIRR.i % AVIRR.queue.length];
    const got = $('#irrin').value.trim(); if (!got) return toast('Viết dạng V2 vào ô trước đã');
    const want = it.v[1];
    const right = want.split('/').some(x => norm(x) === norm(got));
    AVIRR.res = { got, right, d: letterDiff(want.split('/')[0], got) };
    AVIRR.all++; if (right) AVIRR.ok++;
    S.irr = Object.assign({}, S.irr, { [it.v[0]]: right ? (S.irr && S.irr[it.v[0]] || 0) + 1 : 0 });
    save(); render();
  };
  const inx = $('#irrnext', pane);
  if (inx) inx.onclick = () => { AVIRR.i++; AVIRR.res = null; render(); };

  /* bút */
  if ($('#pad', pane)) mountPad($('#pad', pane), { height: 230, key: 'pad:' + (AV ? AV.key + ':' + AV.n + ':' + (AV.step || 0) : VIEW), color: AV && AV.key === 'write' ? 'red' : 'ink' });

  /* chính tả */
  const dc = $('#dictcheck', pane);
  if (dc) dc.onclick = () => {
    const got = $('#dictin').value.trim(); if (!got) return toast('Viết câu vào ô trước đã');
    const list = AV.data.map(x => typeof x === 'string' ? x : x.en);
    const k = clamp(AV.step, 0, list.length - 1);
    AV.res[k] = { got, d: letterDiff(list[k], got) };
    render();
  };

  /* ôn tập */
  const sc = $('#srscheck', pane);
  if (sc) sc.onclick = () => {
    const c = S.cards.find(x => x.id === AV.queue[0]);
    const got = $('#srsin').value.trim();
    AV.res.cur = { got, d: letterDiff(c.en, got) }; AV.shown = true; render();
  };
  const sf = $('#srsflip', pane); if (sf) sf.onclick = () => { AV.shown = true; render(); };
  $$('[data-grade]', pane).forEach(b => b.onclick = () => {
    const c = S.cards.find(x => x.id === AV.queue[0]);
    const g = +b.dataset.grade;
    grade(c, g);
    AV.queue = g === 0 ? AV.queue.slice(1).concat(c.id) : AV.queue.slice(1);
    AV.shown = false; AV.res = {};
    if (!AV.queue.length && AV.standalone) { toast('Xong hết thẻ đến hạn hôm nay'); }
    render();
  });

  /* nói */
  const sb = $('#speakbox', pane) || $('#soundspeak', pane);
  if (sb) mountSpeak(sb, sb.dataset.target || (AV.data.pairs ? AV.data.pairs.map(p => p[1]).join(', ') : ''));

  /* đọc */
  const rd = $('#reader', pane);
  if (rd && rd.dataset.txt) {
    idb.get('text:' + rd.dataset.txt).then(v => {
      const cur = $('#reader', $('#pane'));
      if (!cur || cur.dataset.txt !== rd.dataset.txt) return;
      cur.innerHTML = (v && v.p ? v.p : ['Không mở được bài này.']).map(x => `<p>${tokenize(x)}</p>`).join('');
      const vb = $('#vibtn', $('#pane'));
      if (vb) vb.onclick = () => { unlock(); say((v && v.p ? v.p : []).join(' ')); };
    });
  }
  if (rd) {
    rd.onclick = (e) => { const w = e.target.closest('.w'); if (w) wordPop(w); };
    const vb = $('#vibtn', pane); if (vb) vb.onclick = () => { S.showVi = !S.showVi; save(); render(); };
    const ib = $('#inkbtn', pane); if (ib) ib.onclick = () => { S.inkOn = !S.inkOn; save(); render(); };
    const mr = $('#markread', pane); if (mr) mr.onclick = () => {
      S.read[mr.dataset.chid] = TODAY(); save(); toast('Đã ghi nhận chương này'); render();
    };
    const ov = $('#inkoverlay', pane);
    if (ov) {
      const h = rd.getBoundingClientRect().height;
      ov.style.cssText = 'position:absolute;inset:0';
      mountPad(ov, { height: Math.max(240, h), ruled: false, key: S.readBook === 'extra' ? 'note:extra:' + S.extraStory : 'note:' + (S.stage ? 'b' : 'a') + (S.readSel || 0) });
      const pw = $('.padwrap', ov); if (pw) { pw.style.background = 'transparent'; pw.style.border = '0'; }
      const pt = $('.padtools', ov); if (pt) { pt.style.position = 'sticky'; pt.style.bottom = '0'; pt.style.borderRadius = '10px'; pt.style.boxShadow = 'var(--shadow)'; }
    }
  }

  /* viết — dùng chung cho Chặng 1 và Chặng 3/4 */
  const pidOf = () => AV.key === 'write3' ? AV.data.id : WRITE_PROMPTS(AV.data.week, AV.data.gist).id;
  const wireWrite = (taSel, btnSel, wcSel, suffix) => {
    const ta = $(taSel, pane); if (!ta) return;
    const wc = $(wcSel, pane);
    const count = () => { const n = ta.value.trim().split(/\s+/).filter(Boolean).length; if (wc) wc.textContent = n + ' từ'; return n; };
    ta.oninput = count; count();
    const b = $(btnSel, pane); if (!b) return;
    b.onclick = () => {
      const pid = pidOf() + suffix, n = count();
      const i = S.writes.findIndex(x => x.pid === pid);
      const rec = { pid, text: ta.value, words: n, ts: TODAY() };
      if (i >= 0) S.writes[i] = rec; else S.writes.push(rec);
      save(true); toast('Đã lưu ' + n + ' từ');
    };
  };
  if (AV && (AV.key === 'write' || AV.key === 'write3')) {
    wireWrite('#wrin', '#wsave', '#wc', '');
    wireWrite('#wrin2', '#wsave2', '#wc2', ':v2');
  }

  /* thư viện bài đọc của bạn */
  const tadd = $('#taddbtn', pane);
  if (tadd) tadd.onclick = async () => {
    const id = await addText($('#ttitle', pane).value, $('#tbody', pane).value);
    if (id) { S.openText = id; save(true); toast('Đã thêm bài vào thư viện'); render(); }
  };
  $$('[data-txtopen]', pane).forEach(b => b.onclick = () => { S.openText = b.dataset.txtopen; save(); render(); });
  $$('[data-txtclose]', pane).forEach(b => b.onclick = () => { S.openText = null; save(); render(); });
  $$('[data-txtdel]', pane).forEach(b => b.onclick = async () => {
    const id = b.dataset.txtdel;
    S.texts = S.texts.filter(x => x.id !== id); S.openText = null;
    await idb.del('text:' + id); save(true); toast('Đã xoá bài'); render();
  });

  /* đo tốc độ đọc */
  const wb = $('#wpmbtn', pane);
  if (wb) {
    const meta = (S.texts || []).find(x => x.id === S.openText);
    const holder = document.createElement('span'); wb.replaceWith(holder);
    wpmBox(holder, meta ? meta.words : 0);
  }

  /* nói theo đề, có bấm giờ */
  const tb = $('#talkbox', pane);
  if (tb) mountTalk(tb, +tb.dataset.sec, tb.dataset.id);

  /* tiến độ */
  const ex = $('#export', pane);
  if (ex) ex.onclick = async () => {
    ex.disabled = true; ex.textContent = 'Đang gom dữ liệu…';
    const keys = (await idb.keys()) || [];
    const ink = {}; for (const k of keys) ink[k] = await idb.get(k);
    const json = JSON.stringify({ app: 'inklish', at: new Date().toISOString(), S, ink });
    const name = 'inklish-' + TODAY() + '.json';
    ex.disabled = false; ex.textContent = 'Xuất file sao lưu';
    /* trên claude.ai phải xin phép qua downloads; mở từ máy nhà thì tải thẳng */
    let dl = null;
    try { dl = (window.claude && claude.use) ? await claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data: json }); }
      catch (err) {
        const c = err && err.code;
        if (c === 'declined') return;
        return toast(c === 'too_large' ? 'File quá lớn. Xoá bớt nét viết tay cũ rồi thử lại.' : 'Không lưu được file sao lưu.', 'bad');
      }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    S.lastBackup = TODAY(); save(true); toast('Đã xuất file sao lưu');
  };
  const im = $('#import', pane);
  if (im) im.onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const j = JSON.parse(r.result); if (!j.S) throw 0;
        S = Object.assign({}, BLANK, j.S); save(true);
        if (j.ink) for (const k of Object.keys(j.ink)) await idb.set(k, j.ink[k]);
        toast('Đã nhập lại dữ liệu'); render();
      } catch (err) { toast('File không đọc được', 'bad'); }
    };
    r.readAsText(f);
  };
  const vs = $('#voice', pane);
  if (vs) vs.onchange = () => { S.voice = vs.value; save(); say('This is the voice you picked.'); };

  /* đồng hồ buổi học */
  if (AV) startClock();
}

/* ---------- đồng hồ ---------- */
let clockT = null;
function startClock() {
  clearInterval(clockT);
  const el = $('#clock'); if (!el) return;
  const tick = () => {
    const left = AV ? AV.min * 60 - Math.floor((Date.now() - AV.started) / 1000) : 0;
    const c = $('#clock'); if (!c) { clearInterval(clockT); return; }
    const m = Math.floor(Math.abs(left) / 60), s = Math.abs(left) % 60;
    c.textContent = (left < 0 ? 'quá ' : 'còn ') + m + ':' + String(s).padStart(2, '0');
    c.style.color = left < 0 ? 'var(--amber)' : '';
  };
  tick(); clockT = setInterval(tick, 1000);
}

/* ---------- popup tra từ ---------- */
let popEl = null;
function wordPop(span) {
  closePop();
  const w = span.dataset.w, key = STEM(w.toLowerCase()) || w.toLowerCase();
  const vi = mean(key) || lookup(w);
  const st = S.words[key];
  const cur = st === undefined ? (vi ? 0 : 3) : st;
  popEl = document.createElement('div');
  popEl.className = 'pop';
  popEl.innerHTML = `<b class="en">${esc(w)}</b>
    ${vi ? `<div class="m">${esc(vi)}</div>`
      : `<div class="m">Chưa có trong từ điển. Tự viết nghĩa — từ bạn tự tra sẽ nhớ lâu hơn.</div>
         <input class="scribble" id="mydefin" style="font-size:16px;line-height:1.7;background-image:none;padding:8px 10px" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="nghĩa tiếng Việt…">`}
    <div class="row">${sayBtn(w, 'Nghe')}<button class="btn sm pri" data-addw="1">${vi ? 'Thêm vào sổ' : 'Lưu nghĩa và thêm vào sổ'}</button></div>
    <div class="ks">${['chưa biết', 'đang học', 'quen mặt', 'đã thuộc'].map((l, i) =>
    `<button data-k="${i}" aria-pressed="${cur === i}">${l}</button>`).join('')}</div>`;
  document.body.appendChild(popEl);
  const r = span.getBoundingClientRect(), pr = popEl.getBoundingClientRect();
  popEl.style.left = clamp(r.left, 10, innerWidth - pr.width - 10) + 'px';
  popEl.style.top = (r.bottom + pr.height + 12 > innerHeight ? r.top - pr.height - 8 : r.bottom + 8) + 'px';
  say(w);
  popEl.addEventListener('click', (e) => {
    const k = e.target.closest('[data-k]');
    if (k) { S.words[key] = +k.dataset.k; save(); span.dataset.k = k.dataset.k; closePop(); return; }
    if (e.target.closest('[data-addw]')) {
      let m = vi;
      if (!m) {
        const inp = popEl.querySelector('#mydefin');
        m = inp ? inp.value.trim() : '';
        if (!m) { inp && inp.focus(); return toast('Viết nghĩa vào ô trước đã'); }
        S.mydict = Object.assign({}, S.mydict, { [key]: m });
      }
      if (addWord(w.toLowerCase(), m, 'bài đọc')) toast('Đã thêm "' + w + '" vào sổ ôn'); else toast('Từ này đã có trong sổ');
      save(true); span.dataset.k = 1; closePop();
    }
  });
  setTimeout(() => document.addEventListener('pointerdown', outside, { once: true }), 0);
}
function outside(e) { if (popEl && !popEl.contains(e.target)) closePop(); }
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }

/* ---------- khối luyện nói ---------- */
function mountSpeak(box, target) {
  if (!target) { box.innerHTML = '<p class="lede">Không có câu để chấm.</p>'; return; }
  let rec = null, mr = null, chunks = [], clipURL = null;
  const paint = (state, res, note, clip) => {
    box.innerHTML = `
      <div class="row split"><span class="eyebrow">Đọc to câu trên</span>
        ${res ? `<span class="pill ${res.score >= 80 ? 'ok' : res.score >= 55 ? 'warn' : 'bad'}">${res.score}%</span>` : ''}</div>
      ${res ? `<p class="diff" style="margin-top:10px">${res.words.map((w, i) =>
      `<span class="${res.mark[i] === 'ok' ? 'ok' : res.mark[i] === 'miss' ? 'miss' : 'add'}">${esc(w)}</span>`).join(' ')}</p>` : ''}
      ${res && endingNote(res) ? `<p class="note warn" style="margin-top:10px">${esc(endingNote(res))}</p>` : ''}
      ${note ? `<p class="note" style="margin-top:10px">${esc(note)}</p>` : ''}
      <div class="row" style="margin-top:12px">
        <button class="btn ${state === 'rec' ? 'red' : 'pri'}" id="micbtn">${svg('mic')}${state === 'rec' ? 'Đang nghe… chạm để dừng' : 'Nói thử'}</button>
        ${clip ? `<button class="btn ghost sm" id="playclip">${svg('play')}Nghe lại giọng mình</button>` : ''}
      </div>`;
    $('#micbtn', box).onclick = () => state === 'rec' ? stop() : start();
    const pc = $('#playclip', box); if (pc) pc.onclick = () => { const a = new Audio(clip); a.play(); };
  };
  function stop() { try { rec && rec.stop(); } catch (e) { } try { mr && mr.state !== 'inactive' && mr.stop(); } catch (e) { } }
  function start() {
    unlock();
    if (navigator.mediaDevices && window.MediaRecorder) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(st => {
        chunks = []; mr = new MediaRecorder(st);
        mr.ondataavailable = e => e.data.size && chunks.push(e.data);
        mr.onstop = () => { st.getTracks().forEach(t => t.stop()); if (chunks.length) { clipURL = URL.createObjectURL(new Blob(chunks)); paint('idle', lastRes, lastNote, clipURL); } };
        mr.start();
      }).catch(() => { });
    }
    if (!hasSR) { paint('rec', null, 'Máy này không chấm được phát âm. Bạn vẫn ghi âm rồi nghe lại và so với giọng mẫu.'); return; }
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 4; rec.continuous = false;
    rec.onresult = (e) => {
      let best = null;
      for (let k = 0; k < e.results[0].length; k++) {
        const a = align(target, e.results[0][k].transcript);
        if (!best || a.score > best.score) best = a;
      }
      lastRes = best; lastNote = '';
      const prev = S.speak[target] || 0;
      if (best.score > prev) { S.speak[target] = best.score; save(); }
      paint('idle', best, '', clipURL);
    };
    rec.onerror = (e) => {
      lastNote = e.error === 'not-allowed' ? 'Chưa cấp quyền micro. Cài đặt → Safari → Micrô.'
        : e.error === 'no-speech' ? 'Không nghe thấy gì. Nói to hơn và gần máy hơn.'
          : 'Cần mạng để chấm phát âm (' + e.error + ').';
      paint('idle', lastRes, lastNote, clipURL);
    };
    rec.onend = () => { try { mr && mr.state !== 'inactive' && mr.stop(); } catch (er) { } };
    try { rec.start(); paint('rec', null, ''); } catch (e) { paint('idle', null, 'Không mở được micro.'); }
  }
  let lastRes = null, lastNote = hasSR ? '' : 'Trình duyệt này không chấm được phát âm — bạn vẫn ghi âm và tự so được.';
  paint('idle', null, lastNote);
}

if (false) { load();
if (S.theme && S.theme !== 'auto') document.documentElement.setAttribute('data-theme', S.theme);
resolveColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { resolveColors(); render(); });
/* gieo hạt: buổi đầu tiên đã có sẵn vài thẻ để phần Ôn không trống trơn */
if (!S.seeded.first) {
  D.core[0].slice(0, 8).forEach(([e, v]) => { S.cards.push(mkCard(e, v, 'spell', 'khởi động')); });

}
render();
document.addEventListener('pointerdown', unlock, { once: true }); }
