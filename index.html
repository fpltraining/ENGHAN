 the list early, and nobody looks at normal.","The four symbols did not spell words. They spelled a number, in base four, and the number was recalculated every cycle, and the whole enormous forty-seven-year repetition was one sentence being said over and over with one value changed each time.","In 1974 the number was 3,341.","Last month it was 2,907.","It was going down.","Mai remembers the argument that followed as the worst week of her professional life, because the reading was ambiguous in precisely the way that matters. A number that decreases can be a countdown — time remaining. Or it can be a census — how many are left.","Grammatically, the columns could not tell them which. There is no tense in a number. Context is the only thing that disambiguates it, and context was the one thing they did not have.","It was Thảo, who had been quiet for most of the week, who found the argument that settled it.","\"A countdown is regular,\" she said. \"Ours isn't. Look at the residuals — Hùng showed us this two years ago and we filed it. The rate isn't smooth. It's got steps in it. It stalls for years and then drops three in a season.\"","\"That's noise.\"","\"That's mortality.\" Thảo put the page down gently. \"Clocks don't stall. Populations do.\"","Nobody said anything for a very long time.","\"Then what we have been listening to,\" Mai said at last, and her voice did not sound like her own, \"for fifty years —\"","\"Is a count of the survivors,\" said Thảo. \"Being kept by the survivors. And every few seasons, somebody has to change the number.\""]},{"n":13,"week":13,"title":"Someone Has to Keep the Numbers","vi":"Phải có ai đó giữ những con số","note":"Chương cuối. Dùng lại từ vựng nhìn lại và tổng kết của tuần 13.","text":["Looking back, what strikes Mai most is not the discovery. It is how ordinary the years afterwards were.","There was no announcement that changed the world. There were papers, and conferences, and a documentary that got most of it wrong, and a long tedious dispute about whether the columns were alive, which was still unresolved when Đức died in the spring of the following year. He had read the translation. He had asked for it to be read to him twice, and the second time he had said, \"Well. That was worth twenty years,\" and then he had asked about the weather at the station, and that was the last conversation they had.","The count went on going down.","In retrospect, the hardest thing to come to terms with was not that something down there was dying. It was the arithmetic of the timescale. The columns resonate at a rate that makes one exchange take about four hundred years. Whatever is keeping that count has been keeping it, at minimum, since before there was writing anywhere on the surface of this planet. It has been saying *this is how many of us are left* into a sea that has never once answered.","Ultimately that is the thing Mai could not stop thinking about, and it is why she pushed for the reply.","That fight took eleven years. She was fifty-one when the first transmitter went into the sediment, and she has been told, by people who mean it kindly, that she should not expect to live to see any response. She is aware of this. She has done the arithmetic more carefully than any of them.","The message they sent is very short. There was an enormous argument about the content, involving four countries and a great many people who had never been to the station, and in the end they sent the only thing everybody could agree was true.","A number. Base four. The count of something on the surface that is still here.","Thảo retired in the twelfth year and comes back most weeks anyway, on the grounds that she has nothing better to do, which is a lie that nobody challenges. Linh runs the southern group now and has published more than the rest of them combined. Bảo died at seventy-four, quietly, in a hospital in Nha Trang, and half the survey fleet came to the funeral. Hùng, to everyone's astonishment, teaches secondary school.","The station has been rebuilt twice. It is not damp any more, which Mai privately regrets.","She keeps one thing on the wall of the new building, framed, at the height where people can read it without stopping. It is a photocopy of a page from a log book dated 1987, in small careful handwriting, with the times written backwards so that a supervisor would not notice.","Underneath it is the line she has read perhaps ten thousand times.","*By the time anyone believes this, I will be too old to be the one who says it. That is all right. Someone has to keep the numbers.*","New staff ask about it, usually in the first week. Mai tells them the whole story if they seem to want it, and the short version if they don't, and either way she finishes the same way, because after thirty years she has stopped pretending she has a better ending.","\"He was not a remarkable man,\" she says. \"He noticed something, and he was told it was nothing, and he wrote it down anyway for fifteen years, and then he went home and lived an ordinary life and told nobody. Everything we have came from that. Not from being clever. From him refusing to stop recording a thing that everybody had agreed was normal.\"","And then she sends them up to the dish, which still stands on the hill above the water, rusting quietly in the salt air, and which now, at last, is transmitting as well as listening — into four hundred metres of soft grey mud, at a rate of one word every four hundred years, to somebody who is still down there, and who is still counting."]}]},"svi":{"1":["Trạm nằm trên một ngọn đồi thấp phía trên mặt nước, và ban đêm nó là ánh sáng duy nhất trong bán kính mười một cây số. Mai vào ca lúc mười giờ. Cô luôn đi bộ đoạn cuối thay vì đi xe tải, vì xe làm lũ chó trong làng thức giấc và cô thấy áy náy về chuyện đó.","Bên trong, không khí ẩm. Lúc nào cũng ẩm. Toà nhà cũ được dựng vội sáu mươi năm trước, và biển đã kiên nhẫn gặm nhấm nó kể từ đó. Mai treo áo khoác lên móc, liếc qua cuốn sổ trực, rồi ngồi xuống.","Cái chảo thu sóng bên ngoài rộng chín mét. Nó từng có tên, sơn trên vành, nhưng muối đã ăn mòn gần hết các chữ cái và giờ nó chỉ còn đọc được là HE ON — điều mà ca đêm thấy buồn cười suốt khoảng một năm rồi thôi không để ý nữa.","Công việc của cô đơn giản. Cô xem các màn hình. Cô ghi lại bất cứ gì bất thường. Sáu giờ sáng cô về nhà.","Suốt bốn tháng không có gì bất thường xảy ra, và Mai biết ơn vì điều đó. Cô hai mươi sáu tuổi. Cô đến đây vì công việc yên tĩnh và vì mẹ cô ở cách hai làng, đang già đi. Người ta cho rằng cô chán. Cô không chán. Cô thích tiếng toà nhà kêu trong gió.","Hai giờ sáng, cô đứng dậy vươn vai, và màn hình đổi.","Không có gì kịch tính. Không chuông báo, không đèn đỏ. Một đường mảnh trên màn hình, vốn phẳng lì suốt nhiều tuần, nhô lên nhẹ rồi hạ xuống. Rồi lại làm vậy. Rồi lại nữa.","Mai nhìn chằm chằm vào nó. Cô không nhúc nhích rất lâu.","Đường kẻ nhô lên hạ xuống theo một dạng nhất định. Ba nhịp nhô ngắn, một quãng lặng, một nhịp nhô dài. Ba ngắn, lặng, một dài. Nó đều đến mức ý nghĩ đầu tiên của cô là có gì đó trong toà nhà hỏng — một sợi dây lỏng, một cái quạt hư, cái lò sưởi cũ tự bật tắt.","Cô kiểm tra dây. Cô kiểm tra quạt. Cô đứng lên ghế kiểm tra lò sưởi, và trong lúc ở trên đó cô nhận ra bụi đã bám dày thế nào, và cô nghĩ, một cách vô lý, rằng mình nên lau chỗ đó.","Dạng tín hiệu vẫn tiếp tục.","Mai trèo xuống, cẩn thận hơn mức cần thiết, rồi ngồi lại bàn. Cô mở sổ trực. Ở cột ghi BẤT THƯỜNG cô viết giờ, rồi dừng lại, vì cô không biết viết gì tiếp.","Hầu như không kịp nghĩ, cô với tay vặn to âm lượng.","Thứ phát ra không phải giọng nói. Đó là tiếng gõ khe khẽ, như ai đó gõ ngón tay lên bàn ở phòng bên. Ba tiếng gõ. Một quãng lặng. Một tiếng nhấn dài. Ba tiếng gõ. Một quãng lặng. Một tiếng nhấn dài.","Cô nghe nó bốn mươi phút mà không ghi lại chữ nào.","Ba giờ mười cô nhấc máy định gọi Thảo, rồi lại đặt xuống. Thảo chắc đang ngủ. Thảo có con nhỏ. Chưa có gì để nói ngoài một câu mà nói ra thành tiếng sẽ nghe rất ngớ ngẩn.","Thế là Mai ngồi trong căn phòng ẩm với biển ở phía dưới và cái chảo thu sóng ở phía trên, và cô nghe tiếng gõ, và cô đợi mặt trời."],"2":["Thảo đến lúc sáu giờ hai mươi, tức là muộn, và Mai nhẹ nhõm đến mức quên cả bực.","\"Trông cậu tệ quá,\" Thảo nói.","\"Nghe cái này đi.\"","Thảo chậm rãi đặt túi xuống. Bà bốn mươi mốt tuổi và đã làm ở trạm mười chín năm, nghĩa là bà đã nghe mọi thứ tiếng lạ mà toà nhà này có thể tạo ra. Bà không dễ kinh ngạc. Bà ngồi xuống, đeo tai nghe, nhắm mắt lại.","Mai quan sát gương mặt bà. Phút đầu Thảo trông kiên nhẫn, gần như chán. Phút thứ hai bà ngừng cử động. Phút thứ ba bà mở mắt nhìn vào bức tường, và Mai thấy ở đó một thứ làm cô sợ, bởi vì đó không phải sự tò mò.","Đó là sự nhận ra.","\"Nó kêu như vậy bao lâu rồi?\" Thảo hỏi.","\"Từ hai giờ.\"","\"Không.\" Thảo tháo tai nghe ra. \"Bao lâu rồi, Mai.\"","\"Em không hiểu câu hỏi.\"","Thảo đứng dậy, đi tới cái kệ không ai đụng tới, rút xuống một cuốn sổ trực cũ đến mức bìa đã mềm nhũn. Bà lật các trang mà không nhìn, kiểu lật của người đã lật tới trang đó rất nhiều lần, rồi đặt cuốn sổ lên bàn trước mặt Mai.","Nét chữ nhỏ và chắc. Ngày ghi là tháng Ba, bốn mươi năm trước. Ở cột BẤT THƯỜNG có người đã viết: *ba ngắn, một dài. Lặp lại. Chưa rõ nguồn.* Và bên dưới, cùng nét chữ ấy, một dòng: *Đã báo cáo. Được lệnh không báo cáo nữa.*","Mai thấy căn phòng trở nên rất im.","\"Nó quay lại,\" Thảo nói. \"Vài năm một lần. Có khi chạy một đêm. Có lần chạy mười một ngày.\" Bà ngồi phịch xuống. \"Tôi hai mươi ba tuổi lần đầu nghe thấy nó. Tôi phấn khích đến mức gọi cho tất cả mọi người. Cấp trên của tôi vào cơ quan cả ngày Chủ nhật. Ông ấy rất tử tế với tôi và giải thích rằng đó là tiếng thiết bị, và ông ấy bình thản và chắc chắn đến mức tôi thấy xấu hổ về mình suốt khoảng sáu năm.\"","\"Rồi sao nữa ạ?\"","\"Rồi tôi nghe thấy nó lần nữa, và tôi không còn xấu hổ. Tôi giận.\" Thảo cười mà trong tiếng cười không có chút hài hước nào. \"Cái đó còn tệ hơn. Giận một thứ mình không chứng minh được là một cách tồi để tiêu hết tuổi ba mươi.\"","Mai nhìn cuốn sổ cũ, rồi nhìn cuốn mới, rồi nhìn hai dòng chữ cách nhau bốn mươi năm nói cùng một điều.","\"Giờ mình làm gì?\"","\"Cậu về ngủ đi.\"","\"Chị Thảo.\"","\"Tôi nói nghiêm túc. Cậu thức hai mươi tiếng rồi và cậu sắp đưa ra một quyết định.\" Giọng Thảo dịu lại, và không hiểu sao điều đó còn đáng lo hơn phần còn lại. \"Tôi đã đưa ra quyết định đó khi bằng tuổi cậu. Tôi muốn cậu quyết khi đã nghỉ ngơi.\"","Mai lấy áo khoác. Ra tới cửa cô dừng lại.","\"Chị có sợ nó không?\"","Thảo cân nhắc câu hỏi một cách thành thật, đó là một trong những điều Mai thích nhất ở bà.","\"Không,\" cuối cùng bà nói. \"Tôi sợ chuyện gì sẽ xảy ra nếu nó dừng lại.\""],"3":["Mai không ngủ. Cô nằm trong phòng phía trên cửa hàng của dì và nghe tiếng quạt và nghĩ về chuyện đó gần như liên tục cho tới bốn giờ chiều, lúc ấy cô bỏ cuộc, thay đồ, và quay lại trạm sớm.","Đến lúc cô tới nơi, Thảo đã in bốn mươi trang dữ liệu tín hiệu và phủ kín cả bàn.","\"Chị cũng không ngủ,\" Mai nói.","\"Không phút nào. Ngồi xuống. Tôi muốn cho cậu xem cái này, và tôi muốn cậu bảo tôi rằng tôi sai.\"","Bất chấp mọi thứ, Mai mỉm cười. Thảo dạy kiểu đó. Bà không bao giờ giải thích; bà đưa cho bạn các mảnh và bắt bạn tự ráp, và đến lúc bạn hiểu ra thì bạn tin đó là ý của chính mình.","\"Ba ngắn, một dài,\" Thảo nói. \"Đó là một đơn vị. Ta luôn coi đó là một đơn vị lặp lại. Thật ra, đó là điều mọi người ghi lại suốt bốn mươi năm — lặp lại, lặp lại, lặp lại. Không ai buồn kiểm tra xem các khoảng cách giữa các đơn vị có bằng nhau không.\"","\"Và chúng không bằng nhau.\"","\"Chúng không bằng nhau.\" Thảo đẩy một trang giấy sang. \"Có khi khoảng cách ngắn. Có khi dài gấp đôi. Thỉnh thoảng dài gấp bốn. Nhìn đi.\"","Mai nhìn. Cô nhìn thật lâu. Dần dần, những con số trên trang giấy thôi là nhiễu và bắt đầu thành một thứ khác.","\"Đó là thông tin,\" cô nói khẽ.","\"Tôi nghĩ vậy. Cái ba-ngắn-một-dài không phải là bức thông điệp. Nó là thứ chất liệu mà bức thông điệp được viết bằng. Nói cách khác, nó là cây bút, không phải chữ viết. Suốt bốn mươi năm chúng ta nghe một cây bút.\"","Mai ngả người ra sau. Cô thấy hơi buồn nôn, và đồng thời tỉnh táo hơn bất cứ lúc nào trong nhiều tháng.","\"Sao không ai nhận ra?\"","\"Vì các quy định.\" Thảo tháo kính, dụi mắt. \"Cậu phải ghi nhớ chỗ này vận hành thế nào. Quy định một: báo cáo mọi thứ bất thường. Quy định hai: bất thường nghĩa là những gì không có trong danh mục. Mà tín hiệu này đã nằm trong danh mục từ năm 1986. Có ai đó từng ghi nó là tiếng thiết bị, và sau đó nó thôi là bất thường. Nó thành bình thường. Không ai nhìn vào cái bình thường.\"","\"Thế thì —\" Mai tìm một từ đủ mạnh và không tìm ra.","\"Ừ. Đúng vậy.\" Thảo đeo kính lại. \"Thành thật mà nói, chuyện đó cũng hoàn toàn dễ hiểu. Trạm nào cũng có danh mục. Không có nó thì cậu sẽ mất cả ngày chạy theo chim, mưa và dây điện hỏng. Danh mục là thứ khiến công việc làm được. Nó cũng là thứ làm cậu mù. Không có cái này mà không có cái kia.\"","Bên ngoài, trời đang tắt nắng. Mai nghe thấy lũ chó trong làng bắt đầu sủa, nghĩa là có ai đó đang đi trên đường.","\"Vậy giờ sao?\"","\"Giờ thì sớm muộn gì chúng ta cũng phải quyết định.\" Thảo gom các trang giấy thành một chồng và vuốt mép cho thẳng thật cẩn thận. \"Vì ngay khi ta ghi chuyện này lại cho đàng hoàng, nó thôi là của chúng ta. Và tôi đã mất mười chín năm nhìn toà nhà này làm gì với những thứ thôi là của chúng ta.\""],"4":["Họ ghi lại. Mất bốn ngày, và ngày thứ năm có một người xuất hiện.","Ông ta đến lúc mười một giờ sáng trên một chiếc xe quá sạch so với con đường, bước vào không gõ cửa và nhìn quanh phòng theo cái kiểu người ta nhìn một nơi mà mình đã quyết định sẵn về nó. Ông ta chừng năm mươi. Áo khoác đẹp, gương mặt mệt mỏi.","\"Ai là Nguyễn Thị Mai?\"","\"Là tôi.\"","\"Được.\" Ông ngồi xuống ghế của Thảo mà không hỏi. \"Tôi tên Đức. Tôi xuống để giải quyết chuyện này.\"","\"Giải quyết chuyện gì ạ?\"","\"Báo cáo của cô.\" Ông lấy một tập hồ sơ từ trong túi đặt lên bàn nhưng không mở. \"Trước hết tôi muốn nói đây là một công trình tốt. Thật sự. Phần lớn người ta sẽ không để ý tới các khoảng cách. Tôi đã đọc hai lần.\"","Mai liếc sang Thảo. Thảo đứng rất im bên cửa sổ, khoanh tay.","\"Cảm ơn ông,\" Mai nói cẩn trọng.","\"Tôi sẽ giải thích một điều, rồi tôi sẽ nhờ cô một việc, và tôi thà làm cả hai một cách thành thật còn hơn phí buổi chiều của cô.\" Đức xoa trán. \"Tín hiệu là thật. Chúng tôi biết nó là thật từ năm 1979. Nó không đến từ thiết bị. Nó không đến từ vệ tinh nào mà chúng tôi giải thích được. Chưa ai từng tìm ra nó đến từ đâu.\"","Căn phòng im lặng. Phía dưới, biển vẫn tiếp tục.","\"Vậy tại sao —\" Mai bắt đầu.","\"Tại sao nó bị ghi thành nhiễu?\" Ông gật đầu, như thể đã chờ câu này và đã trả lời nó nhiều lần. \"Vì năm 1979 một người rất nghiêm túc trong một cơ quan rất nghiêm túc được hỏi phải làm gì với một tín hiệu không giải thích nổi, và ông ta quyết định rằng câu trả lời thành thật sẽ làm người ta sợ mà chẳng đưa ai tới đâu. Nên ông ta làm cho nó trở nên nhàm chán. Ông ta đưa nó vào danh mục. Và hoá ra ông ta đúng, theo một nghĩa nào đó. Bốn mươi năm trôi qua. Không có gì tệ xảy ra. Đất nước vẫn tiếp tục.\"","\"Đó không phải lý do. Đó là cái cớ.\"","\"Đúng,\" Đức nói. \"Nó là cả hai. Phần lớn mọi thứ đều vậy.\"","Thảo lên tiếng lần đầu. \"Ông muốn gì ở con bé?\"","Ông quay ghế lại. \"Tôi muốn giao chuyện này lại cho cô ấy. Đàng hoàng. Kinh phí, thiết bị, thêm hai nhân sự.\" Ông nhìn lại Mai. \"Những người lập ra việc này đều đã nghỉ hưu hoặc chết. Tôi là người cuối cùng biết toàn bộ, tôi không khoẻ, và tôi đã hoãn cuộc nói chuyện này ba năm vì không tìm được ai tôi tin để giao.\"","Mai nhận ra mình đã đứng dậy mà không hề quyết định làm vậy.","\"Tại sao lại là tôi?\"","\"Vì cô không gọi báo chí,\" Đức nói. \"Và vì cô nhận ra một thứ mà bốn trăm người đã nhìn thẳng vào nó mà không thấy.\" Cuối cùng ông mở tập hồ sơ. Bên trong là bốn mươi năm dữ liệu, trang này qua trang khác, bằng sáu kiểu chữ viết tay khác nhau. \"Tôi sẽ không giả vờ rằng đây là một món quà. Một khi cô nhận nó, cô sẽ không trả lại được. Tôi đã cho nó hai mươi năm và tôi chưa bao giờ nguôi được. Cô nên suy nghĩ kỹ.\"","\"Tôi có bao lâu?\"","Đức nhìn ra ngoài cửa sổ về phía cái chảo thu sóng trên đồi, đang lặng lẽ gỉ đi trong không khí mặn, làm cái việc nó vẫn làm mỗi ngày từ trước khi bất kỳ ai trong số họ ra đời.","\"Lâu hơn nó,\" ông nói."],"5":["Cô nhận. Tất nhiên là cô nhận. Cô dành một đêm giả vờ cân nhắc, vì tôn trọng tầm vóc của chuyện đó, và sáng hôm sau cô gọi cho Đức nói đồng ý, còn ông thì nghe không có vẻ gì bất ngờ, điều đó làm cô hơi bực.","Sáu tuần đầu là quãng thời gian cô hạnh phúc nhất trong nhiều năm, và về sau cô sẽ nhớ lại điều đó với chút cay đắng, vì cô đã tưởng hạnh phúc ấy đến từ công việc. Không phải. Nó đến từ việc chưa thất bại.","Họ dựng mô hình vào tháng Mười. Ý tưởng của Thảo và phép tính của Mai, và đến khi xong họ có một bức tường phủ kín giấy cùng một giả thuyết mà cả hai đều tin.","Giả thuyết như sau. Các khoảng lặng giữa những đơn vị không ngẫu nhiên; chúng có bốn độ dài. Bốn độ dài nghĩa là bốn ký hiệu. Bốn ký hiệu thì không nhiều — nhưng bốn đúng là con số bạn sẽ chọn nếu muốn được hiểu bởi ai đó không chung bảng chữ cái, không chung thân xác, không chung bầu trời với bạn. Bốn là thứ bạn dùng để viết một con số theo hệ cơ số bốn. Và các con số, Mai lập luận, là thứ duy nhất mà hai kẻ xa lạ có thể chắc chắn là dùng chung.","\"Cậu đang giả định họ nghĩ theo cách chúng ta nghĩ,\" Thảo nói.","\"Em giả định họ biết đếm.\"","\"Cái đó là một giả định lớn hơn nghe qua nhiều.\"","Nhưng Thảo không thật sự phản đối, vì các con số hiện ra đẹp đẽ. Đọc các khoảng lặng theo cơ số bốn cho họ một chuỗi, và chuỗi đó không phải nhiễu: nó leo lên, dừng lại, leo tiếp, rồi trở về. Mai vẽ nó ra và hình dạng trên giấy là một đường cong sạch, loại đường cong không xuất hiện do tình cờ.","Cô nhớ chính xác khoảnh khắc ấy. Bốn giờ rưỡi sáng, lò sưởi kêu tí tách, Thảo ngủ trên ghế miệng há ra. Mai nhìn đường cong và hiểu, với một sự chắc chắn gần như có thể sờ được, rằng cô là người đầu tiên trong lịch sử thế giới nhìn thấy nó.","Cô đánh thức Thảo. Thảo nhìn tờ giấy rất lâu rồi nói, khẽ khàng, \"Ồ.\"","Họ báo cáo vào tháng Mười một. Đức tự lái xe xuống. Ông đọc các trang giấy hai lần, chậm rãi, rồi tháo kính dụi mắt theo cái kiểu mà sau này Mai sẽ nhận ra là tin xấu đang tới.","\"Đây là một công trình tốt,\" ông nói.","\"Nhưng.\"","\"Nhưng tôi đã thấy đường cong này trước đây.\" Ông thò tay vào túi lấy ra một tập hồ sơ, mềm nhũn vì cũ. \"Năm 1991. Một nhóm ở phía bắc. Phương pháp gần như y hệt. Họ ra đúng đường cong này và họ chắc chắn y như cô bây giờ.\"","Mai không chịu hiểu ông. \"Vậy là được xác nhận rồi. Hai nhóm độc lập —\"","\"Được xác nhận rằng phương pháp tạo ra đường cong.\" Đức đặt tập hồ sơ lên bàn. \"Đường cong nằm trong phương pháp, Mai ạ. Nếu cô đọc những khoảng lặng ngẫu nhiên theo cơ số bốn rồi vẽ ra như vậy, cứ chín lần thì có một lần cô được thứ rất giống thế này. Họ phát hiện điều đó năm 1994. Nó phá hỏng hai sự nghiệp và một cuộc hôn nhân.\"","Căn phòng cực kỳ im. Bên ngoài, một con chim đang làm một việc bình thường nào đó.","\"Ông có thể đã cảnh báo tôi,\" Mai nói.","\"Tôi có thể.\" Ông thừa nhận mà không tự bào chữa, và không hiểu sao điều đó còn tệ hơn. \"Tôi quyết định không làm vậy. Tôi muốn xem cô sẽ làm gì khi được chạy một mạch không vướng gì, và tôi muốn cô có sáu tuần đó. Tôi sẽ không giả vờ rằng làm vậy là tử tế.\"","Thảo suốt nãy giờ không nói gì. Bà đứng bên cửa sổ quay lưng lại phía họ, và khi cuối cùng bà lên tiếng thì giọng bà phẳng lì.","\"Bao nhiêu nhóm,\" bà nói. \"Từ năm 1979. Bao nhiêu nhóm đã đi được tới đây rồi bị nói đúng câu này?\"","Đức không trả lời ngay, và sự im lặng kéo dài đủ lâu để Mai nhận ra ông đang cân nhắc có nên nói dối hay không.","\"Chín,\" ông nói."],"6":["Sau đó, Mai không làm việc suốt mười một ngày. Cô nói với mẹ rằng đó là kỳ nghỉ. Mẹ cô, người đã nuôi ba đứa con và chôn một người chồng và có thể nghe ra một lời nói dối qua bức tường, bảo rằng nghe hay đấy rồi nấu súp cho cô mỗi tối và không hỏi một câu nào, và đến ngày thứ chín thì Mai bắt đầu kể.","Ngày thứ mười hai cô quay lại và bắt đầu đọc lịch sử thay vì đọc dữ liệu.","Trạm được xây năm 1962 vì những lý do chẳng liên quan gì tới chuyện này. Đến 1979 nó đã cũ. Người trực ca tháng Ba năm ấy tên Trần Văn Hải; anh hai mươi tám tuổi; anh đã ở trạm năm năm và chưa từng báo cáo điều gì.","Anh nghe thấy tín hiệu lúc một giờ mười sáng. Anh ghi lại. Trong khi đó, cách bốn trăm cây số, một trạm thứ hai nghe thấy đúng thứ ấy muộn hơn mười một phút, và bản thân chi tiết đó là điều lạ lùng nhất trong toàn bộ hồ sơ, mà chưa ai từng giải thích được.","Hải báo cáo. Hai tuần trôi qua. Rồi một chiếc xe tới, khá giống chiếc xe đã chở Đức, và những người trong xe lịch sự và kỹ lưỡng và họ lấy đi mọi trang giấy anh đã viết.","Kể từ tuần đó, tín hiệu nằm trong danh mục.","Hải ở lại trạm tới năm 1994. Mai tìm thấy nét chữ của anh khắp các cuốn sổ trực, mười lăm năm liền, và cô đọc những cuốn sổ ấy theo cách người khác đọc tiểu thuyết. Đến 1983 nét chữ nhỏ dần. Đến 1987 anh bắt đầu vẫn ghi tín hiệu lại, ở cột bình thường, nguỵ trang lẫn vào các ghi chú thời tiết, bằng một mật mã riêng mà Mai mất hai ngày để phá và hoá ra chẳng khôn khéo gì hơn việc viết ngược các con giờ.","Anh chưa bao giờ ngừng ghi. Không một lần, suốt mười lăm năm.","Trong cuốn sổ cuối, ở một trang đề ngày ngay trước khi anh rời đi, anh đã viết một câu không nói về thời tiết.","*Đến lúc có ai đó tin chuyện này, tôi sẽ quá già để là người nói ra nó. Vậy cũng được. Phải có ai đó giữ những con số.*","Mai ngồi với câu ấy rất lâu.","Cho tới lúc đó cô vẫn tưởng câu chuyện này nói về một tín hiệu. Giờ cô chợt nghĩ rằng câu chuyện có thể là nói về những con người. Chín nhóm. Chín đường cong. Chín tập hồ sơ trong túi Đức, mỗi tập là năm tháng đẹp nhất của một ai đó.","Cuối cùng cô đi tìm Thảo, người đang ở ngoài trời kiểm tra các đường dây trong mưa vì Thảo đối phó với những tuần tồi tệ bằng cách đi sửa đồ.","\"Em muốn hỏi chị một chuyện và em muốn câu trả lời thật.\"","\"Hỏi đi.\"","\"Chị có biết về chín nhóm kia không?\"","Thảo đứng thẳng người lên. Nước chảy xuống từ chóp mũi bà. \"Tôi biết bốn nhóm trong số đó.\"","\"Và chị để em mất sáu tuần —\"","\"Đúng.\" Không bào chữa, không làm dịu đi. \"Vì mỗi nhóm trong số đó đều tìm ra một thứ mà những nhóm khác bỏ sót, và tất cả đang nằm trong một tập hồ sơ mà sẽ chẳng ai đọc. Và vì tôi đã nhìn cái thứ này lấy đi từng mảnh của con người ta suốt mười chín năm, và tôi quyết định từ lâu rằng tôi thà để nó lấy một mảnh của cậu khi tôi đang đứng cạnh cậu chứ không phải mười năm nữa khi cậu ở một nơi nào khác.\"","Mai đứng trong mưa và ghét bà chừng bốn giây.","\"Được,\" cuối cùng cô nói. \"Vậy em muốn tám tập hồ sơ còn lại.\"","Gương mặt Thảo làm một điều gì đó phức tạp. \"Đó chính là câu tôi vẫn chờ cậu nói từ tháng Mười một.\""],"7":["Các tập hồ sơ về tới vào tháng Hai, và họ tranh luận về chúng cho tới tháng Tư.","Cuộc tranh luận không hề gay gắt, mặc dù nó kéo dài đến mức họ phải đặt ra quy tắc: không làm việc sau nửa đêm, không mang về nhà, và không được nói hai chữ hiển nhiên hay rõ ràng, vì chưa ai trong hai người xứng đáng dùng những chữ đó.","Lập trường của Thảo là tín hiệu này là một ngọn hải đăng. Không phải thông điệp gì cả — chỉ là một dấu mốc, như ngọn hải đăng, chỉ nói *ở đây* và *vẫn còn ở đây* chứ không gì khác. Hải đăng không cần ngữ pháp. Một ngọn hải đăng cố giải thích về mình sẽ là ngọn hải đăng tệ hơn. Và trong khi một thông điệp hẳn sẽ dừng lại khi đã được nhận, thứ này chạy suốt ít nhất bốn mươi bảy năm mà không có dấu hiệu nào cho thấy nó bận tâm có ai đang nghe hay không.","Lập trường của Mai là đó là một thông điệp, và lý do không ai đọc được là vì tất cả, kể cả cô, đều đi tìm sai loại chữ viết.","\"Nhóm nào cũng lao thẳng vào các con số,\" cô nói. \"Chín nhóm, chín lần, đều là số. Vì tất cả đều làm cùng một việc và tất cả đều thất bại, có thể cho rằng vấn đề chính là cái việc mà tất cả đã làm.\"","\"Hoặc vấn đề là nó không phải chữ viết.\"","\"Trừ khi đó là thứ chữ viết không vận hành giống chữ của ta.\"","Họ xoay quanh chuyện này suốt nhiều tuần. Dù vậy, có một thứ hữu ích đã sinh ra từ đó, và đó thường là điều xảy ra khi hai người tôn trọng nhau bất đồng đủ lâu.","Chính Thảo là người nhận ra, vào tháng Ba, giữa lúc bà đang lập luận cho kết luận ngược lại.","\"Này, dù các khoảng lặng thay đổi, bản thân các đơn vị thì không bao giờ đổi. Ba ngắn, một dài. Bốn mươi bảy năm. Chưa một lần nào có ai ghi được bốn ngắn, hay hai dài, hay bất cứ gì khác. Đó chính là ý tôi — một thông điệp thì phải dùng tới bảng chữ cái của nó. Cái này chỉ dùng một chữ cái.\"","Mai đã với tay lấy giấy.","\"Chị nói lại đi.\"","\"Một thông điệp thì phải dùng bảng chữ cái của nó.\"","\"Không. Phần kia cơ. Chưa một lần nào.\"","Thảo dừng lại. \"Chưa một lần nào.\"","\"Trong bốn mươi bảy năm, trên tổng số — \" Mai giờ viết rất nhanh — \"khoảng mười một triệu đơn vị, không có lấy một đơn vị nào méo. Không bao giờ có lỗi. Không mất nhịp. Không nhiễu.\"","\"Nghĩa là nó sạch.\"","\"Nó sạch *quá mức*.\" Cô xoay tờ giấy lại. \"Chị Thảo, ta cách trạm kia bốn trăm cây số và họ nghe thấy muộn hơn mười một phút. Không có gì trên bầu trời lại tới hai điểm trên cùng một hành tinh cách nhau mười một phút. Không gì cả. Cả năm nay em coi đó là một điều bí ẩn vì nó nằm trong hồ sơ và mọi thứ trong hồ sơ đều bí ẩn. Nhưng nó không phải bí ẩn. Nó là một dữ kiện, và nó không tương thích với từng thứ một mà cả hai chúng ta đã giả định.\"","Lò sưởi kêu tí tách. Bên ngoài, cái chảo thu sóng đứng trong bóng tối chẳng làm gì cả, như nó đã đứng suốt quãng đời của cả hai người.","\"Cậu sắp nói một điều gì đó,\" Thảo chậm rãi nói, \"và tôi muốn có một khoảnh khắc để chuẩn bị tinh thần.\"","\"Nó không đến từ bầu trời.\"","\"Ừ.\" Thảo ngồi xuống. \"Phải. Tôi cũng đã nghĩ có lẽ là vậy.\""],"8":["Kinh phí được duyệt vào tháng Năm, nghĩa là có thêm nhân sự, nghĩa là chấm dứt một cách làm việc mà Mai không biết mình yêu quý cho tới khi mất nó.","Có ba người. Linh hai mươi bốn tuổi, gầy, nhanh, và sắc sảo rõ đến mức làm mọi người trong phòng hơi căng thẳng trong tiếng đầu tiên rồi thôi, vì cô cũng hào phóng với những gì mình biết, thứ hiếm nhất ở một người thông minh. Cô đã bỏ một công việc tốt hơn nhiều để tới đây và từ chối giải thích vì sao.","Bảo sáu mươi mốt tuổi và đã dành cả sự nghiệp trên các con tàu. Ông có gương mặt nặng nề, kiên nhẫn và đôi bàn tay rõ ràng từng sửa đồ dưới nước. Mỗi ngày ông nói chừng bốn mươi từ. Ông để ý mọi thứ. Trong vòng nửa tháng, thiết bị của trạm chạy tốt hơn suốt cả thập kỷ trước đó và không ai nhớ đã nhờ ông làm việc ấy.","Và rồi có Hùng.","Hùng ba mươi lăm tuổi, ăn mặc chỉn chu, và có một tiếng tăm tới trước anh ta một tuần. Anh công bố nhiều công trình. Anh, xét theo mọi thước đo hợp lý, là người có chuyên môn cao nhất từng đặt chân vào toà nhà này, và anh không một lần nào để căn phòng quên mất điều đó.","\"Cậu ta không ngu,\" Thảo nói, sau tháng đầu tiên. \"Đó mới là cái khó. Nếu cậu ta ngu thì chuyện này dễ.\"","Anh ta không ngu. Anh ta kiêu ngạo theo một kiểu rất riêng và rất mệt: anh coi mọi câu hỏi là một bài kiểm tra dành cho người hỏi. Khi Mai giải thích vấn đề mười một phút, anh nghe với cái đầu hơi nghiêng rồi nói, \"Đó là sai số thiết bị,\" bằng giọng của một người đang đóng cửa lại.","\"Nó đã được tái lập bốn lần bởi ba nhóm khác nhau.\"","\"Vậy thì nó đã được tái lập sai bốn lần.\" Anh mỉm cười dễ chịu. \"Tôi nói vậy không phải để thô lỗ. Phần lớn các dị thường đều nhàm chán một khi bạn tìm ra sợi dây lỏng.\"","Rắc rối là anh ta thường đúng. Đó là phần không ai cảnh báo cô trước. Cách cư xử của anh thì không chịu nổi mà trực giác của anh thì xuất sắc, và suốt mùa hè anh tìm ra ba lỗi thật sự trong dữ liệu cũ, một trong số đó đã nằm đó từ năm 1991 và đã lấy mất của một nhóm ngoài bắc hai năm trời.","Mai, vốn không phải người kiên nhẫn bẩm sinh, phát hiện ra rằng cô sẽ buộc phải trở thành người kiên nhẫn.","Khoảnh khắc làm mọi thứ đổi khác đến vào tháng Tám, một ngày thứ Ba bình thường, và chính Bảo là người gây ra nó mà không cố ý.","Họ lại đang tranh cãi về mười một phút — Hùng đứng, khoa tay, Linh đã nghiêng nửa phần, Thảo thì cứng đầu — thì Bảo, người nãy giờ đi đấu lại dây ở góc phòng và không nói gì từ sáng, lên tiếng:","\"Mười một phút là vừa đúng với bùn.\"","Mọi người quay lại.","\"Ông nói lại đi,\" Mai nói, lần thứ hai trong đời, bằng đúng cái giọng ấy.","Bảo đặt đồ nghề xuống. Ông trông hơi ngượng vì bị chú ý.","\"Âm truyền trong trầm tích đáy biển,\" ông nói. \"Bùn mềm, đúng dải thềm lục địa đó. Bốn trăm cây số, xê dịch chút ít.\" Ông nhún một bên vai. \"Mười một phút là vừa đúng. Tôi từng làm trên tàu khảo sát. Bọn tôi đo cái đó suốt.\"","Không ai nói gì trong mấy giây.","Rồi Hùng, rất đáng khen cho anh ta, chậm rãi ngồi xuống và nói, \"Ồ, tôi đúng là một thằng ngốc,\" và từ chiều hôm đó trở đi Mai thấy mình làm việc với anh hoàn toàn ổn."],"9":["Họ có thời hạn tới tháng Ba để viết bài, và Hùng, người hoá ra là một đồng nghiệp tốt hơn nhiều so với ấn tượng ban đầu, khăng khăng đòi viết bài như thể nó sẽ được đọc bởi những người muốn nó sai.","\"Đó là cách hữu ích duy nhất để viết bất cứ thứ gì,\" anh nói. \"Hãy giả định một người đọc thù địch. Nếu bài sống sót qua họ, nó sẽ sống sót qua tất cả những người khác.\"","Thế là họ viết bốn lần.","Bản nháp đầu tiên, theo chữ của Linh, là đáng xấu hổ. Nó không sai; nó chỉ đơn giản được sắp theo thứ tự mà họ khám phá ra mọi thứ, thứ tự gần như không bao giờ là thứ tự nên dùng để giải thích. Khẳng định quan trọng nhất nằm ở trang chín. Độ trễ mười một phút, vốn là dữ kiện then chốt, bị chôn trong một cái bảng.","\"Cấu trúc chính là lập luận,\" Hùng nói, vừa xê dịch các trang giấy trên sàn. \"Nếu người đọc phải giữ sáu thứ trong đầu trước khi thứ thứ bảy có nghĩa, thì anh chưa viết một bài báo. Anh viết một câu đố.\"","Mai thấy điều này hiển nhiên ngay khi anh nói ra và thấy mình không đời nào tự nhận ra được, và cô đang bắt đầu hiểu rằng đó chính là công dụng của một đồng nghiệp tốt.","Bản cuối cùng đưa ra một khẳng định và bảo vệ nó. Khẳng định đó là nguồn của tín hiệu nằm trong lớp trầm tích đáy biển của thềm lục địa, ở một độ sâu và vị trí có thể ước tính từ thời điểm tín hiệu tới hai trạm. Mọi thứ khác trong bài tồn tại để chống đỡ cho câu đó hoặc để chứng minh vì sao các phương án khác thất bại.","Các phương án khác mới là phần khó. Bốn mươi bảy năm giả định phải được tháo dỡ một cách lịch sự.","Thảo viết phần đó, và đó là đoạn văn hay nhất trong tất cả những gì họ tạo ra. Bà không hạ thấp các nhóm đi trước. Bà làm điều ngược lại: bà chỉ ra, từng nhóm một, rằng mỗi nhóm đều hợp lý dựa trên những gì họ biết, và rằng sai lầm không thuộc về cá nhân mà thuộc về cấu trúc. Chín nhóm người thông minh đã tới cùng một chỗ sai vì tất cả đều xuất phát từ cùng một giả định không được xét lại — rằng tín hiệu phải đến từ phía trên.","\"Đó không phải lời chỉ trích họ,\" bà viết. \"Đó là một minh hoạ cho việc một ngành có thể có điểm mù như thế nào, và điểm mù ấy có thể kéo dài bao lâu một khi nó đã được ghi vào danh mục.\"","Đức đọc bản nháp vào tháng Hai và gọi điện lúc mười một giờ đêm, việc ông chưa từng làm.","\"Bỏ chữ có lẽ ở trang bốn đi.\"","\"Đó là cách nói dè dặt. Chúng tôi chưa chứng minh được —\"","\"Cô có bốn phép đo độc lập và một cơ chế vật lý. Nếu cô nói dè dặt, mọi người đọc sẽ cho rằng cô dè dặt vì cô không chắc, và họ sẽ ít tin hơn mức bằng chứng xứng đáng được tin.\" Một quãng lặng. \"Tôi đã nhìn những người cẩn thận thua những cuộc tranh luận mà họ đã thắng rồi, Mai ạ. Cứ nói thẳng ra.\"","Cô bỏ chữ có lẽ.","Bài báo ra vào tháng Ba. Phản ứng không kịch tính — chưa từng có gì trong câu chuyện này là kịch tính — nhưng đến tháng Sáu đã có bốn trạm khác lục lại kho lưu trữ của chính họ, và ba trạm tìm thấy tín hiệu nằm sẵn trong hồ sơ, bị ghi thành nhiễu suốt hàng chục năm.","Trạm thứ tư mới là trạm quan trọng. Một trạm nhỏ cách tám trăm cây số về phía nam có một bản ghi từ năm 1974, sớm hơn mọi thứ khác năm năm, và dạng khoảng lặng trong đó khác đi một cách tinh tế.","Linh tìm ra nó, lúc hai giờ sáng, và cô không hề reo lên. Cô tới đứng ở khung cửa căn phòng nơi Mai đang làm việc và đợi được chú ý, và không hiểu sao điều đó còn khiến mọi thứ nặng nề hơn.","\"Các khoảng lặng năm 1974,\" cô nói. \"Chúng ngắn hơn.\"","\"Ngắn hơn thế nào?\"","\"Ngắn hơn năm 1979. Mà năm 1979 lại ngắn hơn 1991. Mà 1991 lại ngắn hơn tuần trước.\" Linh đặt các trang giấy xuống rất cẩn thận, như thể chúng có thể nổ. \"Nó không phải một dạng cố định, chị Mai ạ. Chưa bao giờ là vậy. Nó thay đổi suốt từ đầu tới giờ, chậm đến mức không ai chỉ có vài năm dữ liệu lại có thể nhìn ra.\"","Mai nhìn các con số một lúc lâu và thấy cái nền của hai năm vừa qua lặng lẽ tự sắp xếp lại.","\"Nó đang chậm dần,\" cô nói."],"10":["Bản đề xuất mất chín tháng và bị từ chối hai lần.","Lần từ chối thứ nhất là vì tiền, điều đó thành thật và do đó dễ tranh luận. Lần thứ hai là vì một thứ khác, và Mai mất một lúc mới hiểu là thứ gì.","\"Họ không lo về chi phí,\" Đức nói. \"Họ lo về kết luận.\"","\"Chúng tôi chưa rút ra kết luận nào. Đó chính là mục đích của việc đi ra đó và nhìn.\"","\"Đúng. Tuy nhiên, họ đã đọc bài của cô, và họ thấy được nó dẫn tới đâu.\" Năm ấy ông gầy hơn, và ông ngồi xuống nhiều hơn trước. \"Nếu nguồn nằm trong trầm tích, thì hoặc là có ai đó đặt nó ở đó, hoặc là có thứ gì đó mọc lên ở đó. Cả hai câu trả lời đều kéo theo hệ quả, mà hệ quả thì đòi hỏi quyết định, và một quyết định dở trước công chúng là thứ kết liễu sự nghiệp. Trong khi việc không làm gì thì chưa từng kết liễu sự nghiệp của ai trong lịch sử đất nước này.\"","\"Đó là một lập luận tồi.\"","\"Đó hoàn toàn không phải lập luận. Đó là động cơ lợi ích. Loại đó khó đánh bại hơn nhiều.\"","Bộ hồ sơ cuối cùng họ dựng lên có ba phần, và Linh, người hiểu về các hội đồng giỏi hơn nhiều so với tuổi của cô, sắp xếp chúng theo thứ tự gây khó chịu tăng dần.","Thứ nhất, bằng chứng. Bốn mươi bảy năm ghi liên tục từ mười một trạm, một cơ chế vật lý, một vị trí chính xác trong khoảng hai cây số, và một tốc độ chậm dần giờ đã được xác nhận độc lập. Không ai phản bác điều nào cả.","Thứ hai, cái giá của việc sai. Nếu họ đi ra đó và không tìm thấy gì, tổn thất là một con tàu khảo sát trong ba tuần. Hơn nữa, chính con tàu đó sẽ tạo ra dữ liệu trầm tích mà bốn dự án khác đằng nào cũng cần. Nói cách khác, mặt bất lợi thì nhỏ và lại có ích một phần.","Thứ ba — và đây là phần Mai muốn bỏ đi, còn Linh thì khăng khăng giữ lại — hạn chót.","Bởi vì tín hiệu đang chậm dần, và nếu ngoại suy đường cong, nó sẽ dừng.","Không phải sắp tới. Ước tính tốt nhất nằm đâu đó giữa bốn mươi và chín mươi năm, với một sai số mà Hùng mô tả là \"đáng xấu hổ nhưng thành thật\". Dù vậy, nó dừng. Lần đầu tiên trong toàn bộ lịch sử của chuyện này, có một lý do để vội mà không đơn thuần là sự tò mò.","\"Các vị có ý thức được rằng,\" một thành viên hội đồng lên tiếng, một phụ nữ lịch sự đã im lặng suốt hai tiếng, \"nếu các vị đúng về chuyện này, và chúng ta không làm gì cả, thì hồ sơ sẽ ghi lại rằng chúng ta đã được báo.\"","Không ai trong phòng trả lời bà, và sau này Mai nghĩ rằng chính sự im lặng ấy có lẽ mới là khoảnh khắc quyết định thật sự được đưa ra.","Con tàu được duyệt vào tháng Mười một, cho tháng Tám năm sau, tức là họ có mười tháng và một trở ngại lớn: chưa ai từng lấy được thứ gì lên từ độ sâu trầm tích mềm như vậy mà không phá huỷ nó.","Bảo giải quyết trong sáu tuần bằng một phương pháp mà ông mô tả, khi bị hỏi dồn, là \"cách bọn tôi vẫn nhổ neo ra khỏi bùn\", và Hùng mất một buổi chiều chuyển nó thành bốn trang vật lý nói đúng điều ấy.","Đêm trước khi tàu ra khơi, Mai không ngủ được, và theo thói quen cô đi bộ lên trạm lúc hai giờ sáng.","Tất nhiên Thảo có ở đó. Ngồi trong bóng tối với âm lượng bật to, nghe tiếng gõ, theo cách bà đã làm suốt hai mươi hai năm.","\"Lo à?\" Thảo nói.","\"Em cứ nghĩ mãi về chín nhóm kia.\"","\"Tốt.\" Thảo không quay lại. \"Tôi cũng vậy. Mỗi ngày.\" Bà im lặng một lúc. \"Mà này, Hải mất năm 2011. Tháng trước tôi mới biết. Ông ấy ở Đà Nẵng, với con gái, và theo những gì tôi biết thì sau năm 1994 ông ấy không kể chuyện này với bất kỳ ai.\"","Mai ngồi xuống cạnh bà, và hai người cùng nghe cho tới khi bầu trời bắt đầu ngả xám."],"11":["Hoá ra ngày phi thường nhất đời bạn có thể cực kỳ buồn chán trong mười một tiếng đầu tiên.","Họ tìm ra vị trí vào sáng ngày thứ hai. Thiết bị thả xuống lúc mười một giờ và kéo lên lúc bốn giờ rưỡi, và ở giữa thì tuyệt đối không có gì để làm ngoài nhìn màn hình và ăn, và đến hai giờ chiều Mai đã rơi vào một trạng thái chưa từng trải qua, trong đó cô đồng thời sợ hãi nhất đời mình và chán một cách sâu sắc, gần như xúc phạm.","Dù nghĩ đi nghĩ lại bao nhiêu lần, cô cũng không thể tự bắt mình tin vào bất kỳ kết cục nào trong hai kết cục có thể xảy ra. Không tìm thấy gì thì có vẻ bất khả. Tìm thấy gì đó thì còn bất khả hơn.","Thứ kéo lên là một lõi bùn xám dài hai mét, và cách đáy lõi mười một xăng-ti-mét có một dải thứ gì đó không phải bùn.","Linh thấy nó trước. Cô không nói gì cả. Cô chỉ đặt bàn tay áp phẳng lên ống lõi, như thể để giữ cho nó vững, và đứng đó.","Dải ấy dày chừng bốn mi-li-mét. Dưới ánh đèn nó sẫm hơn lớp trầm tích quanh nó rất ít, và nó có một kết cấu mà Bảo, người đã cầm nắm nhiều đáy biển hơn tất cả những người còn lại cộng lại, nói rằng ông chưa từng thấy.","Dưới kính hiển vi nó đầy những cấu trúc.","Chúng nhỏ — một phần mười mi-li-mét, phần lớn là vậy — và chúng không phải tinh thể, và chúng không phải vỏ sò, và theo hiểu biết của bất cứ ai trên con tàu đó thì chúng không phải bất cứ thứ gì từng được mô tả. Chúng được chế tạo ra. Mỗi cái là một cột rỗng mảnh, bịt kín hai đầu, và mỗi cái dài ngắn khác nhau một chút.","\"Nói tôi nghe các độ dài,\" Mai nói.","Hùng mất hai tiếng để đo đủ số lượng. Khi cuối cùng anh ngẩng lên khỏi thị kính anh trông, lần đầu tiên kể từ khi cô quen anh, hoàn toàn không chắc chắn.","\"Có bốn,\" anh nói. \"Bốn độ dài. Không có gì ở giữa.\"","Không ai nói gì.","\"Tôi muốn nói một điều,\" Hùng nói tiếp, cẩn trọng, \"và tôi thà nói bây giờ còn hơn để sau này bị trích lại rằng tôi đã nghĩ vậy trong bụng. Tôi không cho rằng những thứ này còn sống. Tôi cho rằng chúng được tạo ra bởi một thứ từng sống, và tôi cho rằng chuyện đó xảy ra rất lâu về trước, và tôi cho rằng từ giờ trở đi chúng ta phải cực kỳ cẩn thận với từng chữ mình dùng.\"","\"Vì sao?\" Linh hỏi.","\"Vì chúng ta sắp đặt tên cho mọi thứ.\" Anh tháo kính ra. \"Và bất cứ cái tên nào ta gọi chúng trong tháng tới, cả thế giới sẽ vẫn gọi như vậy sau một trăm năm. Nếu tôi gọi chúng là cơ quan, ai cũng sẽ mặc định có một cơ thể. Nếu tôi gọi chúng là thiết bị, ai cũng sẽ mặc định có một kỹ sư. Thành thật mà nói, tôi không biết chúng là gì, và tôi muốn cái tên thừa nhận điều đó.\"","Họ gọi chúng là các cột, cuối cùng, cái tên không ai hài lòng, và đó vẫn là cái tên chúng mang tới bây giờ.","Các cột không làm gì trong lúc họ quan sát. Nhưng suốt bốn ngày sau đó, trong một bể nước trên boong, những cái còn nguyên vẹn bắt đầu cộng hưởng — yếu ớt, ngắt quãng — và dạng chúng tạo ra là ba ngắn và một dài.","Đã mất bốn mươi bảy năm và chín nhóm nghiên cứu và hai chính phủ để xác lập một dữ kiện mà giờ Mai có thể phát biểu trong tám chữ, và tối đó cô viết nó vào sổ tay rồi nhìn nó rất lâu.","*Tín hiệu đến từ lớp bùn. Nó vẫn luôn như vậy.*","Và bên dưới, vì cô không nhịn được:","*Giờ mới tới phần khó.*"],"12":["Việc dịch mất ba năm, và nó thất bại trong hai năm rưỡi đầu vì một lý do mà Mai sẽ dành phần đời còn lại để kể cho sinh viên.","Giờ họ đã có bảng chữ cái. Bốn độ dài, bốn ký hiệu; các cột đã xác nhận điều đó. Thứ họ không có là bất kỳ ý niệm nào về việc các ký hiệu ấy dùng để làm gì, và mọi nỗ lực đọc chúng đều cho ra thứ văn bản đúng ngữ pháp mà vô nghĩa — đó là loại thất bại nguy hiểm nhất, vì nó không phân biệt được với thành công cho tới khi bạn nhìn thật kỹ.","Hai năm đầu cho ra mười một bản dịch khác nhau. Bản nào cũng nhất quán bên trong. Bản nào cũng bảo vệ được. Không bản nào chứng minh được là đúng, và Hùng, người đã thật sự bị ám ảnh, chỉ ra vấn đề bằng một sự rõ ràng khiến tất cả khốn khổ.","\"Chúng ta không đang giải mã,\" anh nói. \"Chúng ta đang phóng chiếu. Đưa cho một người bốn ký hiệu và đủ thời gian thì họ sẽ tìm ra đúng thứ họ đi tìm. Mỗi bản trong mười một cách đọc này nói về tác giả của nó nhiều hơn nói về các cột.\"","Bước ngoặt đến từ một câu hỏi Linh đặt ra vào một thời điểm tệ, giữa lúc đang cãi nhau, bằng cái giọng của người đã thôi cố tỏ ra khéo léo.","\"Tại sao tất cả chúng ta đều mặc định đó là một câu?\"","\"Vì nó lặp lại,\" Mai nói. \"Sự lặp lại ngụ ý —\"","\"Sự lặp lại chẳng ngụ ý gì cả. Đồng hồ của em cũng lặp lại.\" Linh đẩy ghế ra sau. \"Ba năm nay chúng ta coi cái này là văn bản nghĩa đen mang một nghĩa bóng cần mở khoá. Nếu ngược lại thì sao? Nếu nội dung hoàn toàn là nghĩa đen, còn thứ chúng ta thiếu là *ngữ cảnh* thì sao?\"","Mai dừng lại.","\"Em nói lại đi.\"","Sau này, ai cũng nhớ lúc đó mình đang đứng ở đâu.","Đây là những gì họ có. Một hệ bốn ký hiệu. Một đơn vị lặp lại. Và một tốc độ đã chậm dần, đều đặn, suốt ít nhất năm mươi năm.","Đây là những gì họ đã giả định: rằng sự chậm dần là suy tàn. Rằng cái thứ đó đang hết cót như một chiếc đồng hồ, và các khoảng lặng thay đổi là triệu chứng, không phải thông tin.","Đây là sự thật: các khoảng lặng *chính là* nội dung, và họ đã đọc nội dung như thể đó là nhiễu vì đúng cái lý do mà chín nhóm trước đã đọc tín hiệu thành lỗi thiết bị. Vì nó đã vào danh mục từ sớm, và không ai nhìn vào cái bình thường.","Bốn ký hiệu không đánh vần thành chữ. Chúng đánh vần một con số, theo hệ cơ số bốn, và con số đó được tính lại mỗi chu kỳ, và toàn bộ cái vòng lặp khổng lồ suốt bốn mươi bảy năm là một câu duy nhất được nói đi nói lại với một giá trị đổi khác mỗi lần.","Năm 1974 con số là 3.341.","Tháng trước nó là 2.907.","Nó đang giảm.","Mai nhớ cuộc tranh cãi tiếp sau đó như tuần tồi tệ nhất trong đời nghề của mình, vì cách đọc ấy nhập nhằng đúng ở chỗ quan trọng nhất. Một con số giảm dần có thể là đếm ngược — thời gian còn lại. Hoặc nó có thể là một cuộc kiểm đếm — còn lại bao nhiêu.","Xét về ngữ pháp, các cột không thể cho họ biết là cái nào. Trong một con số không có thì. Ngữ cảnh là thứ duy nhất phân biệt được, và ngữ cảnh lại chính là thứ duy nhất họ không có.","Chính Thảo, người im lặng gần như suốt cả tuần, là người tìm ra lập luận kết thúc chuyện đó.","\"Đếm ngược thì đều,\" bà nói. \"Cái của ta thì không. Nhìn phần sai lệch dư mà xem — Hùng đưa cho chúng ta thứ này hai năm trước và ta đem cất vào hồ sơ. Tốc độ không mượt. Nó có bậc. Nó đứng yên nhiều năm rồi tụt ba đơn vị trong một mùa.\"","\"Đó là nhiễu.\"","\"Đó là tỷ lệ tử vong.\" Thảo nhẹ nhàng đặt tờ giấy xuống. \"Đồng hồ không đứng yên. Quần thể thì có.\"","Không ai nói gì suốt một khoảng rất dài.","\"Vậy thứ chúng ta vẫn nghe,\" cuối cùng Mai nói, và giọng cô nghe không giống giọng của chính mình, \"suốt năm mươi năm —\"","\"Là một bản kiểm đếm những kẻ còn sống sót,\" Thảo nói. \"Do chính những kẻ sống sót giữ. Và cứ vài mùa, lại có ai đó phải đổi con số.\""],"13":["Nhìn lại, điều làm Mai ấn tượng nhất không phải là khám phá. Đó là những năm sau đó bình thường đến mức nào.","Không có tuyên bố nào làm thay đổi thế giới. Có các bài báo, các hội thảo, một bộ phim tài liệu nói sai gần hết, và một cuộc tranh cãi dài lê thê về việc các cột có sống hay không, chuyện vẫn chưa ngã ngũ khi Đức mất vào mùa xuân năm sau đó. Ông đã đọc bản dịch. Ông đã nhờ người đọc cho nghe hai lần, và lần thứ hai ông nói, \"Được. Vậy là đáng hai mươi năm,\" rồi ông hỏi thăm thời tiết ở trạm, và đó là cuộc trò chuyện cuối cùng của họ.","Con số vẫn tiếp tục giảm.","Ngẫm lại, điều khó chấp nhận nhất không phải là có thứ gì đó dưới kia đang chết dần. Đó là phép tính về thang thời gian. Các cột cộng hưởng ở một nhịp khiến một lượt trao đổi mất khoảng bốn trăm năm. Bất kể thứ gì đang giữ bản đếm ấy thì nó đã giữ, ít nhất là, từ trước khi có chữ viết ở bất kỳ đâu trên bề mặt hành tinh này. Nó vẫn đang nói *đây là số chúng tôi còn lại* vào một vùng biển chưa một lần đáp lời.","Sau cùng thì đó chính là điều Mai không thể ngừng nghĩ tới, và đó là lý do cô thúc đẩy việc gửi hồi âm.","Cuộc đấu tranh ấy mất mười một năm. Cô năm mươi mốt tuổi khi máy phát đầu tiên được đưa xuống lớp trầm tích, và người ta đã nói với cô, bằng thiện ý, rằng cô không nên trông đợi sống đủ lâu để thấy bất kỳ hồi đáp nào. Cô biết điều đó. Cô đã làm phép tính kỹ hơn tất cả bọn họ.","Bức thông điệp họ gửi đi rất ngắn. Đã có một cuộc tranh cãi khổng lồ về nội dung, dính líu tới bốn quốc gia và rất nhiều người chưa từng đặt chân tới trạm, và rốt cuộc họ gửi đi thứ duy nhất mà ai cũng đồng ý là đúng.","Một con số. Cơ số bốn. Bản đếm của một thứ trên bề mặt vẫn còn ở đây.","Thảo nghỉ hưu vào năm thứ mười hai và tuần nào cũng quay lại, với lý do là bà chẳng có việc gì hay hơn để làm, một lời nói dối không ai bắt bẻ. Linh giờ điều hành nhóm phía nam và đã công bố nhiều hơn tất cả những người còn lại cộng lại. Bảo mất năm bảy mươi tư tuổi, lặng lẽ, trong một bệnh viện ở Nha Trang, và một nửa đội tàu khảo sát tới dự tang. Hùng, làm mọi người kinh ngạc, đi dạy trung học.","Trạm đã được xây lại hai lần. Nó không còn ẩm nữa, điều mà trong lòng Mai thấy tiếc.","Cô giữ một thứ trên tường toà nhà mới, lồng khung, ở độ cao mà người ta đọc được mà không cần dừng lại. Đó là bản sao một trang sổ trực đề năm 1987, viết tay nhỏ và cẩn thận, với các con giờ viết ngược để cấp trên không để ý.","Bên dưới là dòng chữ cô đã đọc có lẽ mười nghìn lần.","*Đến lúc có ai đó tin chuyện này, tôi sẽ quá già để là người nói ra nó. Vậy cũng được. Phải có ai đó giữ những con số.*","Nhân viên mới hay hỏi về nó, thường là trong tuần đầu tiên. Mai kể cả câu chuyện nếu họ có vẻ muốn nghe, và kể bản ngắn nếu họ không muốn, và dù thế nào cô cũng kết thúc theo một cách, vì sau ba mươi năm cô đã thôi giả vờ rằng mình có một cái kết hay hơn.","\"Ông ấy không phải người phi thường,\" cô nói. \"Ông ấy nhận ra một điều, người ta bảo ông ấy rằng đó không là gì cả, và ông ấy vẫn ghi lại suốt mười lăm năm, rồi ông ấy về nhà sống một cuộc đời bình thường và không kể với ai. Mọi thứ chúng ta có đều đến từ đó. Không phải từ sự thông minh. Từ việc ông ấy từ chối ngừng ghi chép một thứ mà tất cả đã đồng ý là bình thường.\"","Rồi cô bảo họ đi lên chỗ cái chảo thu sóng, thứ vẫn đứng trên đồi phía trên mặt nước, lặng lẽ gỉ đi trong không khí mặn, và giờ, cuối cùng, đang phát đi chứ không chỉ lắng nghe — xuống bốn trăm mét bùn xám mềm, với nhịp một chữ mỗi bốn trăm năm, tới một ai đó vẫn ở dưới kia, và vẫn đang đếm."]},"sent":{"1":[{"en":"She glanced at the door.","vi":"Cô liếc nhìn ra cửa."},{"en":"He sighed and sat down.","vi":"Anh thở dài rồi ngồi xuống."},{"en":"The room was damp and dim.","vi":"Căn phòng ẩm và lờ mờ tối."},{"en":"I could barely hear her.","vi":"Tôi hầu như không nghe được cô ấy."},{"en":"He whispered something to me.","vi":"Anh thì thầm điều gì đó với tôi."},{"en":"She stared at the screen for a long time.","vi":"Cô nhìn chằm chằm vào màn hình rất lâu."},{"en":"The old man walked slowly and stumbled.","vi":"Ông lão đi chậm rồi loạng choạng."},{"en":"He grabbed my arm and pulled me back.","vi":"Anh chộp lấy tay tôi và kéo tôi lại."}],"2":[{"en":"She was relieved to see him.","vi":"Cô nhẹ nhõm khi thấy anh."},{"en":"I felt guilty about it for years.","vi":"Tôi thấy có lỗi về chuyện đó nhiều năm."},{"en":"He was furious, but he said nothing.","vi":"Anh giận dữ, nhưng không nói gì."},{"en":"They were terrified of the dark.","vi":"Họ khiếp sợ bóng tối."},{"en":"She looked puzzled by my question.","vi":"Cô có vẻ bối rối trước câu hỏi của tôi."},{"en":"I am grateful for everything you did.","vi":"Tôi biết ơn mọi điều bạn đã làm."},{"en":"He refused to explain, and I was annoyed.","vi":"Anh từ chối giải thích, và tôi thấy khó chịu."},{"en":"She hesitated, then admitted the truth.","vi":"Cô do dự, rồi thừa nhận sự thật."}],"3":[{"en":"As soon as I arrived, it started to rain.","vi":"Ngay khi tôi đến thì trời bắt đầu mưa."},{"en":"He did it on purpose.","vi":"Anh ta làm vậy cố ý."},{"en":"By the time we got there, the shop was closed.","vi":"Đến lúc chúng tôi tới thì cửa hàng đã đóng."},{"en":"I no longer live in that city.","vi":"Tôi không còn sống ở thành phố đó nữa."},{"en":"She acted as if nothing had happened.","vi":"Cô làm như thể không có chuyện gì xảy ra."},{"en":"In spite of the rain, we walked home.","vi":"Bất chấp trời mưa, chúng tôi đi bộ về."},{"en":"You should keep that in mind.","vi":"Bạn nên ghi nhớ điều đó."},{"en":"Sooner or later, he will find out.","vi":"Sớm muộn gì anh ta cũng biết."}],"4":[{"en":"Don't give up now.","vi":"Đừng bỏ cuộc lúc này."},{"en":"It turned out that she was right.","vi":"Hoá ra là cô ấy đúng."},{"en":"I ran into an old friend yesterday.","vi":"Hôm qua tôi tình cờ gặp một người bạn cũ."},{"en":"He put off the meeting again.","vi":"Anh ta lại hoãn cuộc họp."},{"en":"We need to find out what happened.","vi":"Chúng ta cần phát hiện ra chuyện gì đã xảy ra."},{"en":"She looks after her mother.","vi":"Cô ấy chăm sóc mẹ mình."},{"en":"I came across this book by accident.","vi":"Tôi tình cờ bắt gặp cuốn sách này."},{"en":"Please carry on without me.","vi":"Xin cứ tiếp tục mà không cần tôi."}],"5":[{"en":"I realized that I was wrong.","vi":"Tôi nhận ra rằng mình đã sai."},{"en":"He admitted he had lied.","vi":"Anh thừa nhận mình đã nói dối."},{"en":"She suspected something was wrong.","vi":"Cô nghi ngờ có gì đó không ổn."},{"en":"They warned us about the storm.","vi":"Họ cảnh báo chúng tôi về cơn bão."},{"en":"I assume you have read the letter.","vi":"Tôi cho rằng bạn đã đọc lá thư."},{"en":"He convinced me to try again.","vi":"Anh thuyết phục tôi thử lại."},{"en":"She refused to explain her decision.","vi":"Cô từ chối giải thích quyết định của mình."},{"en":"Nobody expected him to come back.","vi":"Không ai mong đợi anh ta quay lại."}],"6":[{"en":"He had already left when I arrived.","vi":"Anh đã rời đi trước khi tôi đến."},{"en":"Meanwhile, she was waiting outside.","vi":"Trong khi đó, cô đang đợi bên ngoài."},{"en":"Eventually, they agreed to help.","vi":"Cuối cùng thì họ đồng ý giúp."},{"en":"By then it was too late.","vi":"Đến lúc đó thì đã quá muộn."},{"en":"Ever since that day, he has been quiet.","vi":"Kể từ ngày đó, anh trở nên trầm lặng."},{"en":"The problem occurred at midnight.","vi":"Vấn đề xảy ra vào lúc nửa đêm."},{"en":"She had never seen the sea before.","vi":"Cô chưa từng thấy biển trước đó."},{"en":"Shortly after, the noise vanished.","vi":"Ngay sau đó, tiếng ồn biến mất."}],"7":[{"en":"Although it was late, she kept working.","vi":"Mặc dù đã muộn, cô vẫn làm tiếp."},{"en":"I was tired, so I went home.","vi":"Tôi mệt, nên tôi về nhà."},{"en":"He is quiet, whereas his brother talks a lot.","vi":"Anh trầm lặng, trong khi em trai nói rất nhiều."},{"en":"Unless you leave now, you will be late.","vi":"Trừ khi bạn đi ngay, bạn sẽ muộn."},{"en":"She apologized; nevertheless, he was still angry.","vi":"Cô đã xin lỗi; dù vậy anh vẫn giận."},{"en":"The plan is simple, yet it works.","vi":"Kế hoạch đơn giản, vậy mà nó hiệu quả."},{"en":"He left early so that he could catch the bus.","vi":"Anh đi sớm để kịp chuyến xe."},{"en":"Apparently, nobody told her.","vi":"Có vẻ như không ai nói với cô ấy."}],"8":[{"en":"The man who called you is my teacher.","vi":"Người đàn ông gọi cho bạn là thầy tôi."},{"en":"This is the book which changed my mind.","vi":"Đây là cuốn sách đã làm tôi đổi ý."},{"en":"She is stubborn but honest.","vi":"Cô ấy bướng bỉnh nhưng trung thực."},{"en":"He was generous with his time.","vi":"Anh hào phóng với thời gian của mình."},{"en":"His face was pale and weary.","vi":"Gương mặt anh xanh xao và mệt mỏi."},{"en":"I admire people who admit their mistakes.","vi":"Tôi khâm phục người biết thừa nhận sai lầm."},{"en":"Her attitude changed completely.","vi":"Thái độ của cô thay đổi hoàn toàn."},{"en":"The woman whose car broke down called us.","vi":"Người phụ nữ bị hỏng xe đã gọi cho chúng tôi."}],"9":[{"en":"This detail is significant.","vi":"Chi tiết này đáng kể."},{"en":"The author implies that he regrets it.","vi":"Tác giả ngụ ý rằng ông hối tiếc."},{"en":"The evidence does not support that claim.","vi":"Bằng chứng không ủng hộ khẳng định đó."},{"en":"His silence demonstrates his fear.","vi":"Sự im lặng của anh chứng tỏ nỗi sợ."},{"en":"The ending contrasts with the opening.","vi":"Phần kết tương phản với phần mở đầu."},{"en":"This scene reinforces the main theme.","vi":"Cảnh này củng cố chủ đề chính."},{"en":"The narrator is not reliable.","vi":"Người kể chuyện không đáng tin."},{"en":"That moment is the turning point.","vi":"Khoảnh khắc đó là bước ngoặt."}],"10":[{"en":"However, the result was different.","vi":"Tuy nhiên, kết quả lại khác."},{"en":"Therefore, we changed the plan.","vi":"Do đó, chúng tôi đổi kế hoạch."},{"en":"Moreover, the cost was too high.","vi":"Hơn nữa, chi phí quá cao."},{"en":"As a result, nobody came.","vi":"Kết quả là không ai đến."},{"en":"On the other hand, it saved time.","vi":"Mặt khác, nó tiết kiệm thời gian."},{"en":"In short, the idea failed.","vi":"Nói ngắn gọn, ý tưởng đã thất bại."},{"en":"The main drawback is the price.","vi":"Nhược điểm chính là giá."},{"en":"Overall, the impact was small.","vi":"Nhìn chung, tác động là nhỏ."}],"11":[{"en":"It turns out that he was right all along.","vi":"Hoá ra anh ấy đúng suốt từ đầu."},{"en":"No matter how hard I try, it never works.","vi":"Dù tôi cố thế nào, nó vẫn không được."},{"en":"As far as I know, she has left.","vi":"Theo tôi biết, cô ấy đã đi rồi."},{"en":"I would rather stay at home.","vi":"Tôi thà ở nhà còn hơn."},{"en":"We take too many things for granted.","vi":"Chúng ta coi quá nhiều thứ là đương nhiên."},{"en":"His mistake resulted in a long delay.","vi":"Sai lầm của anh dẫn đến sự chậm trễ dài."},{"en":"It is worth reading twice.","vi":"Nó đáng đọc hai lần."},{"en":"There is no point in arguing now.","vi":"Bây giờ chẳng ích gì mà cãi nhau."}],"12":[{"en":"This sentence is ambiguous.","vi":"Câu này nhập nhằng."},{"en":"Try to be more concise.","vi":"Hãy cố súc tích hơn."},{"en":"The meaning depends on the context.","vi":"Nghĩa phụ thuộc vào ngữ cảnh."},{"en":"He used the word in a figurative sense.","vi":"Anh dùng từ đó theo nghĩa bóng."},{"en":"I need to revise this paragraph.","vi":"Tôi cần sửa lại đoạn này."},{"en":"Your tenses are not consistent.","vi":"Thì của bạn không nhất quán."},{"en":"Could you clarify that point?","vi":"Bạn làm rõ điểm đó được không?"},{"en":"The two words differ in nuance.","vi":"Hai từ khác nhau về sắc thái."}],"13":[{"en":"Looking back, it was worth the effort.","vi":"Nhìn lại, nó đáng công sức bỏ ra."},{"en":"In retrospect, I should have started earlier.","vi":"Ngẫm lại, lẽ ra tôi nên bắt đầu sớm hơn."},{"en":"What struck me was her patience.","vi":"Điều làm tôi ấn tượng là sự kiên nhẫn của cô."},{"en":"Compared to last year, I read much faster.","vi":"So với năm ngoái, tôi đọc nhanh hơn nhiều."},{"en":"This book is thought-provoking.","vi":"Cuốn sách này gợi suy nghĩ."},{"en":"Ultimately, consistency matters more than talent.","vi":"Sau cùng, sự đều đặn quan trọng hơn tài năng."},{"en":"I would highly recommend it.","vi":"Tôi rất khuyên đọc nó."},{"en":"The next step is a harder book.","vi":"Bước tiếp theo là một cuốn khó hơn."}]},"gist":{"1":"Mai trực ca đêm ở một trạm thu tín hiệu nhỏ trên đồi ven biển. Lúc hai giờ sáng, màn hình xuất hiện một dạng lặp đều đặn: ba nhịp ngắn, một nhịp dài. Cô kiểm tra hết dây, quạt, lò sưởi — không có gì hỏng. Cô ngồi nghe suốt bốn mươi phút và không viết nổi một chữ vào sổ.","2":"Thảo, đồng nghiệp lớn tuổi, nghe thử và nhận ra ngay — vì cô đã từng nghe nó từ mười chín năm trước. Thảo lấy ra một cuốn sổ cũ bốn mươi năm, trong đó có đúng dòng chữ ấy, kèm một câu: đã báo cáo, được lệnh không báo cáo nữa.","3":"Thảo chỉ cho Mai thấy: khoảng lặng giữa các nhịp không đều nhau. Cái lặp đi lặp lại không phải nội dung, nó chỉ là cây bút. Suốt bốn mươi năm mọi người nghe cây bút mà tưởng đó là chữ. Lý do không ai phát hiện: tín hiệu đã bị xếp vào danh mục \"bình thường\", mà không ai xem lại thứ gì đã bình thường.","4":"Một người tên Đức từ Bộ xuống. Ông thừa nhận tín hiệu là thật và đã được biết từ 1979, nhưng bị cố tình ghi thành nhiễu để khỏi gây hoang mang. Ông muốn giao lại toàn bộ hồ sơ cho Mai, và nói thẳng rằng nhận rồi thì không trả lại được.","5":"Mai nhận việc. Sáu tuần sau cô và Thảo dựng được một mô hình đẹp, đọc các khoảng lặng theo hệ cơ số bốn và ra một đường cong sạch. Đức đọc xong và cho biết đường cong đó nằm trong chính phương pháp, không nằm trong tín hiệu — đã có chín đội mắc đúng lỗi này.","6":"Mai nghỉ mười một ngày rồi quay lại đọc lịch sử thay vì dữ liệu. Cô tìm ra Hải, người trực ca năm 1979, người đã bị cấm báo cáo nhưng vẫn lén ghi tín hiệu suốt mười lăm năm bằng cách viết ngược giờ. Cô yêu cầu được xem cả tám hồ sơ còn lại.","7":"Hai giả thuyết đối đầu suốt hai tháng: Thảo cho rằng đó là ngọn hải đăng chỉ nói \"vẫn còn đây\", Mai cho rằng đó là thông điệp mà ai cũng tìm sai loại chữ viết. Trong lúc cãi nhau, họ nhận ra một dữ kiện nằm trong hồ sơ từ lâu: hai trạm cách nhau bốn trăm cây số nghe lệch nhau mười một phút. Không có gì trên bầu trời đến lệch như vậy.","8":"Ba nhân sự mới đến. Linh trẻ và cực kỳ sắc sảo, Bảo sáu mươi mốt tuổi ít nói và sửa được mọi thứ, Hùng giỏi nhất phòng và kiêu ngạo nhất phòng. Bế tắc được phá bởi Bảo, người buột miệng rằng mười một phút là đúng bằng tốc độ âm thanh truyền trong bùn đáy biển.","9":"Họ viết bài báo khoa học, và Hùng bắt viết lại bốn lần với nguyên tắc: giả định người đọc muốn mình sai. Bài công bố, bốn trạm khác lục lại kho lưu trữ và tìm thấy tín hiệu đã bị ghi nhầm thành nhiễu hàng chục năm. Một bản ghi từ 1974 cho thấy khoảng lặng lúc đó ngắn hơn — tín hiệu đang chậm dần.","10":"Đề xuất khảo sát bị từ chối hai lần. Lần đầu vì tiền, lần sau vì không ai muốn chịu trách nhiệm cho kết luận. Linh sắp xếp lập luận theo thứ tự gây khó chịu tăng dần, và điều thuyết phục được hội đồng là hạn chót: nếu ngoại suy đường cong, tín hiệu sẽ dừng hẳn trong khoảng bốn mươi đến chín mươi năm nữa.","11":"Con tàu khảo sát lấy được lõi bùn dài hai mét. Cách đáy mười một xăng-ti-mét có một lớp dày bốn mi-li-mét chứa đầy những cấu trúc hình cột rỗng nhỏ li ti — do thứ gì đó sống làm ra, rất lâu về trước. Chúng có đúng bốn độ dài khác nhau. Trong bể trên boong, chúng cộng hưởng theo nhịp ba ngắn một dài.","12":"Bản dịch mất ba năm và hỏng suốt hai năm rưỡi vì tất cả đều giả định đó là một câu. Linh hỏi ngược: nếu nội dung hoàn toàn là nghĩa đen, còn thứ thiếu là ngữ cảnh thì sao? Hoá ra chính các khoảng lặng là nội dung: một con số hệ cơ số bốn, được tính lại mỗi chu kỳ, và đang giảm dần. Con số giảm có thể là đếm ngược, cũng có thể là kiểm đếm. Thảo tìm ra câu trả lời: tốc độ giảm không đều, mà đồng hồ thì không đứng yên, chỉ có quần thể mới vậy.","13":"Nhiều năm sau, không có tuyên bố nào làm rung chuyển thế giới, chỉ có các bài báo và những cuộc tranh cãi dài. Con số vẫn giảm. Mai đấu tranh mười một năm để được gửi một câu trả lời xuống lớp bùn, dù một lượt trao đổi mất khoảng bốn trăm năm và cô biết mình sẽ không sống tới lúc có hồi âm. Trên tường trạm mới, cô treo một trang sổ chép tay của Hải năm 1987."},"ph0":{"name":"Chặng 0","blocks":[["Luyện âm",12,"sound"],["20 từ mới",13,"core"],["Ôn từ cũ",8,"review"],["Ngữ pháp",12,"gram"],["Luyện nói",8,"speak"],["Chính tả",7,"dict"]]},"ph":[{"w":[1,4],"name":"Nền","blocks":[["Đọc truyện",18,"story"],["Học Unit trong sách",14,"book"],["Từ mới",10,"vocab"],["Ôn từ cũ",8,"review"],["Luyện nói",10,"speak"]]},{"w":[5,8],"name":"Cấu trúc","blocks":[["Đọc truyện",16,"story"],["Học Unit trong sách",12,"book"],["Từ mới",9,"vocab"],["Ôn từ cũ",8,"review"],["Luyện nói",10,"speak"],["Tóm tắt bằng tiếng Anh",5,"write"]]},{"w":[9,13],"name":"Viết","blocks":[["Đọc truyện",10,"story"],["Học Unit trong sách",10,"book"],["Từ mới",7,"vocab"],["Ôn từ cũ",8,"review"],["Luyện nói",10,"speak"],["Viết đoạn văn",15,"write"]]}]};
