<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Inklish — học tiếng Anh từ A0 đến C1 bằng Apple Pencil trên iPad.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inklish">
<meta name="theme-color" content="#E7ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101619" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
</head>
<body>
<title>Inklish</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{
  --paper:#E7ECEF; --sheet:#FCFDFD; --sunk:#DDE4E8;
  --ink:#131D26; --ink2:#52626D; --ink3:#8695A0;
  --rule:#C7D2D9; --hair:#DFE6EA;
  --teal:#0E6257; --teal-w:#DCEBE7;
  --red:#B23A2E;  --red-w:#F6E2DF;
  --amber:#9C6B14; --amber-w:#F6E9CC;
  --pen:#1B3A5C;
  --serif:"Literata",Georgia,"Iowan Old Style",serif;
  --sans:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(19,29,38,.06),0 6px 18px -10px rgba(19,29,38,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101619; --sheet:#182026; --sunk:#141B20;
    --ink:#E2E9ED; --ink2:#9DAEB8; --ink3:#6D7E88;
    --rule:#2C3941; --hair:#232E35;
    --teal:#4FC3A8; --teal-w:#14312C;
    --red:#E88676;  --red-w:#331E1B;
    --amber:#D5A445; --amber-w:#332A16;
    --pen:#8FB6DB;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#101619; --sheet:#182026; --sunk:#141B20;
  --ink:#E2E9ED; --ink2:#9DAEB8; --ink3:#6D7E88;
  --rule:#2C3941; --hair:#232E35;
  --teal:#4FC3A8; --teal-w:#14312C;
  --red:#E88676;  --red-w:#331E1B;
  --amber:#D5A445; --amber-w:#332A16;
  --pen:#8FB6DB;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh;min-height:100dvh}
.bar{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:var(--sheet);border-bottom:1px solid var(--hair);flex:0 0 auto;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.brand b{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.015em}
.brand i{font-style:normal;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.rail{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px}
.track{position:relative;flex:1 1 auto;height:3px;background:var(--rule);border-radius:2px;min-width:60px}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:2px}
.track .dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink)}
.railcap{font-size:12px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--ink2)}
.iconbtn:hover{background:var(--sunk)}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.main{flex:1 1 auto;display:flex;min-height:0}
.nav{
  flex:0 0 auto;display:flex;gap:2px;background:var(--sheet);border-top:1px solid var(--hair);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
}
.nav button{
  flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px;border-radius:9px;color:var(--ink3);font-size:11px;font-weight:500;
}
.nav button[aria-selected="true"]{color:var(--teal);background:var(--teal-w)}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.pane{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:20px 18px 40px}
.pane.pad-lg{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.col{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.col.wide{max-width:860px}

/* ---------- surfaces ---------- */
.sheet{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);padding:18px 20px}
.sheet.flat{box-shadow:none}
.sheet.lift{box-shadow:var(--shadow)}
.eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.lede{color:var(--ink2);font-size:14.5px}
.hr{height:1px;background:var(--hair);border:0;margin:0}
.en{font-family:var(--serif)}
.num{font-variant-numeric:tabular-nums}

/* ---------- blocks list (today) ---------- */
.blocks{display:flex;flex-direction:column;gap:0;background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
.blk{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%;border-bottom:1px solid var(--hair)}
.blk:last-child{border-bottom:0}
.blk:hover{background:var(--sunk)}
.blk .tick{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--rule);display:grid;place-items:center}
.blk[data-done="1"] .tick{background:var(--teal);border-color:var(--teal)}
.blk[data-done="1"] .tick svg{display:block;stroke:var(--sheet)}
.blk .tick svg{display:none;width:12px;height:12px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.blk .tx{flex:1 1 auto;min-width:0}
.blk .tx b{display:block;font-weight:500;font-size:15.5px}
.blk .tx span{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.blk[data-done="1"] .tx b{color:var(--ink3)}
.blk .mins{flex:0 0 auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 17px;border-radius:9px;font-weight:500;font-size:15px;
  background:var(--sunk);color:var(--ink);border:1px solid transparent;
}
.btn:hover{border-color:var(--rule)}
.btn.pri{background:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.pri,
:root:not([data-theme="light"]) .btn.pri{color:#08201C}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
.btn.ghost{background:none;border-color:var(--rule)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:8px}
.btn.red{background:var(--red-w);color:var(--red)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.split{justify-content:space-between}

/* thumb-zone action bar: controls at the bottom EDGES, never centre */
.thumbbar{
  position:sticky;bottom:0;z-index:5;margin-top:2px;
  padding:10px 12px;background:var(--sheet);border:1px solid var(--hair);
  border-radius:12px;box-shadow:var(--shadow);
  display:flex;justify-content:space-between;gap:10px;align-items:center;
}

/* ---------- ink pad ---------- */
.padwrap{position:relative;border-radius:var(--r);overflow:hidden;background:var(--sheet);border:1px solid var(--hair)}
.padwrap canvas{display:block;width:100%;touch-action:none;-webkit-user-select:none;user-select:none}
.padtools{display:flex;align-items:center;gap:6px;padding:7px 9px;border-top:1px solid var(--hair);background:var(--sheet);flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}
.swatch i{display:block;width:15px;height:15px;border-radius:50%}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.nibs{display:flex;gap:3px}
.nib{width:28px;height:26px;border-radius:7px;display:grid;place-items:center}
.nib i{display:block;background:currentColor;border-radius:99px}
.nib[aria-pressed="true"]{background:var(--sunk)}
.penonly{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-left:auto}
.penonly input{width:17px;height:17px;accent-color:var(--teal)}

/* ---------- scribble field ---------- */
.scribble{
  width:100%;display:block;padding:14px 14px;border-radius:var(--r);
  background:var(--sheet);border:1px solid var(--rule);
  font-family:var(--serif);font-size:22px;line-height:2.1;letter-spacing:.01em;
  background-image:repeating-linear-gradient(var(--sheet) 0 calc(2.1em - 1px),var(--rule) calc(2.1em - 1px) 2.1em);
  background-position:0 .35em;
  resize:vertical;
}
.scribble:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-w)}
.scribble::placeholder{color:var(--ink3);font-family:var(--sans);font-size:15px}
.hint-pencil{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.hint-pencil svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}

/* ---------- diff ---------- */
.diff{font-family:var(--serif);font-size:23px;line-height:1.7;word-break:break-word}
.diff .ok{color:var(--ink)}
.diff .miss{color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.75}
.diff .add{color:var(--red);background:var(--red-w);border-radius:3px;padding:0 1px}
.diff .want{color:var(--teal);background:var(--teal-w);border-radius:3px;padding:0 1px}

/* ---------- word chips / reader ---------- */
.reader{font-family:var(--serif);font-size:19.5px;line-height:1.78;letter-spacing:.005em}
.reader p{margin:0 0 1.05em}
.reader .w{border-radius:3px;padding:0 1px;cursor:pointer}
.reader .w[data-k="0"]{background:var(--amber-w);box-shadow:inset 0 -1.5px 0 var(--amber)}
.reader .w[data-k="1"]{background:var(--teal-w)}
.reader .w[data-k="2"]{box-shadow:inset 0 -1px 0 var(--rule)}
.reader .w[data-k="3"]{}
.readwrap{position:relative}
.readwrap canvas.overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

.pop{position:fixed;z-index:60;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;
  box-shadow:var(--shadow);padding:12px 14px;max-width:290px;display:flex;flex-direction:column;gap:9px}
.pop b{font-family:var(--serif);font-size:19px;font-weight:600}
.pop .m{font-size:14.5px;color:var(--ink2)}
.pop .ks{display:flex;gap:4px}
.pop .ks button{flex:1 1 0;padding:6px 2px;font-size:11px;border-radius:7px;background:var(--sunk);color:var(--ink2)}
.pop .ks button[aria-pressed="true"]{background:var(--teal);color:#fff}

/* ---------- cards / stats ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:620px){.g3{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r);padding:13px 14px}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.stat span{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--sunk);color:var(--ink2)}
.pill.ok{background:var(--teal-w);color:var(--teal)}
.pill.bad{background:var(--red-w);color:var(--red)}
.pill.warn{background:var(--amber-w);color:var(--amber)}

/* ---------- pair / minimal pairs ---------- */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-radius:9px;background:var(--sunk);font-family:var(--serif);font-size:18px}
.pairbtn small{font-family:var(--sans);font-size:11px;color:var(--ink3)}

/* ---------- misc ---------- */
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink2)}
.kv b{font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--ink2);background:var(--sunk);border-radius:9px;padding:11px 13px}
.note.warn{background:var(--amber-w);color:var(--amber)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:7px 13px;border-radius:99px;font-size:13.5px;color:var(--ink2);white-space:nowrap;background:var(--sunk)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.big{font-family:var(--serif);font-size:30px;line-height:1.35;letter-spacing:-.01em}
.mid{font-family:var(--serif);font-size:22px;line-height:1.5}
.vi{color:var(--ink2);font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.wordline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.wordline:last-child{border-bottom:0}
.wordline b{font-family:var(--serif);font-size:18px;font-weight:500}
.wordline span{font-size:14px;color:var(--ink2);text-align:right}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:14.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* landscape iPad: session rail beside the working surface */
@media (min-width:900px){
  .pane{padding:26px 28px 44px}
  .split{display:grid;grid-template-columns:296px 1fr;gap:26px;align-items:start;max-width:1080px;margin:0 auto}
  .nav{flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--hair);padding:14px 8px;width:88px}
  .nav button{flex:0 0 auto;padding:11px 2px}
  .main{flex-direction:row-reverse}
  .thumbbar{padding:11px 14px}
}
</style>
<link rel="stylesheet" href="experience.css">
<link rel="stylesheet" href="complete.css">

<div id="app">
  <header class="bar">
    <div class="brand"><b>Inklish</b><i id="stagecap">Chặng 0</i></div>
    <div class="rail">
      <div class="track" id="track"><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div>
      <div class="railcap" id="railcap">buổi 1</div>
    </div>
    <button class="iconbtn" id="themebtn" title="Sáng / tối" aria-label="Đổi sáng tối">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>
  <div class="main">
    <nav class="nav" id="nav" role="tablist"></nav>
    <div class="pane pad-lg" id="pane"></div>
  </div>
</div>
<script>
const D={"sounds":[{"id":1,"title":"Phụ âm cuối phải bật ra","why":"Tiếng Việt không bật phụ âm cuối. Người Việt đọc \"cat\" thành \"ca\", \"book\" thành \"bu\". Người nghe mất chữ cuối là mất nghĩa cả câu.","how":"Đọc xong nguyên âm thì chặn hơi lại bằng lưỡi hoặc môi, rồi thả ra một hơi nhẹ. Không cần to, chỉ cần có.","pairs":[["car","cart"],["bar","bark"],["see","seat"],["blue","blood"],["no","note"],["play","plate"]]},{"id":2,"title":"Đuôi -s và -es","why":"Bỏ đuôi -s là lỗi phổ biến nhất. \"He work\" nghe như người mới học, và \"two book\" thì người nghe phải đoán.","how":"Sau âm không rung (p, t, k, f) đọc là /s/. Sau âm rung (b, d, g, v, nguyên âm) đọc là /z/. Sau s, sh, ch, x đọc là /iz/.","pairs":[["book","books"],["dog","dogs"],["face","faces"],["work","works"],["friend","friends"],["box","boxes"]]},{"id":3,"title":"Đuôi -ed","why":"Không có -ed thì người nghe không biết bạn đang kể chuyện quá khứ hay hiện tại.","how":"Sau t hoặc d đọc thành /id/. Sau âm không rung đọc /t/. Còn lại đọc /d/. Chỉ thêm một âm, không thêm một vần.","pairs":[["walk","walked"],["want","wanted"],["play","played"],["ask","asked"],["need","needed"],["live","lived"]]},{"id":4,"title":"Âm /θ/ trong think","why":"Người Việt thay bằng /t/ hoặc /s/. \"Think\" thành \"tink\", \"three\" thành \"tree\".","how":"Đặt đầu lưỡi chạm nhẹ mép răng trên rồi thổi hơi qua. Lưỡi phải nhô ra, nhìn thấy được trong gương.","pairs":[["think","sink"],["three","tree"],["thin","tin"],["thought","taught"],["path","pass"],["mouth","mouse"]]},{"id":5,"title":"Âm /ð/ trong this","why":"Người Việt thay bằng /d/ hoặc /z/. Đây là âm xuất hiện nhiều nhất trong tiếng Anh vì nằm trong \"the\".","how":"Cùng vị trí lưỡi như /θ/ nhưng có rung ở cổ họng. Đặt tay lên cổ, phải thấy rung.","pairs":[["they","day"],["then","den"],["there","dare"],["breathe","breeze"],["other","udder"],["with","wit"]]},{"id":6,"title":"Âm /z/ cuối từ","why":"Người Việt đọc thành /s/. \"Rise\" thành \"rice\", \"eyes\" thành \"ice\".","how":"Gi  be","b":"Ba dạng duy nhất cần nhớ: I am · he/she/it is · you/we/they are.\nPhủ định thêm not. Câu hỏi thì đảo lên đầu.","ex":["I am a student.","She is my friend.","Are you ready?","They are not here."]},{"n":2,"t":"Đại từ chủ ngữ","b":"I, you, he, she, it, we, they. Tiếng Anh bắt buộc phải có chủ ngữ — tiếng Việt lược được, tiếng Anh thì không.\n\"Đói rồi\" phải nói \"I am hungry.\"","ex":["He is my brother.","It is cold today.","We are late.","They work here."]},{"n":3,"t":"Mạo từ a và an","b":"Dùng a/an khi nhắc lần đầu, cho một cái bất kỳ. Trước âm nguyên âm thì dùng an.\nTiếng Việt không có mạo từ nên rất dễ quên.","ex":["I have a car.","She is an engineer.","He bought a book.","It is an old house."]},{"n":4,"t":"Mạo từ the","b":"Dùng the khi cả hai bên đều biết đang nói tới cái nào — vì đã nhắc rồi, hoặc chỉ có một cái.","ex":["I bought a book. The book is good.","Close the door, please.","The sun is hot.","Where is the station?"]},{"n":5,"t":"Số nhiều","b":"Thêm -s. Sau s, sh, ch, x thì thêm -es. Phụ âm + y thì đổi thành -ies.\nMột số từ bất quy tắc: man/men, child/children, foot/feet.","ex":["two books","three boxes","five babies","many people"]},{"n":6,"t":"This, that, these, those","b":"This và these cho vật ở gần. That và those cho vật ở xa. These và those là số nhiều.","ex":["This is my phone.","That is her house.","These books are new.","Those men are waiting."]},{"n":7,"t":"Have và has","b":"I/you/we/they have. He/she/it has.\nPhủ định và câu hỏi dùng do/does: I do not have, does she have.","ex":["I have two sisters.","She has a new job.","Do you have time?","He does not have money."]},{"n":8,"t":"Hiện tại đơn","b":"Nói việc lặp lại hoặc sự thật. Ngôi thứ ba số ít phải thêm -s vào động từ.\nĐây là lỗi người Việt mắc nhiều nhất.","ex":["I work every day.","He works in a bank.","We live in Nha Trang.","She goes to school."]},{"n":9,"t":"Câu hỏi với do và does","b":"Do + I/you/we/they. Does + he/she/it. Sau does thì động từ trở về nguyên mẫu, không còn -s.","ex":["Do you like coffee?","Does he speak English?","Where do they live?","What does she want?"]},{"n":10,"t":"Câu phủ định","b":"do not / does not + động từ nguyên mẫu. Nói tắt là don't và doesn't.\nVới to be thì không dùng do: I am not, he is not.","ex":["I do not smoke.","She does not eat meat.","They are not ready.","He is not at home."]},{"n":11,"t":"Can","b":"Nói về khả năng hoặc xin phép. Sau can luôn là động từ nguyên mẫu, không bao giờ thêm -s hay to.","ex":["I can swim.","She can speak three languages.","Can you help me?","He cannot come today."]},{"n":12,"t":"There is và there are","b":"Dùng để nói có cái gì tồn tại ở đâu. There is + số ít. There are + số nhiều.","ex":["There is a book on the table.","There are two cars outside.","Is there a problem?","There are no seats left."]},{"n":13,"t":"Sở hữu","b":"Thêm 's cho người: Mai's book. Tính từ sở hữu: my, your, his, her, its, our, their.","ex":["This is Mai's bag.","My name is Linh.","Their house is big.","Is this your phone?"]},{"n":14,"t":"Tính từ đứng trước danh từ","b":"Tiếng Anh đặt tính từ TRƯỚC danh từ, ngược với tiếng Việt. \"Nhà đẹp\" thành \"a beautiful house\".\nTính từ không bao giờ thêm -s.","ex":["a big house","two small cars","an interesting book","cold water"]},{"n":15,"t":"Giới từ chỉ nơi chốn","b":"in dùng cho không gian bao quanh, on cho bề mặt, at cho một điểm cụ thể.","ex":["in the room","on the table","at the station","in Vietnam"]},{"n":16,"t":"Giới từ chỉ thời gian","b":"in + tháng, năm, buổi. on + ngày, thứ. at + giờ chính xác.","ex":["in July","in the morning","on Monday","at seven o'clock"]},{"n":17,"t":"Hiện tại tiếp diễn","b":"am/is/are + động từ-ing. Nói việc đang diễn ra ngay lúc này.","ex":["I am reading a book.","She is working now.","They are not listening.","What are you doing?"]},{"n":18,"t":"Phân biệt hai thì hiện tại","b":"Hiện tại đơn cho thói quen. Hiện tại tiếp diễn cho việc đang xảy ra.\n\"I work here\" là nghề của tôi. \"I am working\" là lúc này tôi đang làm.","ex":["I usually walk to work.","Today I am taking the bus.","He plays football on Sunday.","He is playing right now."]},{"n":19,"t":"Quá khứ của to be","b":"was cho I/he/she/it. were cho you/we/they.","ex":["I was tired.","She was at home.","They were late.","Were you there?"]},{"n":20,"t":"Quá khứ đơn có quy tắc","b":"Thêm -ed. Đuôi -ed phải đọc ra, nếu không người nghe không biết bạn đang kể quá khứ.","ex":["I worked yesterday.","She called me.","We watched a film.","They asked a question."]},{"n":21,"t":"Quá khứ bất quy tắc","b":"Khoảng 100 động từ không theo quy tắc. Học 20 từ hay dùng nhất trước.\ngo/went · have/had · do/did · say/said · see/saw · come/came · take/took · get/got\n\nBảng đầy đủ 60 từ nằm ở Thư viện → Động từ bất quy tắc, có cả phần luyện gõ.","ex":["I went home.","She had lunch.","He saw the film.","We took a taxi."]},{"n":22,"t":"Câu hỏi và phủ định ở quá khứ","b":"Dùng did cho mọi ngôi. Sau did thì động từ trở về nguyên mẫu.","ex":["Did you go?","She did not come.","What did he say?","I did not know."]},{"n":23,"t":"Tương lai với going to","b":"am/is/are going to + động từ. Dùng cho kế hoạch đã định.","ex":["I am going to study tonight.","She is going to buy a car.","Are you going to come?","It is going to rain."]},{"n":24,"t":"Tương lai với will","b":"will + động từ nguyên mẫu. Dùng cho quyết định ngay lúc nói, dự đoán, lời hứa.","ex":["I will help you.","It will be fine.","She will not agree.","Will you come?"]},{"n":25,"t":"Từ để hỏi","b":"what, who, where, when, why, how. Đặt ở đầu câu, sau đó tới trợ động từ rồi mới tới chủ ngữ.","ex":["What do you want?","Where does she live?","Why are you late?","How much is it?"]},{"n":26,"t":"Đếm được và không đếm được","b":"Danh từ không đếm được không có số nhiều và không dùng a/an: water, money, time, information.","ex":["some water","a lot of money","two bottles of water","much time"]},{"n":27,"t":"Some, any, much, many","b":"some cho câu khẳng định. any cho câu hỏi và phủ định. many cho đếm được, much cho không đếm được.","ex":["I have some money.","Do you have any questions?","How many people?","How much water?"]},{"n":28,"t":"So sánh hơn","b":"Tính từ ngắn thêm -er + than. Tính từ dài dùng more + tính từ + than.\nBất quy tắc: good/better, bad/worse.","ex":["She is taller than me.","This is more expensive.","My car is better.","Today is worse than yesterday."]},{"n":29,"t":"So sánh nhất","b":"Tính từ ngắn thêm -est với the. Tính từ dài dùng the most.","ex":["the biggest city","the most beautiful place","the best film","the worst day"]},{"n":30,"t":"Trạng từ tần suất","b":"always, usually, often, sometimes, never. Đặt TRƯỚC động từ thường, nhưng SAU động từ to be.","ex":["I always drink coffee.","She is always late.","We never go there.","He sometimes works at night."]}],"phr":[[["my name","tên tôi"],["I am","tôi là"],["you are","bạn là"],["this is","đây là"],["it is","nó là"],["not now","không phải bây giờ"]],[["I have","tôi có"],["she has","cô ấy có"],["we go","chúng tôi đi"],["he comes","anh ấy đến"],["they make","họ làm"],["I take","tôi lấy"]],[["I say","tôi nói"],["tell me","nói tôi nghe"],["ask him","hỏi anh ấy"],["look here","nhìn đây"],["listen to me","nghe tôi này"],["I know","tôi biết"]],[["I think so","tôi nghĩ vậy"],["I want it","tôi muốn cái đó"],["I need help","tôi cần giúp"],["I like it","tôi thích nó"],["I feel good","tôi thấy khoẻ"],["I hope so","tôi hy vọng vậy"]],[["I can go","tôi đi được"],["she can help","cô ấy giúp được"],["we will see","rồi sẽ biết"],["you should rest","bạn nên nghỉ"],["he must work","anh ấy phải làm"],["let me try","để tôi thử"]],[["what is this","đây là cái gì"],["who is he","anh ấy là ai"],["where is it","nó ở đâu"],["how much","bao nhiêu tiền"],["how many","bao nhiêu cái"],["why not","sao lại không"]],[["my family","gia đình tôi"],["his mother","mẹ anh ấy"],["her friend","bạn cô ấy"],["our children","con của chúng tôi"],["their names","tên của họ"],["a young man","một chàng trai"]],[["in the house","trong nhà :"Khung năm câu","b":"1. Câu chủ đề — nói thẳng ý chính\n2-4. Ba câu chống đỡ — lý do, ví dụ, chi tiết\n5. Câu chốt — hệ quả hoặc nhận định\n\nVí dụ:\n\"The boy trusts no one in the village. His father left when he was six. The neighbours whisper about his family. Even his teacher looks away when he speaks. By the end of the chapter, his silence feels earned.\"\n\nMỗi ngày một đoạn. Đừng viết dài hơn. Viết ngắn mà chặt khó hơn viết dài mà lỏng — và đó mới là thứ cần luyện.","say":"The boy trusts no one in the village. By the end of the chapter, his silence feels earned."},"words":[["significant","đáng kể"],["crucial","then chốt"],["essential","thiết yếu"],["vital","sống còn"],["minor","nhỏ nhặt"],["trivial","vụn vặt"],["relevant","liên quan"],["irrelevant","không liên quan"],["obvious","hiển nhiên"],["subtle","tinh tế, khó thấy"],["complex","phức tạp"],["straightforward","đơn giản rõ ràng"],["effective","hiệu quả"],["efficient","hiệu suất cao"],["useful","hữu ích"],["worthless","vô giá trị"],["reasonable","hợp lý"],["absurd","vô lý"],["logical","hợp logic"],["contradictory","mâu thuẫn"],["consistent","nhất quán"],["accurate","chính xác"],["misleading","gây hiểu lầm"],["convincing","thuyết phục"],["questionable","đáng ngờ"],["biased","thiên vị"],["typical","điển hình"],["unusual","bất thường"],["remarkable","đáng chú ý"],["ordinary","bình thường"],["imply","ngụ ý"],["emphasize","nhấn mạnh"],["illustrate","minh hoạ"],["demonstrate","chứng minh"],["indicate","cho thấy"],["represent","đại diện"],["symbolize","tượng trưng"],["reflect","phản ánh"],["contrast","tương phản"],["compare","so sánh"],["reinforce","củng cố"],["undermine","làm suy yếu"],["establish","thiết lập"],["challenge","thách thức"],["oppose","phản đối"],["theme","chủ đề"],["plot","cốt truyện"],["setting","bối cảnh"],["conflict","xung đột"],["narrator","người kể chuyện"],["perspective","góc nhìn"],["tone","giọng điệu"],["symbol","biểu tượng"],["metaphor","ẩn dụ"],["irony","trớ trêu"],["climax","cao trào"],[ g"],["in my view","theo tôi"],["from my perspective","từ góc nhìn của tôi"],["it occurred to me","tôi chợt nghĩ"],["I came to realize","tôi dần nhận ra"],["I had assumed","tôi đã tưởng"],["throughout the book","xuyên suốt cuốn sách"],["by the end","đến cuối"],["early on","từ sớm"],["halfway through","đến giữa chừng"],["the author suggests","tác giả gợi ý"],["the author argues","tác giả lập luận"],["the story follows","câu chuyện theo chân"],["the novel explores","tiểu thuyết khai thác"],["set in","lấy bối cảnh"],["based on","dựa trên"],["told from","kể từ góc nhìn"],["centred on","xoay quanh"],["next step","bước tiếp theo"],["going forward","từ nay về sau"],["build on","phát triển từ"],["keep going","cứ tiếp tục"],["raise the bar","nâng chuẩn lên"],["push further","đẩy xa hơn"],["start over","bắt đầu lại"],["move on","đi tiếp"]],"days":["Đọc nốt những chương còn lại.","Đọc xong cuốn sách.","Kiểm tra 1: đọc lại 100 từ trang đầu, đếm từ không hiểu.","Kiểm tra 2: bấm giờ 10 phút, đếm trang.","Kiểm tra 3: viết bài 3 đoạn về cuốn sách.","Đặt bài hôm qua cạnh đoạn viết đầu tiên ở tuần 5.","Chọn cuốn sách tiếp theo. Khó hơn một bậc."]}],"sa":{"title":"The Man Who Kept the Numbers","vi":"Người giữ những con số","blurb":"Câu ngắn, từ đơn giản, 12 chương. Đọc được truyện này là bạn sẵn sàng cho Chặng 1.","chapters":[{"n":1,"title":"The Station","vi":"Trạm","en":["Hải is twenty-eight years old.","He works at a small station.","The station is on a hill.","The sea is below the hill.","There is a big dish outside.","The dish listens to the sky.","Hải works at night.","He starts work at ten.","He goes home at six.","The building is old and cold.","He likes the quiet.","He does not have many friends here.","That is fine.","He came here five years ago.","He never reports anything.","Nothing happens at this station."],"vi_":["Hải hai mươi tám tuổi.","Anh làm việc ở một trạm nhỏ.","Trạm nằm trên một ngọn đồi.","Biển ở phía dưới ngọn đồi.","Bên ngoài có một cái chảo lớn.","Cái chảo lắng nghe bầu trời.","Hải làm ca đêm.","Anh bắt đầu làm lúc mười giờ.","Anh về nhà lúc sáu giờ.","Toà nhà cũ và lạnh.","Anh thích sự yên tĩnh.","Anh không có nhiều bạn ở đây.","Vậy cũng được.","Anh đến đây năm năm trước.","Anh chưa bao giờ báo cáo điều gì.","Không có gì xảy ra ở trạm này."]},{"n":2,"title":"A Normal Night","vi":"Một đêm bình thường","en":["It is March.","The night is warm.","Hải makes tea.","He sits at the table.","He looks at the screen.","The line on the screen is flat.","It is always flat.","He opens his book.","He writes the time.","He writes the weather.","He writes: nothing unusual.","He does this every night.","He has done this for five years.","Outside, the sea is very quiet.","He can hear the wind.","It is ten past one."],"vi_":["Bây giờ là tháng Ba.","Đêm ấm.","Hải pha trà.","Anh ngồi vào bàn.","Anh nhìn màn hình.","Đường kẻ trên màn hình phẳng lì.","Nó lúc nào cũng phẳng.","Anh mở cuốn sổ ra.","Anh ghi giờ.","Anh ghi thời tiết.","Anh ghi: không có gì bất thường.","Anh làm việc này mỗi đêm.","Anh đã làm vậy năm năm rồi.","Bên ngoài, biển rất yên.","Anh nghe được tiếng gió.","Bây giờ là một giờ mười."]},{"n":3,"title":"The Sound","vi":"Âm thanh","en":["The line moves.","Hải stops.","He looks again.","The line moves again.","It goes up and down.","Three short. Then one long.","Then it stops.","Then it starts again.","Three short. Then one long.","Hải does not move for a long time.","He turns the sound on.","He can hear it now.","It is like a finger on a table.","Three taps. Then one long press.","His tea is cold.","He does not drink it."],"vi_":["Đường kẻ động đậy.","Hải dừng lại.","Anh nhìn lần nữa.","Đường kẻ lại động.","Nó lên rồi xuống.","Ba nhịp ngắn. Rồi một nhịp dài.","Rồi nó dừng.","Rồi nó bắt đầu lại.","Ba ngắn. Rồi một dài.","Hải không nhúc nhích rất lâu.","Anh bật tiếng lên.","Giờ anh nghe được nó.","Nó như ngón tay gõ lên mặt bàn.","Ba tiếng gõ. Rồi một tiếng nhấn dài.","Trà của anh nguội rồi.","Anh không uống."]},{"n":4,"title":"The Machines Are Fine","vi":"Máy móc vẫn tốt","en":["Hải checks the machines.","He checks every cable.","The cables are fine.","He checks the fan.","The fan is fine.","He turns the heater off.","The sound does not stop.","He turns the heater on again.","Nothing changes.","He goes outside.","The dish is quiet.","The sea is quiet.","He comes back in.","The sound is still there.","Three short. One long.","It is four in the morning."],"vi_":["Hải kiểm tra máy móc.","Anh kiểm tra từng sợi dây.","Các sợi dây đều tốt.","Anh kiểm tra cái quạt.","Quạt vẫn tốt.","Anh tắt lò sưởi.","Âm thanh không dừng.","Anh bật lò sưởi lại.","Không có gì thay đổi.","Anh đi ra ngoài.","Cái chảo im lìm.","Biển im lìm.","Anh quay vào trong.","Âm thanh vẫn còn đó.","Ba ngắn. Một dài.","Bây giờ là bốn giờ sáng."]},{"n":5,"title":"He Writes It Down","vi":"Anh ghi lại","en":["Hải opens his book again.","He looks at the empty line.","He does not know what to write.","Then he writes four words.","Three short, one long.","He writes the time.","He writes: repeating.","He writes: source unclear.","He looks at the words.","They look strange on the page.","But they are true.","He closes the book.","The sun comes up.","The sound is still there.","He goes home.","He does not sleep."],"vi_":["Hải mở cuốn sổ ra lần nữa.","Anh nhìn dòng trống.","Anh không biết viết gì.","Rồi anh viết bốn chữ.","Ba ngắn, một dài.","Anh ghi giờ.","Anh ghi: lặp lại.","Anh ghi: chưa rõ nguồn.","Anh nhìn những chữ đó.","Chúng trông lạ trên trang giấy.","Nhưng chúng là sự thật.","Anh đóng sổ lại.","Mặt trời lên.","Âm thanh vẫn còn đó.","Anh về nhà.","Anh không ngủ."]},{"n":6,"title":"The Report","vi":"Bản báo cáo","en":["Hải writes a report.","It is one page.","He sends it on Monday.","Then he waits.","One week passes.","Nobody answers.","Two weeks pass.","He works every night.","The sound comes and goes.","Some nights it is there.","Some nights it is not.","He writes it down every time.","His book is full of the same words.","Three short, one long.","He starts to think he is wrong.","But the sound is real."],"vi_":["Hải viết một bản báo cáo.","Nó dài một trang.","Anh gửi đi vào thứ Hai.","Rồi anh đợi.","Một tuần trôi qua.","Không ai trả lời.","Hai tuần trôi qua.","Anh làm việc mỗi đêm.","Âm thanh khi có khi không.","Có đêm nó ở đó.","Có đêm thì không.","Lần nào anh cũng ghi lại.","Cuốn sổ của anh đầy những chữ giống nhau.","Ba ngắn, một dài.","Anh bắt đầu nghĩ mình sai.","Nhưng âm thanh là có thật."]},{"n":7,"title":"The Car","vi":"Chiếc xe","en":["On a Tuesday, a car comes.","The car is very clean.","Two men get out.","They are polite.","They ask many questions.","They look at his book.","They read every page.","One man writes something down.","They take the book with them.","They take his report too.","They say thank you.","They say: this is equipment noise.","They say: do not report it again.","Then they leave.","Hải stands outside for a long time.","He watches the car go."],"vi_":["Vào một ngày thứ Ba, có một chiếc xe tới.","Chiếc xe rất sạch.","Hai người đàn ông bước xuống.","Họ lịch sự.","Họ hỏi nhiều câu.","Họ xem cuốn sổ của anh.","Họ đọc từng trang.","Một người ghi gì đó lại.","Họ mang cuốn sổ đi.","Họ mang cả bản báo cáo đi.","Họ nói cảm ơn.","Họ nói: đây là tiếng thiết bị.","Họ nói: đừng báo cáo nữa.","Rồi họ đi.","Hải đứng ngoài rất lâu.","Anh nhìn theo chiếc xe."]},{"n":8,"title":"The New Rule","vi":"Quy định mới","en":["Now there is a list at the station.","The list has normal things on it.","Rain is on the list.","Birds are on the list.","Bad cables are on the list.","Now the sound is on the list too.","Things on the list are not unusual.","So nobody has to write them down.","The new man does not write it down.","The next man does not write it down.","For them, it is just noise.","They never listen to it.","Hải understands the rule now.","It is a good rule.","It is also a wall.","He can see both things at once."],"vi_":["Bây giờ ở trạm có một danh mục.","Danh mục ghi những thứ bình thường.","Mưa nằm trong danh mục.","Chim nằm trong danh mục.","Dây hỏng nằm trong danh mục.","Giờ âm thanh cũng nằm trong danh mục.","Thứ nằm trong danh mục thì không bất thường.","Nên không ai phải ghi lại.","Người mới không ghi lại.","Người tiếp theo cũng không ghi.","Với họ, đó chỉ là tiếng ồn.","Họ không bao giờ nghe nó.","Giờ Hải hiểu quy định đó.","Nó là một quy định tốt.","Nó cũng là một bức tường.","Anh nhìn thấy cả hai điều cùng lúc."]},{"n":9,"title":"The Secret","vi":"Bí mật","en":["Hải still hears the sound.","He still wants to write it down.","But he cannot.","So he finds a way.","He writes the times backwards.","One fifteen becomes five one one.","It looks like a weather note.","Nobody asks about it.","He does this every time.","Year after year.","The numbers fill his books.","They look like nothing.","They are not nothing.","He does not tell anybody.","He does not tell his wife.","It is his alone."],"vi_":["Hải vẫn nghe thấy âm thanh.","Anh vẫn muốn ghi nó lại.","Nhưng anh không được phép.","Nên anh tìm ra một cách.","Anh viết ngược các con giờ.","Một giờ mười lăm thành năm một một.","Nó trông như một ghi chú thời tiết.","Không ai hỏi về nó.","Lần nào anh cũng làm vậy.","Năm này qua năm khác.","Những con số lấp đầy các cuốn sổ.","Chúng trông chẳng có gì.","Chúng không phải chẳng có gì.","Anh không kể với ai.","Anh không kể với vợ.","Đó là chuyện của riêng anh."]},{"n":10,"title":"Fifteen Years","vi":"Mười lăm năm","en":["Time passes.","Hải is thirty-five.","Then he is forty.","His hair goes grey.","His writing gets smaller.","The station gets older.","New people come and go.","Nobody stays long.","He never stops writing the numbers.","Not one night.","Fifteen years is a long time.","Some nights he asks himself why.","He does not have a good answer.","But he keeps writing.","The books fill the shelf.","Nobody opens them."],"vi_":["Thời gian trôi qua.","Hải ba mươi lăm tuổi.","Rồi anh bốn mươi.","Tóc anh bạc đi.","Chữ anh viết nhỏ dần.","Trạm ngày càng cũ.","Người mới đến rồi đi.","Không ai ở lâu.","Anh không bao giờ ngừng ghi những con số.","Không một đêm nào.","Mười lăm năm là quãng thời gian dài.","Có đêm anh tự hỏi để làm gì.","Anh không có câu trả lời hay.","Nhưng anh vẫn ghi.","Những cuốn sổ chất đầy kệ.","Không ai mở chúng ra."]},{"n":11,"title":"The Last Page","vi":"Trang cuối","en":["In 1994 Hải leaves the station.","He is forty-three years old.","He is tired.","On his last night he writes one more time.","He writes the numbers backwards.","Then he writes something else.","It is not about the weather.","He writes: someone has to keep the numbers.","He writes: I will be too old.","He writes: that is all right.","Then he closes the book.","He puts it on the shelf.","He turns off the light.","He walks down the hill.","He does not look back.","He never talks about it again."],"vi_":["Năm 1994 Hải rời trạm.","Anh bốn mươi ba tuổi.","Anh mệt rồi.","Đêm cuối cùng anh ghi thêm một lần nữa.","Anh viết ngược các con số.","Rồi anh viết một thứ khác.","Nó không nói về thời tiết.","Anh viết: phải có ai đó giữ những con số.","Anh viết: tôi sẽ quá già.","Anh viết: vậy cũng được.","Rồi anh đóng cuốn sổ lại.","Anh đặt nó lên kệ.","Anh tắt đèn.","Anh đi xuống đồi.","Anh không nhìn lại.","Anh không bao giờ nhắc lại chuyện đó nữa."]},{"n":12,"title":"Many Years Later","vi":"Nhiều năm sau","en":["The books stay on the shelf.","Dust covers them.","Twenty years pass.","One night a young woman works alone.","Her name is Mai.","She hears a sound on the screen.","Three short. One long.","She checks the cables.","She checks the fan.","She does not know about Hải.","She does not know about the list.","She only knows the sound is there.","So she opens her book.","She writes the time.","And the story starts again.","This time it does not stop."],"vi_":["Những cuốn sổ nằm yên trên kệ.","Bụi phủ lên chúng.","Hai mươi năm trôi qua.","Một đêm nọ có một cô gái trẻ trực một mình.","Cô tên Mai.","Cô nghe một âm thanh trên màn hình.","Ba ngắn. Một dài.","Cô kiểm tra dây.","Cô kiểm tra quạt.","Cô không biết gì về Hải.","Cô không biết gì về danh mục.","Cô chỉ biết âm thanh đang ở đó.","Nên cô mở cuốn sổ ra.","Cô ghi giờ.","Và câu chuyện bắt đầu lại.","Lần này nó không dừng nữa."]}]},"sb":{"title":"The Slow Message","vi":"Bức thông điệp chậm","blurb":"Một trạm thu tín hiệu nhỏ trên bờ biển. Một chuỗi xung lặp lại suốt bốn mươi năm. Và một câu hỏi không ai dám hỏi to: nếu bức thông điệp không khó, mà chỉ là chúng ta đọc sai thì sao?","chapters":[{"n":1,"week":1,"title":"The Dish on the Hill","vi":"Cái chảo trên đồi","note":"Chương này dùng lại động từ hành động và giác quan của tuần 1.","text":["The station sat on a low hill above the water, and at night it was the only light for eleven kilometres. Mai came on shift at ten. She always walked the last part of the road instead of taking the truck, because the truck woke the dogs in the village and she felt bad about it.","Inside, the air was damp. It was always damp. The old building had been built in a hurry sixty years ago, and the sea had been working on it patiently ever since. Mai hung her jacket on the hook, glanced at the log book, and sat down.","The dish outside was nine metres wide. It had a name once, painted on the rim, but the salt had eaten most of the letters and now it just said HE ON, which the night staff found funny for about a year and then stopped noticing.","Her job was simple. She watched the screens. She wrote down anything unusual. At six in the morning she went home.","For four months nothing unusual had happened, and Mai had been grateful for that. She was twenty-six. She had come here because the job was quiet and because her mother was two villages away and getting older. People assumed she was bored. She was not bored. She liked the sound the building made in the wind.","At two in the morning, she stood up to stretch, and the screen changed.","It was not dramatic. There was no alarm, no red light. A thin line on the display, which had been flat for weeks, lifted gently and came back down. Then it did it again. Then again.","Mai stared at it. She did not move for a long time.","The line was rising and falling in a pattern. Three short lifts, a pause, one long lift. Three short, a pause, one long. It was so regular that her first thought was that something in the building was broken — a loose cable, a bad fan, the old heater switching itself on and off.","She checked the cable. She checked the fan. She stood on a chair and checked the heater, and while she was up there she noticed how much dust had gathered on top of it, and she thought, absurdly, that she should clean that.","The pattern kept going.","Mai climbed down, more carefully than she needed to, and sat back at the desk. She opened the log book. In the column marked UNUSUAL she wrote the time, and then she stopped, because she did not know what to write next.","Barely thinking, she reached over and turned the volume up.","The sound that came out was not a voice. It was a soft knocking, like someone tapping a finger on a table in another room. Three taps. A pause. One long press. Three taps. A pause. One long press.","She listened to it for forty minutes without writing anything down.","At ten past three she picked up the phone to call Thảo, and then she put it down again. Thảo would be asleep. Thảo had a child. There was nothing to say yet except a sentence that would sound foolish out loud.","So Mai sat in the damp room with the sea below her and the dish above her, and she listened to the knocking, and she waited for the sun."]},{"n":2,"week":2,"title":"What Thảo Heard","vi":"Điều Thảo đã nghe","note":"Chương này dùng lại từ vựng cảm xúc của tuần 2.","text":["Thảo arrived at six twenty, which was late, and Mai was so relieved to see her that she forgot to be annoyed.","\"You look terrible,\" Thảo said.","\"Listen to this.\"","Thảo put her bag down slowly. She was forty-one and she had worked at the station for nineteen years, which meant she had heard every strange noise the building could make. She was not easily astonished. She sat, put on the headphones, and closed her eyes.","Mai watched her face. For the first minute Thảo looked patient, almost bored. In the second minute she stopped moving. In the third minute she opened her eyes and looked at the wall, and Mai saw something there that frightened her, because it was not curiosity.","It was recognition.","\"How long has it been doing this?\" Thảo asked.","\"Since two.\"","\"No.\" Thảo took the headphones off. \"How long, Mai.\"","\"I don't understand the question.\"","Thảo stood up, went to the shelf where nobody went, and pulled down a log book so old that the cover had gone soft. She turned the pages without looking at them, the way you turn to a page you have turned to many times before, and she put the book on the desk in front of Mai.","The handwriting was small and confident. The date was March, forty years ago. In the column marked UNUSUAL someone had written: *three short, one long. Repeating. Source unclear.* And under it, in the same hand, a single line: *Reported. Told not to report again.*","Mai felt the room get very quiet.","\"It comes back,\" Thảo said. \"Every few years. Sometimes it runs for one night. Once it ran for eleven days.\" She sat down heavily. \"I was twenty-three the first time I heard it. I was so thrilled I called everyone. My supervisor came in on a Sunday. He was very kind to me and he explained that it was equipment noise, and he was so calm and so certain that I felt ashamed of myself for about six years.\"","\"And then?\"","\"And then I heard it again, and I was not ashamed any more. I was angry.\" Thảo laughed without any humour in it. \"That was worse. Being angry at something you cannot prove is a bad way to spend your thirties.\"","Mai looked at the old book, and at the new one, and at the two lines of handwriting forty years apart saying the same thing.","\"What do we do?\"","\"You go home and sleep.\"","\"Thảo.\"","\"I'm serious. You have been awake for twenty hours and you are about to make a decision.\" Thảo's voice was gentle now, and somehow that was more alarming than the rest of it. \"I made that decision when I was your age. I want you to make it when you are rested.\"","Mai got her jacket. At the door she stopped.","\"Are you afraid of it?\"","Thảo considered the question honestly, which was one of the things Mai liked most about her.","\"No,\" she said at last. \"I'm afraid of what happens if it stops.\""]},{"n":3,"week":3,"title":"The Rules of the Station","vi":"Nội quy của trạm","note":"Chương này dùng lại các cụm từ cố định của tuần 3.","text":["Mai did not sleep. She lay in her room above her aunt's shop and listened to the fan and thought about it more or less continuously until four in the afternoon, at which point she gave up, got dressed, and went back early.","By the time she arrived, Thảo had already printed forty pages of signal data and covered the desk with them.","\"You didn't sleep either,\" Mai said.","\"Not a minute. Sit down. I want to show you something, and I want you to tell me I'm wrong.\"","In spite of everything, Mai smiled. This was how Thảo taught. She never explained; she handed you the pieces and made you assemble them yourself, and by the time you understood it you believed it was your own idea.","\"Three short, one long,\" Thảo said. \"That's the unit. We've always treated it as one unit repeating. As a matter of fact, that's what everyone wrote down for forty years — repeating, repeating, repeating. Nobody bothered to check whether the gaps between the units are the same.\"","\"And they're not.\"","\"They are not.\" Thảo pushed a page across. \"Sometimes the gap is short. Sometimes it's about twice as long. Now and then it's roughly four times. Look.\"","Mai looked. She took her time. Little by little, the numbers on the page stopped being noise and started being something else.","\"That's information,\" she said quietly.","\"That's what I think. The three-short-one-long isn't the message. It's the sound the message is written in. In other words, it's the pen, not the writing. We have been listening to a pen for forty years.\"","Mai sat back. She felt slightly sick, and at the same time more awake than she had been in months.","\"Why did nobody notice?\"","\"Because of the rules.\" Thảo took off her glasses and rubbed her eyes. \"You have to keep in mind how this place works. Rule one: report anything unusual. Rule two: unusual means anything not on the list. And the signal has been on the list since 1986. Somebody wrote it down as equipment noise once, and after that it wasn't unusual any more. It was normal. Nobody looks at normal.\"","\"That's — \" Mai searched for a word and could not find one that was strong enough.","\"Yes. It is.\" Thảo put her glasses back on. \"To be honest, it is also completely understandable. Every station has a list. Without the list you would spend all day chasing birds and rain and bad cables. The list is what makes the work possible. It is also what makes you blind. You don't get one without the other.\"","Outside, the light was going. Mai could hear the dogs starting up in the village, which meant somebody was walking the road.","\"So what now?\"","\"Now, sooner or later, we have to make up our minds.\" Thảo gathered the pages into a stack and squared the edges carefully. \"Because as soon as we write this down properly, it stops being ours. And I have spent nineteen years watching what this building does to things that stop being ours.\""]},{"n":4,"week":4,"title":"The Man from the Ministry","vi":"Người từ Bộ","note":"Chương này dùng lại phrasal verbs của tuần 4.","text":["They wrote it down. It took four days, and on the fifth day a man turned up.","He arrived at eleven in the morning in a car that was too clean for the road, and he came in without knocking and looked around the room the way people look around a place they have already decided about. He was perhaps fifty. He had a good coat and a tired face.","\"Which of you is Nguyễn Thị Mai?\"","\"That's me.\"","\"Right.\" He sat down in Thảo's chair without asking. \"My name is Đức. I've come to sort this out.\"","\"To sort what out?\"","\"Your report.\" He took a folder out of his bag and put it on the desk but did not open it. \"I want to say first that it's a good piece of work. Genuinely. Most people would not have picked up on the gaps. I read it twice.\"","Mai glanced at Thảo. Thảo was standing very still by the window with her arms folded.","\"Thank you,\" Mai said carefully.","\"I'm going to explain something, and then I'm going to ask you to do something, and I would rather do both honestly than waste your afternoon.\" Đức rubbed his forehead. \"The signal is real. We have known it is real since 1979. It does not come from equipment. It does not come from any satellite we can account for. Nobody has ever worked out where it comes from.\"","The room was quiet. Somewhere below, the sea carried on.","\"Then why — \" Mai began.","\"Why was it written down as noise?\" He nodded, as though he had been waiting for this and had answered it many times. \"Because in 1979 a very serious man in a very serious office was asked what to do about a signal we could not explain, and he decided the honest answer would frighten people and get nobody anywhere. So he made it boring. He put it on the list. And it turned out he was right, in a way. Forty years went by. Nothing bad happened. The country carried on.\"","\"That's not a reason. That's an excuse.\"","\"Yes,\" Đức said. \"It is both. Most things are.\"","Thảo spoke for the first time. \"What do you want from her?\"","He turned in the chair. \"I want to hand this over to her. Properly. Funding, equipment, two more staff.\" He looked back at Mai. \"The people who set this up have all retired or died. I'm the last one who knows the whole thing, and I'm not well, and I have put off this conversation for three years because I couldn't find anyone I trusted with it.\"","Mai found that she had stood up without deciding to.","\"Why me?\"","\"Because you didn't call a newspaper,\" Đức said. \"And because you noticed something that four hundred people looked straight at and never saw.\" He finally opened the folder. Inside were forty years of data, page after page, in six different kinds of handwriting. \"I'm not going to pretend this is a gift. Once you take this on, you will not be able to give it back. I gave twenty years to it and I never got over it. You should think it over.\"","\"How long do I have?\"","Đức looked out of the window at the dish on the hill, rusting quietly in the salt air, doing what it had done every day since before any of them were born.","\"Longer than it has,\" he said."]},{"n":5,"week":5,"title":"The First Wrong Answer","vi":"Đáp án sai đầu tiên","note":"Chương này dùng lại động từ tư duy và giao tiếp của tuần 5.","text":["She took it. Of course she took it. She spent one night pretending to consider it, out of respect for the size of the thing, and in the morning she called Đức and said yes, and he did not sound surprised, which annoyed her slightly.","The first six weeks were the happiest she had been in years, and she would remember that later with some bitterness, because she had assumed that the happiness came from the work. It did not. It came from not yet having failed.","They built the model in October. It was Thảo's idea and Mai's arithmetic, and by the end of it they had a wall covered in paper and a theory they both believed.","The theory was this. The gaps between the units were not random; they came in four lengths. Four lengths meant four symbols. Four symbols was not many — but four was exactly the number you would choose if you wanted to be understood by someone who did not share your alphabet, your body, or your sky. Four was what you would use to write a number in base four. And numbers, Mai argued, were the only thing two strangers could be certain of sharing.","\"You're assuming they think the way we think,\" Thảo said.","\"I'm assuming they can count.\"","\"That's a bigger assumption than it sounds.\"","But Thảo did not really object, because the numbers came out beautifully. Reading the gaps in base four gave them a sequence, and the sequence was not noise: it climbed, paused, climbed again, and returned. Mai plotted it and the shape on the paper was a clean curve, the kind of curve that does not happen by accident.","She remembers the exact moment. Half past four in the morning, the heater ticking, Thảo asleep in the chair with her mouth open. Mai looked at the curve and understood, with a certainty that felt physical, that she was the first person in the history of the world to see it.","She woke Thảo up. Thảo looked at the paper for a long time and then said, quietly, \"Oh.\"","They reported it in November. Đức drove down himself. He read the pages twice, slowly, and then he took off his glasses and rubbed his eyes in a way that Mai would come to recognise as bad news arriving.","\"It's a good piece of work,\" he said.","\"But.\"","\"But I have seen this curve before.\" He reached into his bag and took out a folder, soft with age. \"1991. A team in the north. Same method, near enough. They got the same curve and they were as certain as you are.\"","Mai refused to understand him. \"Then it's confirmed. Two independent teams —\"","\"It's confirmed that the method produces the curve.\" Đức put the folder on the desk. \"The curve is in the method, Mai. If you read random gaps in base four and plot them like that, you get something very close to this about one time in nine. They discovered that in 1994. It broke two careers and one marriage.\"","The room was extremely quiet. Outside, a bird was doing something ordinary.","\"You could have warned me,\" Mai said.","\"I could have.\" He admitted it without defending himself, which somehow made it worse. \"I decided not to. I wanted to see what you would do with a clean run at it, and I wanted you to have the six weeks. I'm not going to pretend that was kind.\"","Thảo had not said anything at all. She was standing at the window with her back to them, and when she finally spoke her voice was perfectly level.","\"How many teams,\" she said. \"Since 1979. How many teams have got this far and been told this?\"","Đức did not answer immediately, and the silence went on long enough that Mai realised he was deciding whether to lie.","\"Nine,\" he said."]},{"n":6,"week":6,"title":"What Happened in 1979","vi":"Chuyện đã xảy ra năm 1979","note":"Chương này dùng lại từ chỉ thời gian và trình tự của tuần 6.","text":["Afterwards, Mai did not work for eleven days. She told her mother it was a holiday. Her mother, who had raised three children and buried a husband and could hear a lie through a wall, said that sounded nice and made her soup every evening and did not ask a single question, and by the ninth day Mai was talking.","On the twelfth day she went back and started reading history instead of data.","The station had been built in 1962 for reasons that had nothing to do with any of this. By 1979 it was already old. The man on duty that March was called Trần Văn Hải; he was twenty-eight; he had been at the station for five years and had never reported anything.","He heard the signal at ten past one in the morning. He wrote it down. Meanwhile, four hundred kilometres away, a second station heard the same thing eleven minutes later, which was itself the strangest detail in the whole file, and nobody had ever explained it.","Hải reported it. Two weeks passed. Then a car came, much like the car that had brought Đức, and the men in it were polite and thorough and they took every page he had written.","Ever since that week, the signal had been on the list.","Hải stayed at the station until 1994. Mai found his handwriting all through the log books, fifteen years of it, and she read those books the way other people read novels. By 1983 the handwriting had got smaller. By 1987 he had begun writing the signal down anyway, in the ordinary column, disguised among the weather notes, in a private code that took Mai two days to break and turned out to be nothing cleverer than writing the times backwards.","He had never stopped recording it. Not once, in fifteen years.","In the last book, on a page dated shortly before he left, he had written a sentence that was not about weather.","*By the time anyone believes this, I will be too old to be the one who says it. That is all right. Someone has to keep the numbers.*","Mai sat with that for a long while.","She had assumed, until then, that the story was about a signal. It occurred to her now that the story might be about the people. Nine teams. Nine curves. Nine folders in Đức's bag, each one somebody's best year.","Eventually she went to find Thảo, who was outside checking the cable runs in the rain because Thảo dealt with bad weeks by fixing things.","\"I want to ask you something and I want the true answer.\"","\"Go on.\"","\"Did you know about the nine teams?\"","Thảo straightened up. Water was running off the end of her nose. \"I knew about four of them.\"","\"And you let me spend six weeks —\"","\"Yes.\" No excuse, no softening. \"Because every one of those teams found something the others missed, and it's all sitting in a folder that nobody will ever read. And because I have watched this thing take pieces out of people for nineteen years, and I decided a long time ago that I would rather it took a piece out of you while I was standing next to you than ten years from now when you were somewhere else.\"","Mai stood in the rain and hated her for about four seconds.","\"Right,\" she said at last. \"Then I want the other eight folders.\"","Thảo's face did something complicated. \"That's what I've been waiting for you to say since November.\""]},{"n":7,"week":7,"title":"Two Theories","vi":"Hai giả thuyết","note":"Chương này dùng lại từ nối câu và trạng từ của tuần 7.","text":["The folders arrived in February, and they argued about them until April.","The argument was not unfriendly, although it went on so long that they developed rules for it: no working after midnight, no bringing it home, and no saying the words obviously or clearly, since neither of them had earned those words yet.","Thảo's position was that the signal was a beacon. Not a message at all — a marker, like a lighthouse, saying only *here* and *still here* and nothing else. Beacons do not need grammar. A lighthouse that tried to explain itself would be a worse lighthouse. And whereas a message would presumably stop once it had been received, this had run for at least forty-seven years without any sign of caring whether anyone was listening.","Mai's position was that it was a message, and that the reason nobody had read it was that everybody, including her, had been looking for the wrong kind of writing.","\"Every team went straight for numbers,\" she said. \"Nine teams, nine times, numbers. Since we all did the same thing and we all failed, arguably the problem is the thing we all did.\"","\"Or the problem is that it isn't writing.\"","\"Unless it's writing that doesn't work like ours.\"","They went round this for weeks. Nevertheless, something useful came out of it, which is usually what happens when two people who respect each other disagree for long enough.","It was Thảo who noticed it, in March, while she was arguing for the opposite conclusion.","\"Look, even though the gaps vary, the units themselves never do. Three short, one long. Forty-seven years. Not once has anyone recorded four short, or two long, or anything else. That's my whole point — a message would use its alphabet. This uses one letter.\"","Mai was already reaching for the paper.","\"Say that again.\"","\"A message would use its alphabet.\"","\"No. The other part. Not once.\"","Thảo stopped. \"Not once.\"","\"In forty-seven years, out of — \" Mai was writing fast now — \"something like eleven million units, not one is malformed. Nothing is ever corrupted. No dropouts. No noise.\"","\"So it's clean.\"","\"It's *too* clean.\" She turned the page round. \"Thảo, we're four hundred kilometres from the other station and they hear it eleven minutes later. Nothing in the sky arrives eleven minutes apart at two points on the same planet. Nothing. I've been treating that as a mystery for a year because it's in the file and everything in the file is a mystery. But it isn't a mystery. It's a fact, and it's incompatible with every single thing we have both assumed.\"","The heater ticked. Outside, the dish stood in the dark doing nothing whatsoever, as it had done for as long as either of them had been alive.","\"You're going to say something now,\" Thảo said slowly, \"and I would like a moment to prepare for it.\"","\"It isn't coming from the sky.\"","\"Right.\" Thảo sat down. \"Yes. I thought that might be it.\""]},{"n":8,"week":8,"title":"The New People","vi":"Những người mới","note":"Chương này dùng lại từ vựng mô tả người của tuần 8.","text":["The funding came through in May, which meant staff, which meant the end of a way of working that Mai had not known she loved until she lost it.","There were three of them. Linh was twenty-four, thin, quick, and so obviously clever that she made everyone else in a room slightly nervous for the first hour and then stopped, because she was also generous with what she knew, which is the rarest thing in a clever person. She had left a much better job to come here and she refused to explain why.","Bảo was sixty-one and had spent his whole career on ships. He had a heavy, patient face and hands that had clearly repaired things underwater. He said perhaps forty words a day. He noticed everything. Within a fortnight the station's equipment worked better than it had in a decade and nobody could remember him being asked to do it.","And then there was Hùng.","Hùng was thirty-five, well dressed, and had a reputation that arrived a week before he did. He had published widely. He was, by any reasonable measure, the most qualified person who had ever set foot in the building, and he never once let the room forget it.","\"He isn't stupid,\" Thảo said, after the first month. \"That's the difficulty. If he were stupid this would be easy.\"","He was not stupid. He was arrogant in a specific and exhausting way: he treated every question as a test of the person asking it. When Mai explained the eleven-minute problem, he listened with his head slightly tilted and then said, \"That's an instrumentation error,\" in the tone of a man closing a door.","\"It's been reproduced four times by three teams.\"","\"Then it's been reproduced wrong four times.\" He smiled pleasantly. \"I don't say that to be rude. Most anomalies are boring once you find the loose cable.\"","The trouble was that he was often right. That was the part nobody had warned her about. His manner was insufferable and his instincts were excellent, and over the summer he found three genuine errors in the old data, one of which had been sitting there since 1991 and had cost a team in the north two years.","Mai, who was not a naturally patient person, discovered that she was going to have to become one.","The moment that changed things came in August, on an ordinary Tuesday, and it was Bảo who caused it without meaning to.","They had been arguing about the eleven minutes again — Hùng standing, gesturing, Linh half-convinced, Thảo stubborn — when Bảo, who had been rewiring something in the corner and had not spoken since morning, said:","\"Eleven minutes is about right for the mud.\"","Everyone turned round.","\"Say that again,\" Mai said, for the second time in her life, in exactly the same voice.","Bảo put down his tools. He looked mildly embarrassed to have the attention.","\"Sound in seabed sediment,\" he said. \"Soft mud, that stretch of shelf. Four hundred kilometres, give or take.\" He shrugged one shoulder. \"Eleven minutes is about right. I used to work on the survey boats. We measured it all the time.\"","Nobody said anything for several seconds.","Then Hùng, to his very great credit, sat down slowly and said, \"Oh, I've been an idiot,\" and from that afternoon onward Mai found she could work with him perfectly well."]},{"n":9,"week":9,"title":"The Shape of the Argument","vi":"Hình dạng của lập luận","note":"Chương này dùng lại từ vựng phân tích và đánh giá của tuần 9.","text":["They had until March to write it up, and Hùng, who turned out to be a far better colleague than he was a first impression, insisted on treating the paper as though it would be read by people who wanted it to be wrong.","\"That is the only useful way to write anything,\" he said. \"Assume a hostile reader. If it survives them, it will survive everyone else.\"","So they wrote it four times.","The first draft was, in Linh's word, embarrassing. It was not inaccurate; it was simply arranged in the order in which they had discovered things, which is almost never the order in which things should be explained. The most significant claim sat on page nine. The eleven-minute lag, which was the crucial fact, was buried in a table.","\"The structure is the argument,\" Hùng said, moving pages around on the floor. \"If a reader has to hold six things in their head before the seventh one makes sense, you have not written a paper. You have written a puzzle.\"","Mai found this obvious once he said it and impossible to have seen on her own, which she was beginning to understand is what a good colleague is for.","The final version made one claim and defended it. The claim was that the source of the signal lay in the seabed sediment of the continental shelf, at a depth and position that could be estimated from the arrival times at the two stations. Everything else in the paper existed to support that sentence or to demonstrate why the alternatives failed.","The alternatives were the difficult part. Forty-seven years of assumptions had to be dismantled politely.","Thảo wrote that section, and it was the best writing any of them produced. She did not undermine the earlier teams. She did the opposite: she showed, team by team, that each had been reasonable given what they knew, and that the error was not individual but structural. Nine groups of intelligent people had reached the same wrong place because they had all started from the same unexamined assumption — that a signal must come from above.","\"That's not a criticism of them,\" she wrote. \"It is an illustration of how a field acquires a blind spot, and of how long a blind spot can last once it has been written into a list.\"","Đức read the draft in February and telephoned at eleven at night, which he had never done.","\"Take out the word probably on page four.\"","\"It's a hedge. We can't prove —\"","\"You have four independent measurements and a physical mechanism. If you hedge, every reader will assume you are hedging because you are unsure, and they will be less certain than the evidence warrants.\" A pause. \"I have watched careful people lose arguments they had already won, Mai. Say the thing.\"","She took out probably.","The paper went out in March. The response was not dramatic — nothing in this story was ever dramatic — but by June four other stations had gone back through their own archives, and three of them found the signal sitting in their records, logged for decades as noise.","It was the fourth that mattered. A small station eight hundred kilometres south had a recording from 1974, five years earlier than anything else, and the interval pattern in it was subtly different.","Linh found it, at two in the morning, and she did not shout. She came and stood in the doorway of the room where Mai was working and waited to be noticed, which somehow made it worse.","\"The gaps in 1974,\" she said. \"They're shorter.\"","\"Shorter how?\"","\"Shorter than 1979. Which are shorter than 1991. Which are shorter than last week.\" Linh put the pages down very carefully, as though they might go off. \"It isn't a fixed pattern, Mai. It never was. It's been changing the whole time, so slowly that nobody who only had a few years of it could possibly have seen it.\"","Mai looked at the numbers for a long moment and felt the floor of the last two years quietly rearrange itself.","\"It's slowing down,\" she said."]},{"n":10,"week":10,"title":"Reasons to Dig","vi":"Những lý do để đào","note":"Chương này dùng lại từ nối ý và danh từ trừu tượng của tuần 10.","text":["The proposal took nine months and was refused twice.","The first refusal was about money, which was honest and therefore easy to argue with. The second was about something else, and it took Mai a while to understand what.","\"They are not worried about the cost,\" Đức said. \"They are worried about the conclusion.\"","\"We haven't drawn a conclusion. That's the point of going and looking.\"","\"Yes. However, they have read your paper, and they can see where it goes.\" He was thinner that year, and he sat down more often than he used to. \"If the source is in the sediment, then either somebody put it there, or something grew there. Both of those answers have consequences, and consequences require decisions, and a decision made badly in public is a career-ending event. Whereas doing nothing has never ended anyone's career in the history of this country.\"","\"That's a terrible argument.\"","\"It is not an argument at all. It is an incentive. They are much harder to defeat.\"","The case they finally built had three parts, and Linh, who understood committees far better than anyone her age should have, arranged them in order of increasing discomfort.","First, the evidence. Forty-seven years of continuous recording from eleven stations, a physical mechanism, a location accurate to within about two kilometres, and a slowing rate that had now been confirmed independently. Nobody disputed any of it.","Second, the cost of being wrong. If they went and found nothing, the loss was one survey vessel for three weeks. Moreover, the same vessel would produce sediment data that four other projects wanted anyway. In other words, the downside was small and partly useful.","Third — and this was the part Mai had wanted to leave out, and Linh had insisted on — the deadline.","Because the signal was slowing, and if you extrapolated the curve, it stopped.","Not soon. The best estimate was somewhere between forty and ninety years, with an uncertainty that Hùng described as \"embarrassing but honest\". Nevertheless, it stopped. For the first time in the whole history of the thing, there was a reason to hurry that was not merely curiosity.","\"You are aware,\" said one of the committee members, a polite woman who had not spoken for two hours, \"that if you are right about this, and we do nothing, then the record will show that we were told.\"","Nobody in the room answered her, and afterwards Mai thought that the silence had probably been the moment the decision was actually made.","The vessel was approved in November, for the following August, which gave them ten months and one significant obstacle: nobody had ever recovered anything from that depth of soft sediment without destroying it.","Bảo solved it in six weeks with a method he described, when pressed, as \"the way we used to get anchors out of mud\", and which Hùng spent an afternoon converting into four pages of physics that said the same thing.","The night before the ship sailed, Mai could not sleep, and she walked up to the station at two in the morning out of habit.","Thảo was there, of course. Sitting in the dark with the volume up, listening to the knocking, the way she had for twenty-two years.","\"Nervous?\" Thảo said.","\"I keep thinking about the nine teams.\"","\"Good.\" Thảo did not turn round. \"So do I. Every single day.\" She was quiet for a moment. \"Hải died in 2011, by the way. I found out last month. He was in Đà Nẵng, with his daughter, and as far as I can tell he never told anybody about any of this after 1994.\"","Mai sat down beside her, and the two of them listened together until the sky started to go grey."]},{"n":11,"week":11,"title":"What Was Down There","vi":"Thứ nằm dưới đó","note":"Chương này dùng lại các cấu trúc câu để mượn của tuần 11.","text":["It turns out that the most extraordinary day of your life can be extremely boring for the first eleven hours.","They found the position on the second morning. The equipment went down at eleven and came up at half past four, and in between there was nothing whatsoever to do except watch a screen and eat, and by two o'clock Mai had reached a state she had never experienced before, in which she was simultaneously the most frightened she had ever been and profoundly, insultingly bored.","No matter how many times she went over it, she could not make herself believe either possible outcome. Finding nothing seemed impossible. Finding something seemed more impossible.","What came up was a core of grey mud two metres long, and eleven centimetres from the bottom of it there was a band of something that was not mud.","Linh saw it first. She did not say anything at all. She simply put her hand flat on the tube, as though steadying it, and stood there.","The band was about four millimetres thick. Under the lamp it was very slightly darker than the sediment around it, and it had a texture that Bảo, who had handled more seabed than the rest of them combined, said he had never seen.","Under the microscope it was full of structures.","They were small — a tenth of a millimetre, most of them — and they were not crystals, and they were not shells, and as far as anyone on that ship could tell they were not anything that had ever been described. They were built. Each one was a fine hollow column, closed at both ends, and each one was a slightly different length.","\"Tell me the lengths,\" Mai said.","It took Hùng two hours to measure enough of them. When he finally straightened up from the eyepiece he looked, for the first time since she had known him, completely uncertain.","\"There are four,\" he said. \"Four lengths. Nothing in between.\"","Nobody spoke.","\"I want to say something,\" Hùng went on, carefully, \"and I would rather say it now than be quoted later as having thought it privately. I do not think these are alive. I think they were made by something that was alive, and I think that was a very long time ago, and I think we should be extremely careful about every single word we use from this point onwards.\"","\"Why?\" said Linh.","\"Because we are about to name things.\" He took off his glasses. \"And whatever we call these in the next month, the world will still be calling them in a hundred years. If I call them organs, everyone will assume a body. If I call them devices, everyone will assume an engineer. To be honest, I don't know what they are, and I would like the name to admit that.\"","They called them columns, in the end, which nobody was happy with, and which is what they are still called.","The columns did not do anything while they watched. But over the following four days, in a tank on the deck, the ones that had come up intact resonated — faintly, at intervals — and the pattern they made was three short and one long.","It had taken forty-seven years and nine teams and two governments to establish a fact that Mai could now state in eight words, and she wrote it in her notebook that night and looked at it for a long time.","*The signal comes from the mud. It always did.*","And underneath, because she could not help herself:","*Now the hard part.*"]},{"n":12,"week":12,"title":"The Slow Message","vi":"Bức thông điệp chậm","note":"Chương này dùng lại từ vựng về ngôn ngữ và sắc thái của tuần 12.","text":["The translation took three years, and it failed for the first two and a half of them for a reason that Mai would spend the rest of her life describing to students.","They had the alphabet now. Four lengths, four symbols; the columns confirmed it. What they did not have was any idea what the symbols were for, and every attempt to read them produced text that was grammatical and meaningless — which is the most dangerous kind of failure, because it is indistinguishable from success until you look closely.","The first two years produced eleven different translations. Each one was internally consistent. Each one was defensible. Not one of them could be shown to be right, and Hùng, who had become genuinely obsessed, pointed out the problem with a clarity that made everyone miserable.","\"We are not decoding,\" he said. \"We are projecting. Give a person four symbols and enough time and they will find whatever they went looking for. Every one of these eleven readings tells us more about its author than about the columns.\"","The breakthrough came from a question Linh asked at a bad moment, in the middle of an argument, in the tone of someone who has stopped trying to be tactful.","\"Why are we all assuming it's a sentence?\"","\"Because it repeats,\" Mai said. \"Repetition implies —\"","\"Repetition implies nothing. My watch repeats.\" Linh pushed her chair back. \"We have spent three years treating this as literal text with a figurative meaning we have to unlock. What if it's the other way round? What if the content is completely literal and it's the *context* we're missing?\"","Mai stopped.","\"Say that again.\"","Afterwards, everyone remembered where they had been standing.","Here is what they had. A four-symbol system. A repeating unit. And a rate that had been slowing, steadily, for at least fifty years.","Here is what they had assumed: that the slowing was decay. That the thing was winding down like a clock, and the changing intervals were a symptom, not information.","Here is what was true: the intervals *were* the content, and they had been reading the content as though it were noise for the same reason that nine teams had read the signal as equipment error. Because it had gone on
