gap:26px}\n.kb{break-inside:avoid;margin-bottom:16px}\n.kb h4{font-family:'Be Vietnam Pro',sans-serif;font-size:.66rem;letter-spacing:.12em;color:var(--teal2);margin:0 0 6px}\n.key{list-style:none;margin:0;padding:0;font-size:.82rem}\n.key li{display:flex;gap:8px;padding:2px 0}\n.tiny{font-family:'Be Vietnam Pro',sans-serif;font-size:.7rem;color:var(--muted);margin-top:14px}\n\n/* ---------- mục lục trượt ---------- */\n.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70}\n.scrim.show{opacity:1;pointer-events:auto}\n.toc-drawer{position:absolute;inset:0 auto 0 0;width:min(86vw,22rem);z-index:80;background:var(--sheet);\n border-right:1px solid var(--line);transform:translateX(-101%);transition:transform .3s cubic-bezier(.3,.8,.3,1);\n overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 0 40px}\n.toc-drawer.show{transform:none}\n.toc-drawer h4{font-family:'Be Vietnam Pro',sans-serif;font-size:.58rem;letter-spacing:.26em;color:var(--muted);\n margin:0 0 12px;padding:0 18px}\n.toc-drawer ul{list-style:none;margin:0;padding:0}\n.toc-drawer a{display:flex;gap:10px;padding:9px 18px;color:var(--ink);text-decoration:none;cursor:pointer;\n border-left:2px solid transparent;font-family:'Be Vietnam Pro',sans-serif;font-size:.82rem}\n.toc-drawer a.here{background:color-mix(in srgb,var(--teal) 10%,transparent);border-left-color:var(--teal)}\n.nk{font-size:.58rem;color:var(--teal);flex:0 0 3rem;padding-top:.25em}\n\n@media print{\n .bar,.pentools,.toc-drawer,.scrim,.prog,canvas.ink,.exbar{display:none!important}\n #book{display:block;height:auto;overflow:visible}\n .page{height:auto;page-break-after:always;padding:0}\n .sheet{position:static;inset:auto;border:0;padding:0 0 10mm;overflow:visible}\n .pfoot{position:static;border:0}\n input.gap{border-bottom:1px solid #999}\n @page{margin:16mm 14mm}\n}\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n",html:"<div id=\"book\"><section class=\"page cover\" id=\"p0\" data-i=\"0\"><div class=\"sheet\">\n<div class=\"coverpage\">\n  <span class=\"kick\">SỔ TAY NGỮ PHÁP &amp; TỪ VỰNG</span>\n  <h1>ENGLISH<br><em>IN USE</em></h1>\n  <p class=\"sub\">Trình độ B1 → B2 · sáu chủ điểm ngữ pháp lõi<br>\n     <i>Six core grammar areas with topic vocabulary and practice</i></p>\n  <div class=\"cvline\"></div>\n  <p class=\"note\">Viết cho người Việt đi làm · giải thích bằng tiếng Việt, ví dụ bằng tiếng Anh<br>\n     Chạm vào từ tiếng Anh để nghe · viết ghi chú bằng bút Apple Pencil ngay trên trang</p>\n</div></div><canvas class=\"ink\" data-page=\"0\"></canvas><div class=\"pfoot\"><span>Bìa</span><span class=\"pn\">1 / 29</span></div></section><section class=\"page toc\" id=\"p1\" data-i=\"1\"><div class=\"sheet\">\n<h2 class=\"ph\">MỤC LỤC<i>Contents</i></h2>\n<ol class=\"toc\"><li><span class=\"tn\">UNIT 01</span><span class=\"tt\">Thì hiện tại đơn và hiện tại tiếp diễn<i>Present simple & present continuous</i></span></li><li><span class=\"tn\">UNIT 02</span><span class=\"tt\">Quá khứ đơn và hiện tại hoàn thành<i>Past simple & present perfect</i></span></li><li><span class=\"tn\">UNIT 03</span><span class=\"tt\">Các cách nói về tương lai<i>Future forms</i></span></li><li><span class=\"tn\">UNIT 04</span><span class=\"tt\">Động từ khuyết thiếu<i>Modal verbs</i></span></li><li><span class=\"tn\">UNIT 05</span><span class=\"tt\">Câu điều kiện<i>Conditionals</i></span></li><li><span class=\"tn\">UNIT 06</span><span class=\"tt\">Câu bị động và câu tường thuật<i>Passive & reported speech</i></span></li>\n<li><span class=\"tn\">TEST 1</span><span class=\"tt\">Kiểm tra tiến độ<i>Units 1-3</i></span></li>\n<li><span class=\"tn\">TEST 2</span><span class=\"tt\">Kiểm tra tiến độ<i>Units 4-6</i></span></li>\n<li><span class=\"tn\">KEY</span><span class=\"tt\">Đáp án<i>Answer key</i></span></li></ol>\n<div class=\"howto\"><b>Cách dùng sách này</b>\n<p>Mỗi unit có bốn trang: lý thuyết ngữ pháp, bài tập ngữ pháp, từ vựng theo chủ đề, bài tập từ vựng.\nLàm bài trực tiếp trên trang, bấm KIỂM TRA để chấm. Bút Apple Pencil viết được lên mọi trang;\nngón tay vẫn dùng để lật trang bình thường.</p></div></div><canvas class=\"ink\" data-page=\"1\"></canvas><div class=\"pfoot\"><span>Mục lục</span><span class=\"pn\">2 / 29</span></div></section><section class=\"page unit\" id=\"p2\" data-i=\"2\"><div class=\"sheet\">\n<div class=\"uhead\"><span class=\"un\">UNIT 01</span><h2>Thì hiện tại đơn và hiện tại tiếp diễn</h2><i>Present simple & present continuous</i></div>\n<p class=\"lead\">Hai thì này gây nhầm nhiều nhất vì tiếng Việt không chia động từ theo thời gian. Hãy nhớ một câu: hiện tại đơn nói về thói quen và sự thật, hiện tại tiếp diễn nói về việc đang diễn ra quanh lúc nói.</p><div class=\"gt\"><h4>Present simple — form</h4><table><tr><td class=\"k\">Khẳng định</td><td>I / you / we / they <b>work</b> · he / she / it <b>works</b></td></tr><tr><td class=\"k\">Phủ định</td><td>I <b>don't work</b> · he <b>doesn't work</b></td></tr><tr><td class=\"k\">Nghi vấn</td><td><b>Do</b> you work? · <b>Does</b> he work?</td></tr></table></div><div class=\"gt\"><h4>Present simple — dùng khi nào</h4><table><tr><td class=\"k\">Thói quen</td><td>I <b>check</b> stock every morning.</td></tr><tr><td class=\"k\">Sự thật lâu dài</td><td>Our office <b>opens</b> at eight.</td></tr><tr><td class=\"k\">Lịch trình cố định</td><td>The flight <b>leaves</b> at 6.40 tomorrow.</td></tr></table></div><div class=\"gt\"><h4>Present continuous — form</h4><table><tr><td class=\"k\">Khẳng định</td><td>I <b>am working</b> · he <b>is working</b> · they <b>are working</b></td></tr><tr><td class=\"k\">Phủ định</td><td>I <b>am not working</b> · they <b>aren't working</b></td></tr><tr><td class=\"k\">Nghi vấn</td><td><b>Are</b> you working? · <b>Is</b> he working?</td></tr></table></div><div class=\"gt\"><h4>Present continuous — dùng khi nào</h4><table><tr><td class=\"k\">Đang diễn ra lúc này</td><td>I <b>am writing</b> the report now.</td></tr><tr><td class=\"k\">Giai đoạn tạm thời</td><td>We <b>are testing</b> a new supplier this month.</td></tr><tr><td class=\"k\">Kế hoạch đã sắp xếp</td><td>I <b>am meeting</b> the client on Friday.</td></tr><tr><td class=\"k\">Xu hướng đang đổi</td><td>Prices <b>are rising</b> again.</td></tr></table></div>\n<div class=\"hints\"><h4>Ghi nhớ nhanh<i>Watch out</i></h4><ul><li>Trạng từ tần suất đứng <b>trước</b> động từ thường: I <i>often</i> travel. Nhưng đứng <b>sau</b> động từ to be: I <i>am</i> often late.</li><li>Động từ trạng thái (know, believe, want, need, own, cost, belong) thường <b>không</b> chia tiếp diễn: <i>I know</i> — không nói <s>I am knowing</s>.</li><li>Nhưng have, think, see đổi nghĩa thì chia được: <i>I'm having lunch</i> (đang ăn) khác <i>I have a car</i> (sở hữu).</li><li>Always + tiếp diễn diễn tả sự khó chịu: <i>He's always interrupting me.</i></li></ul></div></div><canvas class=\"ink\" data-page=\"2\"></canvas><div class=\"pfoot\"><span>Unit 1 · Ngữ pháp</span><span class=\"pn\">3 / 29</span></div></section><section class=\"page ex\" id=\"p3\" data-i=\"3\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 01 · PRACTICE</span><h2>Bài tập ngữ pháp</h2><i>Grammar practice</i></div><section class=\"ex\"><h3>Chia động từ hoặc điền từ đúng<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">She usually <input class=\"gap\" data-id=\"g1-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (finish) work at six.</span><span class=\"ck\" data-for=\"g1-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">Be quiet — I <input class=\"gap\" data-id=\"g1-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (talk) to a customer.</span><span class=\"ck\" data-for=\"g1-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\"><input class=\"gap\" data-id=\"g1-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> your team train every weekend? (Do / Does)</span><span class=\"ck\" data-for=\"g1-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">This month we <input class=\"gap\" data-id=\"g1-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (not use) the old system.</span><span class=\"ck\" data-for=\"g1-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">Water <input class=\"gap\" data-id=\"g1-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (boil) at 100 degrees.</span><span class=\"ck\" data-for=\"g1-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">I <input class=\"gap\" data-id=\"g1-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (see) the supplier tomorrow at ten.</span><span class=\"ck\" data-for=\"g1-6\"></span></li><li><span class=\"qn\">07</span><span class=\"qt\">He <input class=\"gap\" data-id=\"g1-7\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (not know) the answer yet.</span><span class=\"ck\" data-for=\"g1-7\"></span></li><li><span class=\"qn\">08</span><span class=\"qt\">Prices <input class=\"gap\" data-id=\"g1-8\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (go) up very fast this year.</span><span class=\"ck\" data-for=\"g1-8\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"g1\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"g1\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-g1\"></span></div></section></div><canvas class=\"ink\" data-page=\"3\"></canvas><div class=\"pfoot\"><span>Unit 1 · Bài tập ngữ pháp</span><span class=\"pn\">4 / 29</span></div></section><section class=\"page vocab\" id=\"p4\" data-i=\"4\"><div class=\"sheet\">\n<div class=\"uhead sm\"><span class=\"un\">UNIT 01 · VOCABULARY</span><h2>Work & daily routine · Công việc và nếp ngày</h2></div>\n<table class=\"vt\"><thead><tr><th>Từ</th><th>Phát âm</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead>\n<tbody><tr><td class=\"w\"><w>schedule</w></td><td class=\"ipa\">/ˈskedʒuːl/</td><td class=\"vn\">lịch trình</td><td class=\"exm\"><w>My schedule is full until Thursday.</w></td></tr><tr><td class=\"w\"><w>deadline</w></td><td class=\"ipa\">/ˈdedlaɪn/</td><td class=\"vn\">hạn chót</td><td class=\"exm\"><w>We missed the deadline by two days.</w></td></tr><tr><td class=\"w\"><w>shift</w></td><td class=\"ipa\">/ʃɪft/</td><td class=\"vn\">ca làm</td><td class=\"exm\"><w>She works the night shift.</w></td></tr><tr><td class=\"w\"><w>commute</w></td><td class=\"ipa\">/kəˈmjuːt/</td><td class=\"vn\">việc đi lại tới chỗ làm</td><td class=\"exm\"><w>My commute takes forty minutes.</w></td></tr><tr><td class=\"w\"><w>workload</w></td><td class=\"ipa\">/ˈwɜːrkloʊd/</td><td class=\"vn\">khối lượng công việc</td><td class=\"exm\"><w>The workload doubled last quarter.</w></td></tr><tr><td class=\"w\"><w>overtime</w></td><td class=\"ipa\">/ˈoʊvərtaɪm/</td><td class=\"vn\">làm thêm giờ</td><td class=\"exm\"><w>I did six hours of overtime.</w></td></tr><tr><td class=\"w\"><w>colleague</w></td><td class=\"ipa\">/ˈkɑːliːɡ/</td><td class=\"vn\">đồng nghiệp</td><td class=\"exm\"><w>A colleague covered my shift.</w></td></tr><tr><td class=\"w\"><w>routine</w></td><td class=\"ipa\">/ruːˈtiːn/</td><td class=\"vn\">thói quen thường ngày</td><td class=\"exm\"><w>I keep the same routine every morning.</w></td></tr><tr><td class=\"w\"><w>priority</w></td><td class=\"ipa\">/praɪˈɔːrəti/</td><td class=\"vn\">việc ưu tiên</td><td class=\"exm\"><w>Safety is our first priority.</w></td></tr><tr><td class=\"w\"><w>efficient</w></td><td class=\"ipa\">/ɪˈfɪʃnt/</td><td class=\"vn\">hiệu quả, ít lãng phí</td><td class=\"exm\"><w>The new process is far more efficient.</w></td></tr><tr><td class=\"w\"><w>postpone</w></td><td class=\"ipa\">/poʊstˈpoʊn/</td><td class=\"vn\">hoãn lại</td><td class=\"exm\"><w>They postponed the meeting to Monday.</w></td></tr><tr><td class=\"w\"><w>handle</w></td><td class=\"ipa\">/ˈhændl/</td><td class=\"vn\">xử lý, đảm đương</td><td class=\"exm\"><w>She handles all supplier contracts.</w></td></tr></tbody></table><div class=\"vset\"><h4>Collocations</h4><table><tr><td class=\"k\"><w>meet a deadline</w></td><td>kịp hạn</td></tr><tr><td class=\"k\"><w>take on a task</w></td><td>nhận một việc</td></tr><tr><td class=\"k\"><w>run behind schedule</w></td><td>trễ tiến độ</td></tr><tr><td class=\"k\"><w>catch up on work</w></td><td>làm bù công việc</td></tr></table></div><div class=\"vset\"><h4>Phrasal verbs</h4><table><tr><td class=\"k\"><w>put off</w></td><td>hoãn lại</td></tr><tr><td class=\"k\"><w>carry out</w></td><td>tiến hành</td></tr><tr><td class=\"k\"><w>take over</w></td><td>tiếp quản</td></tr><tr><td class=\"k\"><w>sort out</w></td><td>giải quyết cho xong</td></tr></table></div>\n<p class=\"tiny\">Chạm vào bất kỳ từ tiếng Anh nào để nghe phát âm.</p></div><canvas class=\"ink\" data-page=\"4\"></canvas><div class=\"pfoot\"><span>Unit 1 · Từ vựng</span><span class=\"pn\">5 / 29</span></div></section><section class=\"page ex\" id=\"p5\" data-i=\"5\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 01 · PRACTICE</span><h2>Bài tập từ vựng</h2><i>Vocabulary practice</i></div><section class=\"ex\"><h3>Điền từ còn thiếu<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">We can&#x27;t <input class=\"gap\" data-id=\"v1-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> the meeting again; the client is waiting.</span><span class=\"ck\" data-for=\"v1-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">She <input class=\"gap\" data-id=\"v1-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> the project when the manager left.</span><span class=\"ck\" data-for=\"v1-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">I stayed late to <input class=\"gap\" data-id=\"v1-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> on emails.</span><span class=\"ck\" data-for=\"v1-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">The team is running behind <input class=\"gap\" data-id=\"v1-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\">.</span><span class=\"ck\" data-for=\"v1-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">Please <input class=\"gap\" data-id=\"v1-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> out this problem before Friday.</span><span class=\"ck\" data-for=\"v1-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">He does a lot of <input class=\"gap\" data-id=\"v1-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> because we are short of staff.</span><span class=\"ck\" data-for=\"v1-6\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"v1\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"v1\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-v1\"></span></div></section></div><canvas class=\"ink\" data-page=\"5\"></canvas><div class=\"pfoot\"><span>Unit 1 · Bài tập từ vựng</span><span class=\"pn\">6 / 29</span></div></section><section class=\"page unit\" id=\"p6\" data-i=\"6\"><div class=\"sheet\">\n<div class=\"uhead\"><span class=\"un\">UNIT 02</span><h2>Quá khứ đơn và hiện tại hoàn thành</h2><i>Past simple & present perfect</i></div>\n<p class=\"lead\">Đây là cặp thì người Việt sai nhiều nhất. Quy tắc gọn: nếu câu gắn với một thời điểm đã xong thì dùng quá khứ đơn; nếu nối quá khứ với hiện tại và thời gian chưa kết thúc thì dùng hiện tại hoàn thành.</p><div class=\"gt\"><h4>Past simple</h4><table><tr><td class=\"k\">Khẳng định</td><td>I <b>worked</b> · he <b>went</b></td></tr><tr><td class=\"k\">Phủ định</td><td>I <b>didn't work</b></td></tr><tr><td class=\"k\">Nghi vấn</td><td><b>Did</b> you work?</td></tr><tr><td class=\"k\">Đi kèm</td><td>yesterday, last week, in 2019, two days ago, when I was a student</td></tr></table></div><div class=\"gt\"><h4>Present perfect</h4><table><tr><td class=\"k\">Khẳng định</td><td>I <b>have worked</b> · he <b>has gone</b></td></tr><tr><td class=\"k\">Phủ định</td><td>I <b>haven't worked</b></td></tr><tr><td class=\"k\">Nghi vấn</td><td><b>Have</b> you worked?</td></tr><tr><td class=\"k\">Đi kèm</td><td>already, yet, just, ever, never, since 2020, for three years, so far, this week</td></tr></table></div><div class=\"gt\"><h4>So sánh trực tiếp</h4><table><tr><td class=\"k\">Đã xong, có mốc</td><td>I <b>sent</b> the invoice <i>yesterday</i>.</td></tr><tr><td class=\"k\">Nối tới hiện tại</td><td>I <b>have sent</b> the invoice — <i>anh xem hộp thư đi</i>.</td></tr><tr><td class=\"k\">Thời gian đã hết</td><td>I <b>worked</b> there <i>for five years</i> (nay không còn).</td></tr><tr><td class=\"k\">Thời gian còn tiếp</td><td>I <b>have worked</b> here <i>for five years</i> (vẫn đang làm).</td></tr></table></div>\n<div class=\"hints\"><h4>Ghi nhớ nhanh<i>Watch out</i></h4><ul><li><b>for</b> đi với khoảng thời gian: for two years. <b>since</b> đi với mốc bắt đầu: since 2021.</li><li>Câu hỏi bắt đầu bằng <i>When</i> hầu như luôn dùng quá khứ đơn, không dùng hiện tại hoàn thành.</li><li><i>ever</i> và <i>never</i> nói về trải nghiệm cả đời: <i>Have you ever been to Japan?</i></li><li>Tiếng Anh-Mỹ đôi khi dùng quá khứ đơn với <i>already</i> và <i>just</i>; tiếng Anh-Anh giữ hiện tại hoàn thành.</li></ul></div></div><canvas class=\"ink\" data-page=\"6\"></canvas><div class=\"pfoot\"><span>Unit 2 · Ngữ pháp</span><span class=\"pn\">7 / 29</span></div></section><section class=\"page ex\" id=\"p7\" data-i=\"7\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 02 · PRACTICE</span><h2>Bài tập ngữ pháp</h2><i>Grammar practice</i></div><section class=\"ex\"><h3>Chia động từ hoặc điền từ đúng<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">I <input class=\"gap\" data-id=\"g2-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (work) in Da Nang from 2018 to 2021.</span><span class=\"ck\" data-for=\"g2-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">She <input class=\"gap\" data-id=\"g2-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (not finish) the report yet.</span><span class=\"ck\" data-for=\"g2-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">Have you ever <input class=\"gap\" data-id=\"g2-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (fly) business class?</span><span class=\"ck\" data-for=\"g2-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">We <input class=\"gap\" data-id=\"g2-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (sign) the contract two hours ago.</span><span class=\"ck\" data-for=\"g2-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">They <input class=\"gap\" data-id=\"g2-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (be) our supplier since 2020.</span><span class=\"ck\" data-for=\"g2-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">When <input class=\"gap\" data-id=\"g2-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> you start this job? (do / did)</span><span class=\"ck\" data-for=\"g2-6\"></span></li><li><span class=\"qn\">07</span><span class=\"qt\">He <input class=\"gap\" data-id=\"g2-7\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (just / send) you the file.</span><span class=\"ck\" data-for=\"g2-7\"></span></li><li><span class=\"qn\">08</span><span class=\"qt\">I <input class=\"gap\" data-id=\"g2-8\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (live) here for three years and I&#x27;m still here.</span><span class=\"ck\" data-for=\"g2-8\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"g2\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"g2\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-g2\"></span></div></section></div><canvas class=\"ink\" data-page=\"7\"></canvas><div class=\"pfoot\"><span>Unit 2 · Bài tập ngữ pháp</span><span class=\"pn\">8 / 29</span></div></section><section class=\"page vocab\" id=\"p8\" data-i=\"8\"><div class=\"sheet\">\n<div class=\"uhead sm\"><span class=\"un\">UNIT 02 · VOCABULARY</span><h2>Travel & experience · Đi lại và trải nghiệm</h2></div>\n<table class=\"vt\"><thead><tr><th>Từ</th><th>Phát âm</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead>\n<tbody><tr><td class=\"w\"><w>itinerary</w></td><td class=\"ipa\">/aɪˈtɪnəreri/</td><td class=\"vn\">lịch trình chuyến đi</td><td class=\"exm\"><w>Send me the itinerary before we book.</w></td></tr><tr><td class=\"w\"><w>boarding pass</w></td><td class=\"ipa\">/ˈbɔːrdɪŋ pæs/</td><td class=\"vn\">thẻ lên máy bay</td><td class=\"exm\"><w>Keep your boarding pass with you.</w></td></tr><tr><td class=\"w\"><w>layover</w></td><td class=\"ipa\">/ˈleɪoʊvər/</td><td class=\"vn\">chặng chờ nối chuyến</td><td class=\"exm\"><w>We have a six-hour layover in Doha.</w></td></tr><tr><td class=\"w\"><w>accommodation</w></td><td class=\"ipa\">/əˌkɑːməˈdeɪʃn/</td><td class=\"vn\">chỗ ở</td><td class=\"exm\"><w>The accommodation was better than expected.</w></td></tr><tr><td class=\"w\"><w>depart</w></td><td class=\"ipa\">/dɪˈpɑːrt/</td><td class=\"vn\">khởi hành</td><td class=\"exm\"><w>The train departs at noon.</w></td></tr><tr><td class=\"w\"><w>delay</w></td><td class=\"ipa\">/dɪˈleɪ/</td><td class=\"vn\">sự chậm trễ</td><td class=\"exm\"><w>There was a two-hour delay.</w></td></tr><tr><td class=\"w\"><w>luggage</w></td><td class=\"ipa\">/ˈlʌɡɪdʒ/</td><td class=\"vn\">hành lý</td><td class=\"exm\"><w>My luggage did not arrive.</w></td></tr><tr><td class=\"w\"><w>customs</w></td><td class=\"ipa\">/ˈkʌstəmz/</td><td class=\"vn\">hải quan</td><td class=\"exm\"><w>It took an hour to clear customs.</w></td></tr><tr><td class=\"w\"><w>destination</w></td><td class=\"ipa\">/ˌdestɪˈneɪʃn/</td><td class=\"vn\">điểm đến</td><td class=\"exm\"><w>The destination was worth the flight.</w></td></tr><tr><td class=\"w\"><w>book</w></td><td class=\"ipa\">/bʊk/</td><td class=\"vn\">đặt chỗ trước</td><td class=\"exm\"><w>I booked the hotel last night.</w></td></tr><tr><td class=\"w\"><w>confirm</w></td><td class=\"ipa\">/kənˈfɜːrm/</td><td class=\"vn\">xác nhận</td><td class=\"exm\"><w>Please confirm your reservation.</w></td></tr><tr><td class=\"w\"><w>insurance</w></td><td class=\"ipa\">/ɪnˈʃʊrəns/</td><td class=\"vn\">bảo hiểm</td><td class=\"exm\"><w>Travel insurance costs very little.</w></td></tr></tbody></table><div class=\"vset\"><h4>Collocations</h4><table><tr><td class=\"k\"><w>catch a flight</w></td><td>kịp chuyến bay</td></tr><tr><td class=\"k\"><w>miss a connection</w></td><td>lỡ chuyến nối</td></tr><tr><td class=\"k\"><w>check in</w></td><td>làm thủ tục</td></tr><tr><td class=\"k\"><w>book in advance</w></td><td>đặt trước</td></tr></table></div><div class=\"vset\"><h4>Phrasal verbs</h4><table><tr><td class=\"k\"><w>set off</w></td><td>khởi hành</td></tr><tr><td class=\"k\"><w>get in</w></td><td>tới nơi</td></tr><tr><td class=\"k\"><w>pick up</w></td><td>đón / lấy hàng</td></tr><tr><td class=\"k\"><w>check out</w></td><td>trả phòng</td></tr></table></div>\n<p class=\"tiny\">Chạm vào bất kỳ từ tiếng Anh nào để nghe phát âm.</p></div><canvas class=\"ink\" data-page=\"8\"></canvas><div class=\"pfoot\"><span>Unit 2 · Từ vựng</span><span class=\"pn\">9 / 29</span></div></section><section class=\"page ex\" id=\"p9\" data-i=\"9\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 02 · PRACTICE</span><h2>Bài tập từ vựng</h2><i>Vocabulary practice</i></div><section class=\"ex\"><h3>Điền từ còn thiếu<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">We <input class=\"gap\" data-id=\"v2-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> off at five to avoid the traffic.</span><span class=\"ck\" data-for=\"v2-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">Our flight <input class=\"gap\" data-id=\"v2-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> in at eleven last night.</span><span class=\"ck\" data-for=\"v2-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">I always <input class=\"gap\" data-id=\"v2-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> hotels in advance.</span><span class=\"ck\" data-for=\"v2-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">There was a long <input class=\"gap\" data-id=\"v2-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> because of the weather.</span><span class=\"ck\" data-for=\"v2-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">It took ages to clear <input class=\"gap\" data-id=\"v2-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> at the airport.</span><span class=\"ck\" data-for=\"v2-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">Can you <input class=\"gap\" data-id=\"v2-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> me up at the station?</span><span class=\"ck\" data-for=\"v2-6\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"v2\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"v2\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-v2\"></span></div></section></div><canvas class=\"ink\" data-page=\"9\"></canvas><div class=\"pfoot\"><span>Unit 2 · Bài tập từ vựng</span><span class=\"pn\">10 / 29</span></div></section><section class=\"page unit\" id=\"p10\" data-i=\"10\"><div class=\"sheet\">\n<div class=\"uhead\"><span class=\"un\">UNIT 03</span><h2>Các cách nói về tương lai</h2><i>Future forms</i></div>\n<p class=\"lead\">Tiếng Anh không có một thì tương lai duy nhất mà có bốn cách, và chọn sai làm câu nghe rất lạ. Điểm phân biệt là mức độ chắc chắn và việc đã sắp xếp trước hay chưa.</p><div class=\"gt\"><h4>Bốn cách nói tương lai</h4><table><tr><td class=\"k\">will + V</td><td>Quyết định ngay lúc nói, dự đoán, lời hứa: <i>I'll call you back.</i></td></tr><tr><td class=\"k\">be going to + V</td><td>Ý định đã có sẵn, hoặc dấu hiệu hiện tại: <i>We're going to open a second shop.</i></td></tr><tr><td class=\"k\">Hiện tại tiếp diễn</td><td>Đã hẹn cụ thể với ai đó: <i>I'm meeting the bank on Tuesday.</i></td></tr><tr><td class=\"k\">Hiện tại đơn</td><td>Lịch trình cố định: <i>The conference starts at nine.</i></td></tr></table></div><div class=\"gt\"><h4>Hai thì tương lai nâng cao</h4><table><tr><td class=\"k\">Future continuous</td><td>will be + V-ing — đang diễn ra tại một thời điểm sau này: <i>At ten I'll be flying.</i></td></tr><tr><td class=\"k\">Future perfect</td><td>will have + V3 — hoàn tất trước một mốc: <i>By June we'll have finished.</i></td></tr></table></div><div class=\"gt\"><h4>Mệnh đề thời gian</h4><table><tr><td class=\"k\">Không dùng will sau</td><td>when, after, before, as soon as, until</td></tr><tr><td class=\"k\">Đúng</td><td>I'll call you <b>when I arrive</b>. — không nói <s>when I will arrive</s></td></tr></table></div>\n<div class=\"hints\"><h4>Ghi nhớ nhanh<i>Watch out</i></h4><ul><li>Dự đoán có bằng chứng trước mắt dùng <i>going to</i>: <i>Look at the sky — it's going to rain.</i></li><li>Dự đoán dựa trên cảm nghĩ dùng <i>will</i>: <i>I think prices will fall next year.</i></li><li><i>shall</i> ngày nay chủ yếu dùng để đề nghị: <i>Shall we start?</i></li><li>Trong email công việc, <i>I will</i> nghe cam kết hơn <i>I'm going to</i>.</li></ul></div></div><canvas class=\"ink\" data-page=\"10\"></canvas><div class=\"pfoot\"><span>Unit 3 · Ngữ pháp</span><span class=\"pn\">11 / 29</span></div></section><section class=\"page ex\" id=\"p11\" data-i=\"11\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 03 · PRACTICE</span><h2>Bài tập ngữ pháp</h2><i>Grammar practice</i></div><section class=\"ex\"><h3>Chia động từ hoặc điền từ đúng<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">Look at those clouds — it <input class=\"gap\" data-id=\"g3-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (rain).</span><span class=\"ck\" data-for=\"g3-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">I&#x27;ll send the file as soon as I <input class=\"gap\" data-id=\"g3-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (get) home.</span><span class=\"ck\" data-for=\"g3-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">By next March we <input class=\"gap\" data-id=\"g3-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (open) three new branches.</span><span class=\"ck\" data-for=\"g3-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">The train <input class=\"gap\" data-id=\"g3-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (leave) at 7.15 every morning.</span><span class=\"ck\" data-for=\"g3-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">A: The phone is ringing. B: I <input class=\"gap\" data-id=\"g3-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (answer) it.</span><span class=\"ck\" data-for=\"g3-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">I <input class=\"gap\" data-id=\"g3-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (see) the dentist on Friday at four.</span><span class=\"ck\" data-for=\"g3-6\"></span></li><li><span class=\"qn\">07</span><span class=\"qt\">This time tomorrow I <input class=\"gap\" data-id=\"g3-7\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (fly) to Seoul.</span><span class=\"ck\" data-for=\"g3-7\"></span></li><li><span class=\"qn\">08</span><span class=\"qt\">We can&#x27;t decide until we <input class=\"gap\" data-id=\"g3-8\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (know) the price.</span><span class=\"ck\" data-for=\"g3-8\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"g3\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"g3\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-g3\"></span></div></section></div><canvas class=\"ink\" data-page=\"11\"></canvas><div class=\"pfoot\"><span>Unit 3 · Bài tập ngữ pháp</span><span class=\"pn\">12 / 29</span></div></section><section class=\"page vocab\" id=\"p12\" data-i=\"12\"><div class=\"sheet\">\n<div class=\"uhead sm\"><span class=\"un\">UNIT 03 · VOCABULARY</span><h2>Money & business · Tiền và kinh doanh</h2></div>\n<table class=\"vt\"><thead><tr><th>Từ</th><th>Phát âm</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead>\n<tbody><tr><td class=\"w\"><w>revenue</w></td><td class=\"ipa\">/ˈrevənuː/</td><td class=\"vn\">doanh thu</td><td class=\"exm\"><w>Revenue grew by twelve percent.</w></td></tr><tr><td class=\"w\"><w>profit margin</w></td><td class=\"ipa\">/ˈprɑːfɪt ˈmɑːrdʒɪn/</td><td class=\"vn\">biên lợi nhuận</td><td class=\"exm\"><w>Our margin is under pressure.</w></td></tr><tr><td class=\"w\"><w>invoice</w></td><td class=\"ipa\">/ˈɪnvɔɪs/</td><td class=\"vn\">hoá đơn</td><td class=\"exm\"><w>Please settle the invoice this week.</w></td></tr><tr><td class=\"w\"><w>deposit</w></td><td class=\"ipa\">/dɪˈpɑːzɪt/</td><td class=\"vn\">tiền đặt cọc</td><td class=\"exm\"><w>We ask for a thirty percent deposit.</w></td></tr><tr><td class=\"w\"><w>instalment</w></td><td class=\"ipa\">/ɪnˈstɔːlmənt/</td><td class=\"vn\">khoản trả góp</td><td class=\"exm\"><w>You can pay in six instalments.</w></td></tr><tr><td class=\"w\"><w>overhead</w></td><td class=\"ipa\">/ˈoʊvərhed/</td><td class=\"vn\">chi phí vận hành cố định</td><td class=\"exm\"><w>Rent is our biggest overhead.</w></td></tr><tr><td class=\"w\"><w>turnover</w></td><td class=\"ipa\">/ˈtɜːrnoʊvər/</td><td class=\"vn\">tổng doanh thu / vòng quay</td><td class=\"exm\"><w>Annual turnover reached two million.</w></td></tr><tr><td class=\"w\"><w>forecast</w></td><td class=\"ipa\">/ˈfɔːrkæst/</td><td class=\"vn\">dự báo</td><td class=\"exm\"><w>The forecast for next quarter looks flat.</w></td></tr><tr><td class=\"w\"><w>invest</w></td><td class=\"ipa\">/ɪnˈvest/</td><td class=\"vn\">đầu tư</td><td class=\"exm\"><w>They invested early and waited.</w></td></tr><tr><td class=\"w\"><w>negotiate</w></td><td class=\"ipa\">/nɪˈɡoʊʃieɪt/</td><td class=\"vn\">thương lượng</td><td class=\"exm\"><w>We negotiated a better rate.</w></td></tr><tr><td class=\"w\"><w>quote</w></td><td class=\"ipa\">/kwoʊt/</td><td class=\"vn\">báo giá</td><td class=\"exm\"><w>Can you send me a quote by Friday?</w></td></tr><tr><td class=\"w\"><w>break even</w></td><td class=\"ipa\">/breɪk ˈiːvn/</td><td class=\"vn\">hoà vốn</td><td class=\"exm\"><w>We expect to break even in month eight.</w></td></tr></tbody></table><div class=\"vset\"><h4>Collocations</h4><table><tr><td class=\"k\"><w>cut costs</w></td><td>cắt giảm chi phí</td></tr><tr><td class=\"k\"><w>raise capital</w></td><td>huy động vốn</td></tr><tr><td class=\"k\"><w>close a deal</w></td><td>chốt hợp đồng</td></tr><tr><td class=\"k\"><w>meet demand</w></td><td>đáp ứng nhu cầu</td></tr></table></div><div class=\"vset\"><h4>Phrasal verbs</h4><table><tr><td class=\"k\"><w>pay off</w></td><td>trả hết nợ / có kết quả</td></tr><tr><td class=\"k\"><w>set up</w></td><td>thành lập</td></tr><tr><td class=\"k\"><w>take off</w></td><td>cất cánh, tăng vọt</td></tr><tr><td class=\"k\"><w>cut back on</w></td><td>giảm bớt</td></tr></table></div>\n<p class=\"tiny\">Chạm vào bất kỳ từ tiếng Anh nào để nghe phát âm.</p></div><canvas class=\"ink\" data-page=\"12\"></canvas><div class=\"pfoot\"><span>Unit 3 · Từ vựng</span><span class=\"pn\">13 / 29</span></div></section><section class=\"page ex\" id=\"p13\" data-i=\"13\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 03 · PRACTICE</span><h2>Bài tập từ vựng</h2><i>Vocabulary practice</i></div><section class=\"ex\"><h3>Điền từ còn thiếu<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">Sales <input class=\"gap\" data-id=\"v3-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> off after the video went viral.</span><span class=\"ck\" data-for=\"v3-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">They <input class=\"gap\" data-id=\"v3-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> up the company in 2019.</span><span class=\"ck\" data-for=\"v3-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">We had to <input class=\"gap\" data-id=\"v3-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> back on advertising this quarter.</span><span class=\"ck\" data-for=\"v3-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">The investment finally <input class=\"gap\" data-id=\"v3-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> off last year.</span><span class=\"ck\" data-for=\"v3-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">Can you send me a <input class=\"gap\" data-id=\"v3-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> for two hundred units?</span><span class=\"ck\" data-for=\"v3-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">We expect to break <input class=\"gap\" data-id=\"v3-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> within a year.</span><span class=\"ck\" data-for=\"v3-6\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"v3\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"v3\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-v3\"></span></div></section></div><canvas class=\"ink\" data-page=\"13\"></canvas><div class=\"pfoot\"><span>Unit 3 · Bài tập từ vựng</span><span class=\"pn\">14 / 29</span></div></section><section class=\"page unit\" id=\"p14\" data-i=\"14\"><div class=\"sheet\">\n<div class=\"uhead\"><span class=\"un\">UNIT 04</span><h2>Động từ khuyết thiếu</h2><i>Modal verbs</i></div>\n<p class=\"lead\">Modal là nhóm từ quyết định giọng điệu của cả câu. Cùng một nội dung, đổi modal là đổi từ ra lệnh sang đề nghị lịch sự. Đây là phần ảnh hưởng trực tiếp tới cách người ta đánh giá bạn trong email công việc.</p><div class=\"gt\"><h4>Bổn phận và sự cần thiết</h4><table><tr><td class=\"k\">must</td><td>bắt buộc do người nói: <i>You must sign here.</i></td></tr><tr><td class=\"k\">have to</td><td>bắt buộc do quy định bên ngoài: <i>We have to file it by Friday.</i></td></tr><tr><td class=\"k\">should / ought to</td><td>lời khuyên: <i>You should check the contract.</i></td></tr><tr><td class=\"k\">needn't / don't have to</td><td>không cần thiết: <i>You don't have to come.</i></td></tr><tr><td class=\"k\">mustn't</td><td>cấm — khác hẳn don't have to: <i>You mustn't share this file.</i></td></tr></table></div><div class=\"gt\"><h4>Suy đoán</h4><table><tr><td class=\"k\">must be</td><td>chắc chắn là: <i>He must be in a meeting.</i></td></tr><tr><td class=\"k\">can't be</td><td>chắc chắn không phải: <i>That can't be the final price.</i></td></tr><tr><td class=\"k\">might / may / could be</td><td>có thể là: <i>She might be on leave.</i></td></tr><tr><td class=\"k\">must have + V3</td><td>chắc đã: <i>They must have left already.</i></td></tr></table></div><div class=\"gt\"><h4>Lịch sự trong công việc</h4><table><tr><td class=\"k\">Could you...?</td><td>lịch sự hơn Can you</td></tr><tr><td class=\"k\">Would you mind + V-ing?</td><td>rất lịch sự: <i>Would you mind resending it?</i></td></tr><tr><td class=\"k\">I was wondering if...</td><td>mở đầu mềm nhất cho một đề nghị khó</td></tr></table></div>\n<div class=\"hints\"><h4>Ghi nhớ nhanh<i>Watch out</i></h4><ul><li><i>must</i> và <i>have to</i> gần giống nhau ở khẳng định nhưng <b>ngược nhau</b> ở phủ định.</li><li>Modal không chia theo ngôi: <s>he musts</s> sai. Sau modal luôn là động từ nguyên thể không to.</li><li>Trong email, thay <i>You must send</i> bằng <i>Could you send</i> — cùng nội dung, khác hẳn cảm nhận.</li><li><i>should have + V3</i> nói về điều lẽ ra nên làm mà đã không làm: <i>I should have checked.</i></li></ul></div></div><canvas class=\"ink\" data-page=\"14\"></canvas><div class=\"pfoot\"><span>Unit 4 · Ngữ pháp</span><span class=\"pn\">15 / 29</span></div></section><section class=\"page ex\" id=\"p15\" data-i=\"15\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 04 · PRACTICE</span><h2>Bài tập ngữ pháp</h2><i>Grammar practice</i></div><section class=\"ex\"><h3>Chia động từ hoặc điền từ đúng<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">You <input class=\"gap\" data-id=\"g4-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> share this password with anyone. (cấm)</span><span class=\"ck\" data-for=\"g4-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">You <input class=\"gap\" data-id=\"g4-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> come to the office; you can work from home. (không cần)</span><span class=\"ck\" data-for=\"g4-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">He isn&#x27;t answering — he <input class=\"gap\" data-id=\"g4-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> be driving. (suy đoán chắc)</span><span class=\"ck\" data-for=\"g4-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">That <input class=\"gap\" data-id=\"g4-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> be the right invoice; the number is different.</span><span class=\"ck\" data-for=\"g4-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\"><input class=\"gap\" data-id=\"g4-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> you mind sending the file again?</span><span class=\"ck\" data-for=\"g4-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">We <input class=\"gap\" data-id=\"g4-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> file the report by law every quarter.</span><span class=\"ck\" data-for=\"g4-6\"></span></li><li><span class=\"qn\">07</span><span class=\"qt\">I <input class=\"gap\" data-id=\"g4-7\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> have checked the address before sending.</span><span class=\"ck\" data-for=\"g4-7\"></span></li><li><span class=\"qn\">08</span><span class=\"qt\">She <input class=\"gap\" data-id=\"g4-8\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> be on leave, but I&#x27;m not sure.</span><span class=\"ck\" data-for=\"g4-8\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"g4\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"g4\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-g4\"></span></div></section></div><canvas class=\"ink\" data-page=\"15\"></canvas><div class=\"pfoot\"><span>Unit 4 · Bài tập ngữ pháp</span><span class=\"pn\">16 / 29</span></div></section><section class=\"page vocab\" id=\"p16\" data-i=\"16\"><div class=\"sheet\">\n<div class=\"uhead sm\"><span class=\"un\">UNIT 04 · VOCABULARY</span><h2>Technology & online life · Công nghệ và đời sống mạng</h2></div>\n<table class=\"vt\"><thead><tr><th>Từ</th><th>Phát âm</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead>\n<tbody><tr><td class=\"w\"><w>upload</w></td><td class=\"ipa\">/ˈʌploʊd/</td><td class=\"vn\">tải lên</td><td class=\"exm\"><w>The upload finished in a minute.</w></td></tr><tr><td class=\"w\"><w>subscriber</w></td><td class=\"ipa\">/səbˈskraɪbər/</td><td class=\"vn\">người theo dõi trả phí</td><td class=\"exm\"><w>The channel gained ten thousand subscribers.</w></td></tr><tr><td class=\"w\"><w>engagement</w></td><td class=\"ipa\">/ɪnˈɡeɪdʒmənt/</td><td class=\"vn\">mức tương tác</td><td class=\"exm\"><w>Engagement dropped after the change.</w></td></tr><tr><td class=\"w\"><w>algorithm</w></td><td class=\"ipa\">/ˈælɡərɪðəm/</td><td class=\"vn\">thuật toán</td><td class=\"exm\"><w>Nobody fully understands the algorithm.</w></td></tr><tr><td class=\"w\"><w>notification</w></td><td class=\"ipa\">/ˌnoʊtɪfɪˈkeɪʃn/</td><td class=\"vn\">thông báo</td><td class=\"exm\"><w>Turn off notifications while you work.</w></td></tr><tr><td class=\"w\"><w>bandwidth</w></td><td class=\"ipa\">/ˈbændwɪdθ/</td><td class=\"vn\">băng thông</td><td class=\"exm\"><w>Live video eats bandwidth.</w></td></tr><tr><td class=\"w\"><w>backup</w></td><td class=\"ipa\">/ˈbækʌp/</td><td class=\"vn\">bản sao lưu</td><td class=\"exm\"><w>Keep a backup on a separate drive.</w></td></tr><tr><td class=\"w\"><w>glitch</w></td><td class=\"ipa\">/ɡlɪtʃ/</td><td class=\"vn\">lỗi vặt</td><td class=\"exm\"><w>There was a glitch during the stream.</w></td></tr><tr><td class=\"w\"><w>update</w></td><td class=\"ipa\">/ʌpˈdeɪt/</td><td class=\"vn\">bản cập nhật</td><td class=\"exm\"><w>The update fixed the crash.</w></td></tr><tr><td class=\"w\"><w>device</w></td><td class=\"ipa\">/dɪˈvaɪs/</td><td class=\"vn\">thiết bị</td><td class=\"exm\"><w>Test it on an older device.</w></td></tr><tr><td class=\"w\"><w>password</w></td><td class=\"ipa\">/ˈpæswɜːrd/</td><td class=\"vn\">mật khẩu</td><td class=\"exm\"><w>Change your password every few months.</w></td></tr><tr><td class=\"w\"><w>viral</w></td><td class=\"ipa\">/ˈvaɪrəl/</td><td class=\"vn\">lan truyền mạnh</td><td class=\"exm\"><w>The clip went viral overnight.</w></td></tr></tbody></table><div class=\"vset\"><h4>Collocations</h4><table><tr><td class=\"k\"><w>go viral</w></td><td>lan truyền mạnh</td></tr><tr><td class=\"k\"><w>log in</w></td><td>đăng nhập</td></tr><tr><td class=\"k\"><w>run out of storage</w></td><td>hết dung lượng</td></tr><tr><td class=\"k\"><w>stream live</w></td><td>phát trực tiếp</td></tr></table></div><div class=\"vset\"><h4>Phrasal verbs</h4><table><tr><td class=\"k\"><w>back up</w></td><td>sao lưu</td></tr><tr><td class=\"k\"><w>shut down</w></td><td>tắt máy / đóng cửa</td></tr><tr><td class=\"k\"><w>log out</w></td><td>đăng xuất</td></tr><tr><td class=\"k\"><w>plug in</w></td><td>cắm điện</td></tr></table></div>\n<p class=\"tiny\">Chạm vào bất kỳ từ tiếng Anh nào để nghe phát âm.</p></div><canvas class=\"ink\" data-page=\"16\"></canvas><div class=\"pfoot\"><span>Unit 4 · Từ vựng</span><span class=\"pn\">17 / 29</span></div></section><section class=\"page ex\" id=\"p17\" data-i=\"17\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 04 · PRACTICE</span><h2>Bài tập từ vựng</h2><i>Vocabulary practice</i></div><section class=\"ex\"><h3>Điền từ còn thiếu<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\"><input class=\"gap\" data-id=\"v4-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> up your files before the update.</span><span class=\"ck\" data-for=\"v4-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">The clip went <input class=\"gap\" data-id=\"v4-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> in two days.</span><span class=\"ck\" data-for=\"v4-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">I can&#x27;t <input class=\"gap\" data-id=\"v4-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> in; the password isn&#x27;t working.</span><span class=\"ck\" data-for=\"v4-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">My phone has <input class=\"gap\" data-id=\"v4-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> out of storage again.</span><span class=\"ck\" data-for=\"v4-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">There was a small <input class=\"gap\" data-id=\"v4-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> during the live stream.</span><span class=\"ck\" data-for=\"v4-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">Please <input class=\"gap\" data-id=\"v4-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> down the computer before you leave.</span><span class=\"ck\" data-for=\"v4-6\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"v4\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"v4\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-v4\"></span></div></section></div><canvas class=\"ink\" data-page=\"17\"></canvas><div class=\"pfoot\"><span>Unit 4 · Bài tập từ vựng</span><span class=\"pn\">18 / 29</span></div></section><section class=\"page unit\" id=\"p18\" data-i=\"18\"><div class=\"sheet\">\n<div class=\"uhead\"><span class=\"un\">UNIT 05</span><h2>Câu điều kiện</h2><i>Conditionals</i></div>\n<p class=\"lead\">Điều kiện là công cụ đàm phán mạnh nhất trong tiếng Anh. Người nói giỏi dùng câu điều kiện để ra đề nghị mà không cam kết, và để từ chối mà không mất lòng.</p><div class=\"gt\"><h4>Bốn dạng chính</h4><table><tr><td class=\"k\">Zero</td><td>If + hiện tại đơn, hiện tại đơn — sự thật luôn đúng: <i>If you heat ice, it melts.</i></td></tr><tr><td class=\"k\">First</td><td>If + hiện tại đơn, will + V — có thật, có thể xảy ra: <i>If we sign today, we'll start Monday.</i></td></tr><tr><td class=\"k\">Second</td><td>If + quá khứ đơn, would + V — giả định hiện tại: <i>If I had more time, I would learn Japanese.</i></td></tr><tr><td class=\"k\">Third</td><td>If + had + V3, would have + V3 — trái với quá khứ: <i>If we had ordered earlier, we would have saved money.</i></td></tr></table></div><div class=\"gt\"><h4>Dùng trong đàm phán</h4><table><tr><td class=\"k\">Đề nghị có điều kiện</td><td><i>If you increase the volume, we can lower the unit price.</i></td></tr><tr><td class=\"k\">Từ chối mềm</td><td><i>If it were up to me, I would agree — but the policy is fixed.</i></td></tr><tr><td class=\"k\">Cảnh báo lịch sự</td><td><i>Unless we receive the deposit, we can't reserve the stock.</i></td></tr></table></div><div class=\"gt\"><h4>Biến thể</h4><table><tr><td class=\"k\">unless</td><td>= if not: <i>Unless you confirm, we'll cancel.</i></td></tr><tr><td class=\"k\">as long as / provided that</td><td>miễn là: <i>as long as you pay on time</i></td></tr><tr><td class=\"k\">Trộn thì</td><td><i>If I had studied English earlier, I would have a better job now.</i></td></tr></table></div>\n<div class=\"hints\"><h4>Ghi nhớ nhanh<i>Watch out</i></h4><ul><li>Không dùng <i>will</i> ngay sau <i>if</i> trong câu điều kiện loại một.</li><li>Câu loại hai trang trọng dùng <i>were</i> cho mọi ngôi: <i>If I were you...</i></li><li><i>would</i> có thể rút gọn thành <i>'d</i>, nhưng trong hợp đồng nên viết đầy đủ.</li><li>Câu loại ba nói về việc không thể đổi được nữa, nên dùng nó để rút kinh nghiệm chứ đừng dùng để trách người khác.</li></ul></div></div><canvas class=\"ink\" data-page=\"18\"></canvas><div class=\"pfoot\"><span>Unit 5 · Ngữ pháp</span><span class=\"pn\">19 / 29</span></div></section><section class=\"page ex\" id=\"p19\" data-i=\"19\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 05 · PRACTICE</span><h2>Bài tập ngữ pháp</h2><i>Grammar practice</i></div><section class=\"ex\"><h3>Chia động từ hoặc điền từ đúng<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">If we <input class=\"gap\" data-id=\"g5-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (order) now, we&#x27;ll get the old price.</span><span class=\"ck\" data-for=\"g5-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">If I <input class=\"gap\" data-id=\"g5-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (be) you, I would ask for a written quote.</span><span class=\"ck\" data-for=\"g5-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">If they had told us earlier, we <input class=\"gap\" data-id=\"g5-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (change) the plan.</span><span class=\"ck\" data-for=\"g5-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\"><input class=\"gap\" data-id=\"g5-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> you confirm today, we can&#x27;t hold the stock.</span><span class=\"ck\" data-for=\"g5-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">If you heat metal, it <input class=\"gap\" data-id=\"g5-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (expand).</span><span class=\"ck\" data-for=\"g5-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">We&#x27;ll ship on Monday as long as the deposit <input class=\"gap\" data-id=\"g5-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (arrive).</span><span class=\"ck\" data-for=\"g5-6\"></span></li><li><span class=\"qn\">07</span><span class=\"qt\">If I <input class=\"gap\" data-id=\"g5-7\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (have) more capital, I would open a second branch.</span><span class=\"ck\" data-for=\"g5-7\"></span></li><li><span class=\"qn\">08</span><span class=\"qt\">If she <input class=\"gap\" data-id=\"g5-8\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (not miss) the flight, she would be here now.</span><span class=\"ck\" data-for=\"g5-8\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"g5\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"g5\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-g5\"></span></div></section></div><canvas class=\"ink\" data-page=\"19\"></canvas><div class=\"pfoot\"><span>Unit 5 · Bài tập ngữ pháp</span><span class=\"pn\">20 / 29</span></div></section><section class=\"page vocab\" id=\"p20\" data-i=\"20\"><div class=\"sheet\">\n<div class=\"uhead sm\"><span class=\"un\">UNIT 05 · VOCABULARY</span><h2>Negotiation · Đàm phán</h2></div>\n<table class=\"vt\"><thead><tr><th>Từ</th><th>Phát âm</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead>\n<tbody><tr><td class=\"w\"><w>proposal</w></td><td class=\"ipa\">/prəˈpoʊzl/</td><td class=\"vn\">đề xuất</td><td class=\"exm\"><w>Send your proposal by Wednesday.</w></td></tr><tr><td class=\"w\"><w>counteroffer</w></td><td class=\"ipa\">/ˈkaʊntərɔːfər/</td><td class=\"vn\">đề nghị ngược lại</td><td class=\"exm\"><w>They made a counteroffer the same day.</w></td></tr><tr><td class=\"w\"><w>concession</w></td><td class=\"ipa\">/kənˈseʃn/</td><td class=\"vn\">sự nhượng bộ</td><td class=\"exm\"><w>We made one concession on delivery.</w></td></tr><tr><td class=\"w\"><w>leverage</w></td><td class=\"ipa\">/ˈlevərɪdʒ/</td><td class=\"vn\">lợi thế đàm phán</td><td class=\"exm\"><w>Volume gives you leverage.</w></td></tr><tr><td class=\"w\"><w>terms</w></td><td class=\"ipa\">/tɜːrmz/</td><td class=\"vn\">điều khoản</td><td class=\"exm\"><w>The terms are acceptable.</w></td></tr><tr><td class=\"w\"><w>clause</w></td><td class=\"ipa\">/klɔːz/</td><td class=\"vn\">điều khoản trong hợp đồng</td><td class=\"exm\"><w>Read clause seven carefully.</w></td></tr><tr><td class=\"w\"><w>compromise</w></td><td class=\"ipa\">/ˈkɑːmprəmaɪz/</td><td class=\"vn\">thoả hiệp</td><td class=\"exm\"><w>We reached a compromise on the price.</w></td></tr><tr><td class=\"w\"><w>deadlock</w></td><td class=\"ipa\">/ˈdedlɑːk/</td><td class=\"vn\">bế tắc</td><td class=\"exm\"><w>The talks reached a deadlock.</w></td></tr><tr><td class=\"w\"><w>bargain</w></td><td class=\"ipa\">/ˈbɑːrɡən/</td><td class=\"vn\">mặc cả / món hời</td><td class=\"exm\"><w>He drives a hard bargain.</w></td></tr><tr><td class=\"w\"><w>walk away</w></td><td class=\"ipa\">/wɔːk əˈweɪ/</td><td class=\"vn\">rút khỏi thương vụ</td><td class=\"exm\"><w>Be ready to walk away.</w></td></tr><tr><td class=\"w\"><w>binding</w></td><td class=\"ipa\">/ˈbaɪndɪŋ/</td><td class=\"vn\">có ràng buộc pháp lý</td><td class=\"exm\"><w>This document is binding.</w></td></tr><tr><td class=\"w\"><w>waive</w></td><td class=\"ipa\">/weɪv/</td><td class=\"vn\">miễn, bỏ qua</td><td class=\"exm\"><w>They waived the setup fee.</w></td></tr></tbody></table><div class=\"vset\"><h4>Collocations</h4><table><tr><td class=\"k\"><w>reach an agreement</w></td><td>đạt thoả thuận</td></tr><tr><td class=\"k\"><w>meet halfway</w></td><td>gặp nhau ở giữa</td></tr><tr><td class=\"k\"><w>stand firm</w></td><td>giữ vững lập trường</td></tr><tr><td class=\"k\"><w>draw up a contract</w></td><td>soạn hợp đồng</td></tr></table></div><div class=\"vset\"><h4>Câu dùng được ngay</h4><table><tr><td class=\"k\"><w>I'm afraid that doesn't work for us.</w></td><td>Rất tiếc điều đó không ổn với chúng tôi.</td></tr><tr><td class=\"k\"><w>Let me come back to you on that.</w></td><td>Để tôi trả lời anh sau về việc đó.</td></tr><tr><td class=\"k\"><w>What flexibility do you have on price?</w></td><td>Anh linh hoạt được tới đâu về giá?</td></tr><tr><td class=\"k\"><w>That's outside our budget for this quarter.</w></td><td>Việc đó vượt ngân sách quý này.</td></tr></table></div>\n<p class=\"tiny\">Chạm vào bất kỳ từ tiếng Anh nào để nghe phát âm.</p></div><canvas class=\"ink\" data-page=\"20\"></canvas><div class=\"pfoot\"><span>Unit 5 · Từ vựng</span><span class=\"pn\">21 / 29</span></div></section><section class=\"page ex\" id=\"p21\" data-i=\"21\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 05 · PRACTICE</span><h2>Bài tập từ vựng</h2><i>Vocabulary practice</i></div><section class=\"ex\"><h3>Điền từ còn thiếu<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">They made a <input class=\"gap\" data-id=\"v5-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> on delivery time but not on price.</span><span class=\"ck\" data-for=\"v5-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">The talks reached a <input class=\"gap\" data-id=\"v5-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> and nobody moved.</span><span class=\"ck\" data-for=\"v5-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">Large volume gives the buyer more <input class=\"gap\" data-id=\"v5-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\">.</span><span class=\"ck\" data-for=\"v5-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">Let&#x27;s meet <input class=\"gap\" data-id=\"v5-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> and split the shipping cost.</span><span class=\"ck\" data-for=\"v5-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">Please read <input class=\"gap\" data-id=\"v5-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> seven before you sign.</span><span class=\"ck\" data-for=\"v5-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">They agreed to <input class=\"gap\" data-id=\"v5-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> the setup fee.</span><span class=\"ck\" data-for=\"v5-6\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"v5\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"v5\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-v5\"></span></div></section></div><canvas class=\"ink\" data-page=\"21\"></canvas><div class=\"pfoot\"><span>Unit 5 · Bài tập từ vựng</span><span class=\"pn\">22 / 29</span></div></section><section class=\"page unit\" id=\"p22\" data-i=\"22\"><div class=\"sheet\">\n<div class=\"uhead\"><span class=\"un\">UNIT 06</span><h2>Câu bị động và câu tường thuật</h2><i>Passive & reported speech</i></div>\n<p class=\"lead\">Hai cấu trúc này là xương sống của văn viết công việc. Bị động dùng khi việc quan trọng hơn người làm, tường thuật dùng khi bạn thuật lại điều người khác nói mà không cãi nhau về câu chữ.</p><div class=\"gt\"><h4>Bị động — form</h4><table><tr><td class=\"k\">Hiện tại</td><td>The invoice <b>is sent</b> every Monday.</td></tr><tr><td class=\"k\">Quá khứ</td><td>The goods <b>were shipped</b> yesterday.</td></tr><tr><td class=\"k\">Hiện tại hoàn thành</td><td>The contract <b>has been signed</b>.</td></tr><tr><td class=\"k\">Modal</td><td>The order <b>can be cancelled</b> before noon.</td></tr><tr><td class=\"k\">Có người thực hiện</td><td>The report <b>was written by</b> our legal team.</td></tr></table></div><div class=\"gt\"><h4>Khi nào dùng bị động</h4><table><tr><td class=\"k\">Không biết ai làm</td><td>The file <b>was deleted</b>.</td></tr><tr><td class=\"k\">Người làm không quan trọng</td><td>The parts <b>are made</b> in Vietnam.</td></tr><tr><td class=\"k\">Muốn giữ lịch sự, tránh chỉ trích</td><td>A mistake <b>was made</b> in the calculation.</td></tr></table></div><div class=\"gt\"><h4>Tường thuật — lùi thì</h4><table><tr><td class=\"k\">hiện tại đơn → quá khứ đơn</td><td>\"I need it today.\" → He said he <b>needed</b> it that day.</td></tr><tr><td class=\"k\">will → would</td><td>\"I'll call you.\" → She said she <b>would</b> call me.</td></tr><tr><td class=\"k\">can → could</td><td>\"We can deliver.\" → They said they <b>could</b> deliver.</td></tr><tr><td class=\"k\">Câu hỏi</td><td>\"Are you ready?\" → He asked <b>if I was</b> ready.</td></tr></table></div>\n<div class=\"hints\"><h4>Ghi nhớ nhanh<i>Watch out</i></h4><ul><li>Không lùi thì nếu điều được nói vẫn đúng: <i>He said the office opens at eight.</i></li><li>Đổi luôn trạng từ chỉ thời gian và nơi chốn: today → that day, here → there, tomorrow → the next day.</li><li><i>say</i> không có tân ngữ trực tiếp, <i>tell</i> thì có: <i>He told <b>me</b> that...</i> nhưng <i>He said that...</i></li><li>Bị động dùng quá nhiều làm văn nặng; trong email ngắn nên ưu tiên chủ động.</li></ul></div></div><canvas class=\"ink\" data-page=\"22\"></canvas><div class=\"pfoot\"><span>Unit 6 · Ngữ pháp</span><span class=\"pn\">23 / 29</span></div></section><section class=\"page ex\" id=\"p23\" data-i=\"23\"><div class=\"sheet\"><div class=\"uhead sm\"><span class=\"un\">UNIT 06 · PRACTICE</span><h2>Bài tập ngữ pháp</h2><i>Grammar practice</i></div><section class=\"ex\"><h3>Chia động từ hoặc điền từ đúng<i>Complete each sentence</i></h3><ol class=\"qs\"><li><span class=\"qn\">01</span><span class=\"qt\">The goods <input class=\"gap\" data-id=\"g6-1\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (ship) last Friday.</span><span class=\"ck\" data-for=\"g6-1\"></span></li><li><span class=\"qn\">02</span><span class=\"qt\">The contract <input class=\"gap\" data-id=\"g6-2\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (already / sign).</span><span class=\"ck\" data-for=\"g6-2\"></span></li><li><span class=\"qn\">03</span><span class=\"qt\">These parts <input class=\"gap\" data-id=\"g6-3\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (make) in Da Nang.</span><span class=\"ck\" data-for=\"g6-3\"></span></li><li><span class=\"qn\">04</span><span class=\"qt\">The order <input class=\"gap\" data-id=\"g6-4\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (can / cancel) before noon.</span><span class=\"ck\" data-for=\"g6-4\"></span></li><li><span class=\"qn\">05</span><span class=\"qt\">&quot;I&#x27;ll send it tomorrow.&quot; → He said he <input class=\"gap\" data-id=\"g6-5\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> send it the next day.</span><span class=\"ck\" data-for=\"g6-5\"></span></li><li><span class=\"qn\">06</span><span class=\"qt\">&quot;Are you free on Monday?&quot; → She asked <input class=\"gap\" data-id=\"g6-6\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> I was free on Monday.</span><span class=\"ck\" data-for=\"g6-6\"></span></li><li><span class=\"qn\">07</span><span class=\"qt\">&quot;We can&#x27;t lower the price.&quot; → They said they <input class=\"gap\" data-id=\"g6-7\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> lower the price.</span><span class=\"ck\" data-for=\"g6-7\"></span></li><li><span class=\"qn\">08</span><span class=\"qt\">A mistake <input class=\"gap\" data-id=\"g6-8\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> (make) in the invoice.</span><span class=\"ck\" data-for=\"g6-8\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"g6\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"g6\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-g6\"></span></div></section></div><canvas class=\"ink\" data-page=\"23\"></canvas><div class=\"pfoot\"><span>Unit 6 · Bài tập ngữ pháp</span><span class=\"pn\">24 / 29</span></div></section><section class=\"page vocab\" id=\"p24\" data-i=\"24\"><div class=\"sheet\">\n<div class=\"uhead sm\"><span class=\"un\">UNIT 06 · VOCABULARY</span><h2>Meetings & email · Họp hành và thư từ</h2></div>\n<table class=\"vt\"><thead><tr><th>Từ</th><th>Phát âm</th><th>Nghĩa</th><th>Ví dụ</th></tr></thead>\n<tbody><tr><td class=\"w\"><w>agenda</w></td><td class=\"ipa\">/əˈdʒendə/</td><td class=\"vn\">chương trình họp</td><td class=\"exm\"><w>Please stick to the agenda.</w></td></tr><tr><td class=\"w\"><w>minutes</w></td><td class=\"ipa\">/ˈmɪnɪts/</td><td class=\"vn\">biên bản họp</td><td class=\"exm\"><w>I'll circulate the minutes tonight.</w></td></tr><tr><td class=\"w\"><w>attachment</w></td><td class=\"ipa\">/əˈtætʃmənt/</td><td class=\"vn\">tệp đính kèm</td><td class=\"exm\"><w>The attachment did not open.</w></td></tr><tr><td class=\"w\"><w>follow-up</w></td><td class=\"ipa\">/ˈfɑːloʊʌp/</td><td class=\"vn\">việc theo sau</td><td class=\"exm\"><w>I'll send a follow-up email.</w></td></tr><tr><td class=\"w\"><w>deadline extension</w></td><td class=\"ipa\">/ˈdedlaɪn ɪkˈstenʃn/</td><td class=\"vn\">gia hạn</td><td class=\"exm\"><w>We requested a deadline extension.</w></td></tr><tr><td class=\"w\"><w>clarify</w></td><td class=\"ipa\">/ˈklærəfaɪ/  data-for=\"t2-12\"></span></li><li><span class=\"qn\">13</span><span class=\"qt\">They agreed to <input class=\"gap\" data-id=\"t2-13\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> the setup fee.</span><span class=\"ck\" data-for=\"t2-13\"></span></li><li><span class=\"qn\">14</span><span class=\"qt\">Let&#x27;s <input class=\"gap\" data-id=\"t2-14\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> through the agenda quickly.</span><span class=\"ck\" data-for=\"t2-14\"></span></li><li><span class=\"qn\">15</span><span class=\"qt\">Please <input class=\"gap\" data-id=\"t2-15\" spellcheck=\"false\" autocapitalize=\"none\" autocorrect=\"off\"> up your files before the update.</span><span class=\"ck\" data-for=\"t2-15\"></span></li></ol><div class=\"exbar\"><button class=\"btn\" data-check=\"t2\">KIỂM TRA</button><button class=\"btn ghost\" data-reveal=\"t2\">HIỆN ĐÁP ÁN</button><span class=\"score\" id=\"sc-t2\"></span></div></section></div><canvas class=\"ink\" data-page=\"27\"></canvas><div class=\"pfoot\"><span>Progress test 2</span><span class=\"pn\">28 / 29</span></div></section><section class=\"page key\" id=\"p28\" data-i=\"28\"><div class=\"sheet\"><h2 class=\"ph\">ĐÁP ÁN<i>Answer key</i></h2><p class=\"tiny\">Một số câu có nhiều đáp án đúng; phần chấm tự động chấp nhận cả dạng rút gọn.</p><div class=\"keys\"><div class=\"kb\"><h4>Unit 1 · Ngữ pháp</h4><ol class=\"key\"><li><span class=\"qn\">01</span>finishes</li><li><span class=\"qn\">02</span>am talking</li><li><span class=\"qn\">03</span>Does</li><li><span class=\"qn\">04</span>aren't using</li><li><span class=\"qn\">05</span>boils</li><li><span class=\"qn\">06</span>am seeing</li><li><span class=\"qn\">07</span>doesn't know</li><li><span class=\"qn\">08</span>are going</li></ol></div><div class=\"kb\"><h4>Unit 1 · Từ vựng</h4><ol class=\"key\"><li><span class=\"qn\">01</span>put off</li><li><span class=\"qn\">02</span>took over</li><li><span class=\"qn\">03</span>catc
